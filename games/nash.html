<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH -Winner's Curse-</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --felt-0:#081C16;
    --felt-1:#0B2B22;
    --felt-2:#123527;
    --ivory:#EDE6D6;
    --ivory-dim:#B9B0A0;
    --gold:#C9A227;
    --gold-bright:#E4C158;
    --navy:#1E3A5F;
    --navy-bright:#3E6EA5;
    --wax:#7A2E2E;
    --wax-bright:#A64444;
    --line:rgba(201,162,39,0.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,162,39,0.08), transparent 55%),
      radial-gradient(ellipse at 50% 50%, var(--felt-2), var(--felt-0) 75%);
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
    display:flex;
    justify-content:center;
  }

  .app{width:100%;max-width:640px;}

  .masthead{
    text-align:center;
    margin-bottom:14px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .top-controls{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:10px;
  }
  .pill-btn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-bright);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    padding:5px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .pill-btn.active{background:var(--gold);color:#1c1305;}
  .masthead .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.28em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .masthead h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:36px;
    letter-spacing:0.05em;
    margin:0;
    color:var(--ivory);
  }
  .masthead h1 span{color:var(--gold-bright);font-style:italic;font-weight:500;}
  .masthead .sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:14px;
    color:var(--ivory-dim);
    margin-top:4px;
  }

  .round-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ivory-dim);
    letter-spacing:0.08em;
    margin-bottom:16px;
  }
  .round-strip b{color:var(--gold-bright);font-weight:600;}

  .meta-bar-wrap{margin-bottom:16px;}
  .meta-bar-label{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--ivory-dim);
    margin-bottom:5px;
  }
  .meta-bar{
    display:flex;
    height:8px;
    border-radius:5px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .meta-bar .seg-aggr{background:linear-gradient(90deg,var(--wax),var(--wax-bright));}
  .meta-bar .seg-safe{background:linear-gradient(90deg,#1E3A5F,#3E6EA5);}

  /* Role card */
  .card-stage{
    position:relative;
    margin-bottom:20px;
    padding-top:6px;
  }
  .card-stack{position:relative;}
  .card-stack::before,
  .card-stack::after{
    content:"";
    position:absolute;
    left:50%;
    border-radius:14px;
    border:1px solid rgba(201,162,39,0.15);
  }
  .card-stack::before{
    top:-4px; transform:translateX(-50%) rotate(-2.5deg);
    width:calc(100% - 10px); height:100%;
    background:linear-gradient(160deg,#152c22,#0c2018);
    z-index:1;
  }
  .card-stack::after{
    top:-8px; transform:translateX(-50%) rotate(2deg);
    width:calc(100% - 20px); height:100%;
    background:linear-gradient(160deg,#122519,#0a1c15);
    z-index:0;
  }
  .card{
    position:relative;
    z-index:2;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,162,39,0.10), transparent 60%),
      linear-gradient(165deg, #1a3527, #0d2119 65%);
    border:1px solid rgba(201,162,39,0.5);
    border-radius:14px;
    padding:22px 20px 20px;
    box-shadow:
      0 2px 0 rgba(0,0,0,0.4),
      0 14px 30px -10px rgba(0,0,0,0.65),
      inset 0 0 0 1px rgba(237,230,214,0.04);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(201,162,39,0.28);
    border-radius:9px;
    pointer-events:none;
  }
  .card.hidden-card{border-color:rgba(166,68,68,0.55);}
  .card.hidden-card::before{border-color:rgba(166,68,68,0.3);}
  .card-icon{width:52px;height:52px;margin:2px auto 8px;display:block;opacity:0.92;}
  .card-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--ivory-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .seal{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:rgba(122,46,46,0.28);
    border:1px solid var(--wax-bright);
    color:#E8B9B9;
    padding:3px 9px 3px 7px;
    border-radius:20px;
    font-size:9.5px;
    letter-spacing:0.08em;
  }
  .card-title{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:27px;
    margin:6px 0 2px;
    text-align:center;
    color:var(--gold-bright);
    letter-spacing:0.01em;
  }
  .card-type{
    font-size:11px;
    color:var(--ivory-dim);
    text-align:center;
    margin-bottom:4px;
    letter-spacing:0.03em;
  }
  .card-classic{
    font-size:10.5px;
    color:var(--gold);
    text-align:center;
    margin-bottom:12px;
    font-style:italic;
  }
  .card-desc{
    font-size:12.5px;
    line-height:1.7;
    color:var(--ivory);
    border-top:1px dashed rgba(201,162,39,0.3);
    padding-top:12px;
  }
  .matrix{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 10px;
    color:var(--ivory-dim);
    background:rgba(0,0,0,0.18);
    border-radius:6px;
    padding:10px 12px;
  }
  .matrix div span{color:var(--gold);}
  .ne-line{
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--gold-bright);
    text-align:center;
    background:rgba(201,162,39,0.08);
    border:1px solid var(--line);
    border-radius:4px;
    padding:6px 8px;
  }
  .ne-line b{color:var(--ivory);font-weight:600;}

  .wax-stamp{
    position:absolute;
    top:14px;
    right:14px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #A64444, #5E2222 70%);
    box-shadow:0 3px 6px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,255,255,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-8deg);
    z-index:3;
  }
  .wax-stamp svg{width:22px;height:22px;}

  /* Seats */
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .seat{
    background:rgba(18,53,39,0.55);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 12px 10px;
    position:relative;
    transition:box-shadow .5s ease, border-color .5s ease;
  }
  .seat.you{border-color:rgba(201,162,39,0.4);}
  .seat .name{
    font-size:12.5px;
    font-weight:600;
    color:var(--ivory);
  }
  .seat .tag{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:11px;
    line-height:1.5;
    color:var(--ivory-dim);
    margin-top:3px;
    min-height:16px;
  }
  .resources{display:flex;gap:10px;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .res{display:flex;align-items:center;gap:4px;}
  .res.gold-r{color:var(--gold-bright);}
  .res.navy-r{color:#7FA7DE;}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .dot.gold-d{background:var(--gold);}
  .dot.navy-d{background:var(--navy-bright);}

  .seat.rank-1{border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright), 0 0 18px rgba(228,193,88,0.35);}
  .seat.rank-2{border-color:rgba(228,193,88,0.4);box-shadow:0 0 10px rgba(228,193,88,0.12);}
  .badge{position:absolute;top:-8px;right:10px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.08em;padding:2px 7px;border-radius:10px;}
  .badge.first{background:var(--gold-bright);color:#1c1305;}
  .badge.second{background:rgba(228,193,88,0.25);color:var(--gold-bright);border:1px solid var(--gold);}

  /* Bid controls */
  .bidbox{background:rgba(8,28,22,0.6);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:16px;}
  .bidbox h3{margin:0 0 12px;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ivory);}

  .chip-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .chip-stack-wrap{position:relative;width:52px;height:52px;flex-shrink:0;}
  .chip{position:absolute;left:50%;width:38px;height:38px;border-radius:50%;transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.25), inset 0 0 0 4px rgba(255,255,255,0.08);}
  .chip.gold-c{background:radial-gradient(circle at 35% 30%, #E4C158, #B4860E 75%);}
  .chip.navy-c{background:radial-gradient(circle at 35% 30%, #5C8FCB, #1E3A5F 75%);}
  .chip-count-badge{position:absolute;bottom:-2px;right:-2px;background:var(--felt-0);border:1px solid var(--gold);color:var(--gold-bright);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;border-radius:8px;padding:1px 5px;z-index:5;}
  .chip-controls{flex:1;}
  .chip-controls .top-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ivory-dim);margin-bottom:6px;}
  .chip-controls .top-row b{font-family:'IBM Plex Mono',monospace;color:var(--gold-bright);font-size:15px;}
  .chip-btns{display:flex;gap:6px;}
  .chip-btn{flex:1;padding:7px 0;background:rgba(201,162,39,0.1);border:1px solid var(--gold);border-radius:4px;color:var(--gold-bright);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;cursor:pointer;}
  .chip-btn:disabled{opacity:0.3;}
  .chip-btn.wide{flex:1.8;}
  .chip-remain{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ivory-dim);margin-top:5px;line-height:1.5;}
  .resource-note{
    font-size:11px;
    line-height:1.7;
    color:var(--ivory-dim);
    background:rgba(0,0,0,0.15);
    border-left:2px solid var(--gold);
    padding:8px 10px;
    margin-bottom:14px;
  }
  .resource-note b{color:var(--gold-bright);}

  .total-row{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ivory-dim);}
  .total-row b{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--gold-bright);}

  button.primary{width:100%;margin-top:14px;padding:13px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));border:none;border-radius:3px;color:#1c1305;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.03em;cursor:pointer;}
  button.primary:disabled{opacity:0.35;cursor:default;}
  button.secondary{width:100%;margin-top:14px;padding:12px;background:transparent;border:1px solid var(--gold);border-radius:3px;color:var(--gold-bright);font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}

  .reveal{background:rgba(18,53,39,0.55);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:16px;font-size:13px;line-height:1.8;}
  .reveal .winner{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--gold-bright);margin-bottom:4px;}
  .reveal .hint{color:var(--ivory-dim);font-size:12px;}

  .log{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ivory-dim);}
  .log summary{cursor:pointer;letter-spacing:0.1em;color:var(--gold);margin-bottom:8px;}
  .log-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(237,230,214,0.06);gap:10px;}

  .gameover{text-align:center;padding:30px 10px;}
  .gameover h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold-bright);}
  .standing{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .standing b{color:var(--gold-bright);font-family:'IBM Plex Mono',monospace;}

  .overlay{position:fixed;inset:0;background:rgba(5,14,11,0.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
  .overlay-box{max-width:440px;max-height:88vh;overflow-y:auto;background:linear-gradient(165deg,#1a3527,#0d2119);border:1px solid var(--gold);border-radius:10px;padding:24px 22px;}
  .overlay-box h2{font-family:'Cormorant Garamond',serif;font-size:23px;color:var(--gold-bright);margin:0 0 12px;}
  .overlay-box h3{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold-bright);margin:16px 0 6px;}
  .overlay-box p{font-size:12.5px;line-height:1.8;color:var(--ivory);margin:0 0 8px;}
  .overlay-box ol{padding-left:18px;margin:0 0 4px;font-size:13px;line-height:1.9;color:var(--ivory);}
  .overlay-box ol li b{color:var(--gold-bright);}
  .theory-card{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;}
  .theory-card .tname{font-weight:700;color:var(--gold-bright);font-size:13px;}
  .theory-card .tclassic{font-size:11px;color:var(--gold);font-style:italic;margin-bottom:4px;}

  .roster-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .roster-card{
    background:rgba(18,53,39,0.55);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .roster-card.picked{
    border-color:var(--gold-bright);
    box-shadow:0 0 14px rgba(228,193,88,0.3);
    background:rgba(201,162,39,0.1);
  }
  .roster-avatar{font-size:30px;margin-bottom:4px;}
  .roster-name{font-size:12px;font-weight:600;color:var(--ivory);margin-bottom:3px;}
  .roster-bio{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10.5px;color:var(--ivory-dim);line-height:1.4;}
  .pick-counter{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold-bright);
    margin-bottom:14px;
  }
</style>
</head>

let state = null;

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function initState(){
  state = {
    round: 1,
    phase: 'select', // select | bidding | resolved | battle | battle-resolved | gameover
    card: null,
    meta: {aggressive:50, safe:50},
    introSeen: false,
    helpOpen: false,
    selectedAI: [],
    players: [],
    bidImmediate: 0,
    bidFuture: 0,
    result: null,
    battle: null,
    log: []
  };
  render();
}

function toggleSelectAI(id){
  const i = state.selectedAI.indexOf(id);
  if(i >= 0){
    state.selectedAI.splice(i,1);
  } else if(state.selectedAI.length < 3){
    state.selectedAI.push(id);
  }
  render();
}

function confirmSelection(){
  if(state.selectedAI.length !== 3) return;
  const chosen = ROSTER.filter(a=>state.selectedAI.includes(a.id));
  state.players = [
    {id:'you', avatar:'🎯', name:{ja:'あなた',en:'You'}, isYou:true, immediate:IMMEDIATE_START, future:FUTURE_START, score:0, lastBidTotal:6, lastBattleAction:null, lastLostTo:null},
    ...chosen.map(a => ({...a, isYou:false, immediate:IMMEDIATE_START, future:FUTURE_START, score:0, lastLostTo:null, lastBattleAction:null}))
  ];
  state.round = 1;
  state.card = drawCard();
  state.meta = {aggressive:50, safe:50};
  state.bidImmediate = 0;
  state.bidFuture = 0;
  state.result = null;
  state.battle = null;
  state.log = [];
  state.phase = 'bidding';
  render();
}

function pName(p){ return p.isYou ? (lang==='ja'?'あなた':'You') : p.name[lang]; }

function drawCard(){
  const base = ROLE_TYPES[Math.floor(Math.random()*ROLE_TYPES.length)];
  const hidden = Math.random() < 0.28;
  return {...base, hidden};
}

function aiBid(ai, card, players, round){
  const you = players.find(p=>p.isYou);
  let ratio;
  let useFuture = 0;

  if(ai.id === 'trader'){
    ratio = 0.7 + Math.random()*0.25;
    if(Math.random() < 0.3) useFuture = Math.floor(ai.future * (0.15 + Math.random()*0.15));
  } else if(ai.id === 'actuary'){
    if(card.hidden){ ratio = 0.05 + Math.random()*0.1; }
    else { ratio = 0.25 + Math.random()*0.15; }
    useFuture = 0;
  } else if(ai.id === 'poker'){
    const mimicTarget = you.lastBidTotal || 6;
    const noisy = mimicTarget * (0.9 + Math.random()*0.2);
    ratio = Math.min(0.95, noisy / Math.max(ai.immediate,1));
  } else if(ai.id === 'negotiator'){
    const grudge = ai.lastLostTo === 'you';
    ratio = grudge ? (0.75 + Math.random()*0.2) : (0.4 + Math.random()*0.15);
    if(grudge) useFuture = Math.floor(ai.future * 0.2);
  } else if(ai.id === 'dealer'){
    ratio = 0.45 + Math.random()*0.15;
  } else if(ai.id === 'diplomat'){
    ratio = 0.22 + Math.random()*0.12;
  } else if(ai.id === 'banker'){
    ratio = 0.6 + Math.random()*0.2;
    if(Math.random() < 0.5) useFuture = Math.floor(ai.future * (0.2 + Math.random()*0.2));
  } else if(ai.id === 'illusionist'){
    ratio = 0.1 + Math.random()*0.8;
    if(Math.random() < 0.25) useFuture = Math.floor(ai.future * Math.random()*0.3);
  } else if(ai.id === 'mathematician'){
    ratio = 0.5 + Math.random()*0.15;
  } else if(ai.id === 'politician'){
    ratio = 0.3 + (state.meta.aggressive/100)*0.5 + Math.random()*0.1;
  } else {
    ratio = 0.4 + Math.random()*0.2;
  }

  let immSpend = Math.min(ai.immediate, Math.round(ai.immediate * ratio));
  let futSpend = Math.min(ai.future, useFuture);
  if(card.hidden && ai.id !== 'trader' && ai.id !== 'negotiator'){
    immSpend = Math.round(immSpend * 0.6);
  }
  return {immediate: Math.max(0,immSpend), future: Math.max(0,futSpend)};
}

function updateMeta(aAction, bAction){
  let shift = 0;
  shift += (aAction==='強気') ? 3 : -3;
  shift += (bAction==='強気') ? 3 : -3;
  state.meta.aggressive = clamp(state.meta.aggressive + shift, 8, 92);
  state.meta.safe = 100 - state.meta.aggressive;
}

function mixedNEProb(card){
  const safeA = card.actions[0], aggrA = card.actions[1];
  const aggrSafe = card.payoff(aggrA, safeA)[1];
  const aggrAggr = card.payoff(aggrA, aggrA)[1];
  const safeSafe = card.payoff(safeA, safeA)[1];
  const safeAggr = card.payoff(safeA, aggrA)[1];
  const A = aggrSafe - aggrAggr;
  const B = safeSafe - safeAggr;
  const denom = (B - A);
  if(Math.abs(denom) < 1e-6) return 0.5;
  return clamp(B/denom, 0.05, 0.95);
}

function aiBattleDecision(ai, card, opponentId){
  const safeAction = card.actions[0];
  const aggroAction = card.actions[1];

  if(ai.id === 'mathematician'){
    const ne = findPureNE(card);
    const uniqueAggr = ne.length===1 && ne[0][0]===aggroAction && ne[0][1]===aggroAction;
    const p = uniqueAggr ? 0.92 : mixedNEProb(card);
    let leansAggr = Math.random() < p;
    if(Math.random() < 0.3) leansAggr = !leansAggr; // deliberately deviates sometimes
    return leansAggr ? aggroAction : safeAction;
  }

  if(ai.id === 'politician'){
    const prob = clamp(0.15 + (state.meta.aggressive/100)*0.8, 0.05, 0.95);
    return Math.random() < prob ? aggroAction : safeAction;
  }

  let base;
  if(ai.id === 'trader') base = 0.72;
  else if(ai.id === 'actuary') base = 0.22;
  else if(ai.id === 'poker'){
    const you = state.players.find(p=>p.isYou);
    base = you.lastBattleAction === aggroAction ? 0.75 : (you.lastBattleAction === safeAction ? 0.2 : 0.45);
  } else if(ai.id === 'negotiator'){
    base = (ai.lastLostTo === opponentId) ? 0.85 : 0.32;
  } else if(ai.id === 'dealer'){
    base = 0.45;
  } else if(ai.id === 'diplomat'){
    base = (ai.lastLostTo === opponentId) ? 0.35 : 0.12;
  } else if(ai.id === 'banker'){
    base = 0.68;
  } else if(ai.id === 'illusionist'){
    base = 0.5;
  } else base = 0.4;

  const metaPull = state.meta.aggressive/100;
  const prob = clamp(base*0.7 + metaPull*0.3, 0.05, 0.95);
  return Math.random() < prob ? aggroAction : safeAction;
}

function beginBattle(){
  const r = state.result;
  const card = state.card;
  const a = state.players.find(p=>p.id===r.winnerId);
  const b = r.secondId ? state.players.find(p=>p.id===r.secondId) : null;

  if(!b){
    state.phase = 'battle-resolved';
    state.battle = {a:a.id, b:null, aAction:null, bAction:null, delta:[0,0], skipped:true};
    render();
    return;
  }

  state.battle = {a:a.id, b:b.id};

  if(!a.isYou && !b.isYou){
    const aAction = aiBattleDecision(a, card, b.id);
    const bAction = aiBattleDecision(b, card, a.id);
    finishBattle(aAction, bAction);
  } else {
    state.phase = 'battle';
    render();
  }
}

function chooseBattleAction(action){
  const card = state.card;
  const a = state.players.find(p=>p.id===state.battle.a);
  const b = state.players.find(p=>p.id===state.battle.b);
  let aAction, bAction;
  if(a.isYou){
    aAction = action;
    bAction = aiBattleDecision(b, card, a.id);
  } else {
    bAction = action;
    aAction = aiBattleDecision(a, card, b.id);
  }
  finishBattle(aAction, bAction);
}

function finishBattle(aAction, bAction){
  const card = state.card;
  const a = state.players.find(p=>p.id===state.battle.a);
  const b = state.players.find(p=>p.id===state.battle.b);
  const [da, db] = card.payoff(aAction, bAction);
  a.score += da;
  b.score += db;
  a.lastBattleAction = aAction;
  b.lastBattleAction = bAction;

  if(da > db){ a.lastLostTo = null; b.lastLostTo = a.id; }
  else if(db > da){ b.lastLostTo = null; a.lastLostTo = b.id; }

  updateMeta(aAction, bAction);

  const neList = findPureNE(card);
  const isNE = neList.some(([x,y])=> x===aAction && y===bAction);

  state.battle = { a:a.id, b:b.id, aAction, bAction, delta:[da,db], skipped:false, neList, isNE };
  if(state.log[0]) state.log[0].battleAction = `${pName(a)} ${aLabel(aAction)} / ${pName(b)} ${aLabel(bAction)}`;
  state.phase = 'battle-resolved';
  render();
}

function submitBid(){
  const you = state.players.find(p=>p.isYou);
  const bids = {};
  bids['you'] = {immediate: state.bidImmediate, future: state.bidFuture};

  state.players.filter(p=>!p.isYou).forEach(ai=>{
    bids[ai.id] = aiBid(ai, state.card, state.players, state.round);
  });

  const totals = Object.entries(bids).map(([id,b])=>({id, total:b.immediate+b.future, b}));
  totals.sort((a,b)=>b.total-a.total);

  const winnerEntry = totals[0];
  const winner = state.players.find(p=>p.id===winnerEntry.id);
  const winBid = bids[winnerEntry.id];
  winner.immediate -= winBid.immediate;
  winner.future -= winBid.future;

  state.players.filter(p=>!p.isYou).forEach(ai=>{
    ai.lastLostTo = (ai.id !== winnerEntry.id) ? winnerEntry.id : null;
  });

  you.lastBidTotal = bids['you'].immediate + bids['you'].future;

  const diff = totals[1] ? totals[0].total - totals[1].total : null;
  let marginKey = '';
  let cursePenalty = 0;
  if(diff !== null){
    if(diff <= 2){ marginKey = 'marginTight'; cursePenalty = 0; }
    else if(diff <= 6){ marginKey = 'marginMid'; cursePenalty = 1; }
    else { marginKey = 'marginWide'; cursePenalty = 3; }
  }
  winner.score -= cursePenalty;

  state.result = {
    winnerId: winnerEntry.id,
    secondId: totals[1] ? totals[1].id : null,
    hidden: state.card.hidden,
    marginKey,
    cursePenalty
  };

  state.log.unshift({
    round: state.round,
    cardKey: state.card.key,
    hidden: state.card.hidden,
    winnerId: winner.id,
    battleAction: null
  });

  state.phase = 'resolved';
  render();
}

function nextRound(){
  if(state.round >= TOTAL_ROUNDS){
    state.phase = 'gameover';
    render();
    return;
  }
  state.players.forEach(p=>{
    p.immediate = Math.min(p.immediate + IMMEDIATE_REGEN, IMMEDIATE_CAP);
    p.future = Math.min(p.future + FUTURE_REGEN, FUTURE_CAP);
  });
  state.round += 1;
  state.card = drawCard();
  state.bidImmediate = 0;
  state.bidFuture = 0;
  state.result = null;
  state.battle = null;
  state.phase = 'bidding';
  render();
}

function restart(){ initState(); }

function adjustBid(kind, delta){
  const you = state.players.find(p=>p.isYou);
  const cap = kind==='immediate' ? you.immediate : you.future;
  const cur = kind==='immediate' ? state.bidImmediate : state.bidFuture;
  const next = clamp(cur + delta, 0, cap);
  if(kind==='immediate') state.bidImmediate = next; else state.bidFuture = next;
  render();
}
function setBidMax(kind){
  const you = state.players.find(p=>p.isYou);
  if(kind==='immediate') state.bidImmediate = you.immediate;
  else state.bidFuture = you.future;
  render();
}
function resetBidKind(kind){
  if(kind==='immediate') state.bidImmediate = 0; else state.bidFuture = 0;
  render();
}

function toggleHelp(){ state.helpOpen = !state.helpOpen; render(); }
function dismissIntro(){ state.introSeen = true; render(); }

function seatClass(p){
  let cls = 'seat';
  if(p.isYou) cls += ' you';
  if(state.phase==='resolved' && state.result){
    if(!state.result.hidden){
      if(p.id===state.result.winnerId) cls += ' rank-1';
      else if(p.id===state.result.secondId) cls += ' rank-2';
    } else if(p.id===state.result.winnerId){
      cls += ' rank-1';
    }
  }
  if((state.phase==='battle' || state.phase==='battle-resolved') && state.battle){
    if(p.id===state.battle.a || p.id===state.battle.b) cls += ' rank-2';
  }
  return cls;
}

function findPureNE(card){
  const [s,a] = card.actions;
  const combos = [[s,s],[a,s],[s,a],[a,a]];
  const results = [];
  combos.forEach(([x,y])=>{
    const [px,py] = card.payoff(x,y);
    const altX = x===s?a:s;
    const [paltX] = card.payoff(altX,y);
    const altY = y===s?a:s;
    const [,paltY] = card.payoff(x,altY);
    if(px >= paltX && py >= paltY) results.push([x,y]);
  });
  return results;
}

function buildMatrixRows(card){
  const acts = card.actions;
  const fmt = (pair)=>{
    const [x,y] = pair;
    if(x===y) return (lang==='ja'?'各':'each ') + (x>=0?'+':'') + x;
    return `${x>=0?'+':''}${x} / ${y>=0?'+':''}${y}`;
  };
  return [
    { label: aLabel(acts[0])+'\u00d7'+aLabel(acts[0]), val: fmt(card.payoff(acts[0],acts[0])) },
    { label: aLabel(acts[1])+'\u00d7'+aLabel(acts[0]), val: fmt(card.payoff(acts[1],acts[0])) },
    { label: aLabel(acts[1])+'\u00d7'+aLabel(acts[1]), val: fmt(card.payoff(acts[1],acts[1])) }
  ];
}

    ${bottomHtml}
    ${logHtml}
    ${state.helpOpen ? helpPanelHtml() : ''}
  `;
}

initState();
</script>
