    --void:#0d1117;
    --iron:#2b3038;
    --stone:#454b52;
    --bone:#d9d3c2;
    --frost:#8fb8c9;
    --rust:#a3462f;
    --gold:#c9a05a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #1a2028 0%, transparent 60%),
      linear-gradient(180deg, var(--void) 0%, #090b0e 100%);
    color:var(--bone);
    font-family:'Noto Serif JP', 'EB Garamond', serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:1;
  }

  .splash-cover{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
    overflow:hidden;
    background:var(--void);
    opacity:1; transition:opacity 1.3s ease;
  }
  .splash-cover.is-hidden{ opacity:0; pointer-events:none; }
  .splash-photo{
    position:absolute; inset:-3% ;
    background-image:
      linear-gradient(180deg, rgba(9,11,14,0.15) 0%, rgba(9,11,14,0.35) 55%, rgba(9,11,14,0.92) 100%),
      var(--hero-img);
    background-size:cover; background-position:center 35%;
    filter:grayscale(0.18) saturate(0.85) brightness(0.82) contrast(1.05);
    animation:kenburns 7s ease-out forwards;
  }
  @keyframes kenburns{
    from{ transform:scale(1.0); }
    to{ transform:scale(1.09); }
  }
  .splash-content{
    position:relative; z-index:1; text-align:center;
    padding:0 1.4rem 3.2rem;
    animation:splashFadeIn 1.6s ease-out both;
    animation-delay:0.3s;
  }
  @keyframes splashFadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .splash-content .rune-row{
    font-size:1.6rem; letter-spacing:0.6rem; color:var(--frost);
    opacity:0.9; margin-bottom:0.5rem; text-shadow:0 0 18px rgba(143,184,201,0.5);
  }
  .splash-content h1{
    font-family:'Cinzel',serif; font-weight:700; letter-spacing:0.2rem;
    font-size:2.1rem; color:var(--bone); text-shadow:0 2px 20px rgba(0,0,0,0.6);

  .bg-credit{
    position:fixed; left:0.7rem; bottom:0.6rem; z-index:5;
    font-size:0.58rem; letter-spacing:0.03rem; color:rgba(217,211,194,0.35);
    pointer-events:none;
  }
  .runes-bg{
    position:fixed; inset:0; z-index:1; opacity:0.05;
    font-size:2.2rem; line-height:1.4; letter-spacing:0.6rem;
    color:var(--frost); overflow:hidden; user-select:none;
    padding:2rem; word-break:break-all; pointer-events:none;
  }
  #app{position:relative; z-index:2; max-width:780px; margin:0 auto; padding:1.4rem 1.1rem 4rem;}

  .brand{text-align:center; margin:1.2rem 0 2rem;}
  .brand .rune-row{font-size:1.4rem; letter-spacing:0.5rem; color:var(--frost); opacity:0.8; margin-bottom:0.4rem;}
  .brand h1{font-family:'Cinzel',serif; font-weight:700; letter-spacing:0.15rem; font-size:1.7rem; color:var(--bone);}
  .brand .sub{font-size:0.78rem; letter-spacing:0.3rem; color:var(--stone); margin-top:0.3rem; text-transform:uppercase;}

  .card-shell{
    background:linear-gradient(160deg, rgba(43,48,56,0.7), rgba(13,17,23,0.9));
    border:1px solid rgba(143,184,201,0.18);
    border-radius:4px;
    padding:1.3rem;
    margin-bottom:1.1rem;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .section-label{
    font-family:'Cinzel',serif; font-size:0.66rem; letter-spacing:0.22rem;
    color:var(--frost); text-transform:uppercase; margin-bottom:0.7rem;
    display:flex; align-items:center; gap:0.5rem;
  }
  .section-label::after{content:''; flex:1; height:1px; background:linear-gradient(90deg, rgba(143,184,201,0.4), transparent);}

  .deity-grid{display:grid; grid-template-columns:1fr 1fr; gap:0.6rem;}
  @media(max-width:420px){.deity-grid{grid-template-columns:1fr;}}
  .deity-card{
    border:1px solid rgba(143,184,201,0.15); border-radius:4px; padding:0.9rem;
    background:rgba(255,255,255,0.02); cursor:pointer; transition:all 0.25s;
    text-align:left;
  }
  .deity-card:active, .deity-card.selected{
    border-color:var(--frost); background:rgba(143,184,201,0.08);
    transform:translateY(-1px);

/* ===================== 文法エンジン =====================
   古ノルド語は低資源言語であり、AIによる自由生成は文法的に信頼できない。
   名詞は規則ベースの格変化クラスで機械生成する。
   動詞は実在の古ノルド語の主要形(不定形/現在3人称単数/過去3人称単数)を
   語彙データとして直接保持し、強変化・不規則動詞も実データで再現する
   （それでも中英語からの類推や簡略化を含む部分があり、学術的厳密さは保証しない）。

const FUTHARK = "ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ";

function declineNoun(entry, grammCase){
  const {stem, declClass} = entry;
  if(declClass === 'proper'){ return stem; }
  const table = {
    'strong-m': {nom: stem+'r', acc: stem,      dat: stem+'i',  gen: stem+'s'},
    'strong-f': {nom: stem,     acc: stem,      dat: stem,      gen: stem+'ar'},
    'strong-n': {nom: stem,     acc: stem,      dat: stem+'i',  gen: stem+'s'},
    'weak-m':   {nom: stem+'i', acc: stem+'a',  dat: stem+'a',  gen: stem+'a'},
    'weak-f':   {nom: stem+'a', acc: stem+'u',  dat: stem+'u',  gen: stem+'u'}
  };
  const row = table[declClass] || table['strong-m'];
  return row[grammCase] || stem;
}

// 動詞: 実データ(forms)を最優先。無い場合のみ規則化フォールバック。
function conjugateVerb(entry, tense){
  if(entry.forms && entry.forms[tense]) return entry.forms[tense];
  const stem = entry.stem || '';
  const table = { inf: stem+'a', pres3: stem+'ar', pret3: stem+'aði' };
  return table[tense] || stem+'a';
}

// 頭韻クラス分類（stuðlar本来のルール）
function staveClass(word){
  const w = (word||'').toLowerCase();
  if(/^(sk|sp|st)/.test(w)) return w.slice(0,2);
  const first = w[0] || '?';
  if('aeiouyæøöáéíóúýǫ'.includes(first)) return 'V';
  return first;
}

// 内韻(hendingar)簡易判定: 語末の母音+子音クラスタを比較
// aðalhending = 母音・子音とも一致（全韻）、skothending = 子音のみ一致（半韻）
function rhymeParts(word){
  const w = (word||'').toLowerCase();
  const vowels = 'aeiouyæøöáéíóúýǫ';
  let idx = -1;
  for(let i=w.length-1; i>=0; i--){ if(vowels.includes(w[i])){ idx=i; break; } }
  if(idx<0) return {vowel:'', coda:w};
  return {vowel:w[idx], coda:w.slice(idx+1)};
}
function hendingType(w1, w2){
  const r1 = rhymeParts(w1), r2 = rhymeParts(w2);
  if(!r1.coda || !r2.coda) return 'none';
  if(r1.vowel===r2.vowel && r1.coda===r2.coda) return 'aðalhending';
  if(r1.coda===r2.coda && r1.vowel!==r2.vowel) return 'skothending';
  return 'none';
}

function citationForm(entry){
  if(entry.type === 'verb') return conjugateVerb(entry, 'inf');
  return declineNoun(entry, 'nom');
}

/* ===================== 状態 ===================== */
let state = {
  step:'title', deity:null, meter:null, hand:[], selected:[], poem:null, loading:false, error:null
};
function setState(patch){ state = {...state, ...patch}; render(); }

function buildSlots(meterId){
  const meter = METERS.find(m=>m.id===meterId);
  const slots = [];
  meter.groups.forEach((g, gi)=>{
    if(g==='triad'){
      slots.push({group:gi, kind:'triad', role:'stuðlar-1', label:'頭韻1'});
      slots.push({group:gi, kind:'triad', role:'stuðlar-2', label:'頭韻2'});
      slots.push({group:gi, kind:'triad', role:'höfuðstafr', label:'主頭韻'});
    } else if(g==='pair'){
      slots.push({group:gi, kind:'pair', role:'pair-1', label:'対句1'});
      slots.push({group:gi, kind:'pair', role:'pair-2', label:'対句2'});
    } else {
      slots.push({group:gi, kind:'free', role:'free', label:'自由'});
    }
  });
  return slots;
}

function grammarRoleFor(slotRole){
  if(slotRole==='stuðlar-1') return {nounCase:'nom', verbTense:'pres3'};
  if(slotRole==='stuðlar-2') return {nounCase:'acc', verbTense:'pret3'};
  if(slotRole==='höfuðstafr') return {nounCase:'gen', verbTense:'inf'};
  if(slotRole==='pair-1') return {nounCase:'nom', verbTense:'pres3'};
  if(slotRole==='pair-2') return {nounCase:'dat', verbTense:'pret3'};
  return {nounCase:'dat', verbTense:'inf'};
}

function inflect(entry, slotRole){
  const g = grammarRoleFor(slotRole);
  if(entry.type==='verb') return conjugateVerb(entry, g.verbTense);
  return declineNoun(entry, g.nounCase);
}

function pickHand(deityId){
  const pool = VOCAB[deityId];
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  return shuffled; // 神格の全語彙をシャッフルして提示し、選択肢を最大化する
}

function currentSlots(){ return buildSlots(state.meter); }

function toggleSelect(idx){
  const need = METERS.find(m=>m.id===state.meter).cards;
  const already = state.selected.find(c=>c._idx===idx);
  if(already){
    setState({selected: state.selected.filter(c=>c._idx!==idx)});
  } else {
    if(state.selected.length >= need) return;
    setState({selected:[...state.selected, {...state.hand[idx], _idx:idx}]});
  }
}

function evaluateSlots(){
  const slots = currentSlots();
  const assigned = slots.map((slot,i)=>{
    const card = state.selected[i];
    return {...slot, card, inflected: card ? inflect(card, slot.role) : null};
  });
  const groupCount = Math.max(...slots.map(s=>s.group)) + 1;
  const groupResults = [];
  for(let g=0; g<groupCount; g++){
    const members = assigned.filter(s=>s.group===g);
    const filled = members.every(m=>m.card);
    let ok = false, hending = 'none';
    if(filled){
      if(members[0].kind==='triad'){
        const c1 = staveClass(members[0].inflected);
        const c2 = staveClass(members[1].inflected);
        ok = (c1===c2);
        hending = hendingType(members[1].inflected, members[2].inflected);
      } else if(members[0].kind==='pair'){
        const c1 = staveClass(members[0].inflected);
        const c2 = staveClass(members[1].inflected);
        ok = (c1===c2);
      } else {
        ok = true;
      }
    }
    groupResults.push({group:g, members, filled, ok, kind:members[0].kind, hending});
  }
  return {assigned, groupResults};
}

/* ===================== AI生成 ===================== */
async function generatePoem(){
  setState({loading:true, error:null});
  const deity = DEITIES[state.deity];
  const meter = METERS.find(m=>m.id===state.meter);
  const {assigned, groupResults} = evaluateSlots();

  const cardList = assigned.map(s=>{
    const c = s.card;
    const posLabel = c.type==='verb' ? '動詞' : (c.type==='kenning' ? 'ケニング' : '異名');
    return `[${s.label} / ${posLabel}] 日本語:${c.word}（${c.meaning}） / 変化済み古ノルド語形: "${s.inflected}"`;
  }).join('\n');

  const hendingNote = state.meter==='drottkvaett'
    ? '\n\n内韻(hendingar)情報: ' + groupResults.filter(g=>g.kind==='triad').map((g,i)=>`行${i+1}: ${g.hending==='none'?'内韻なし':g.hending}`).join(' / ')
    : '';

  const sys = `あなたは古ノルド詩(スカルド詩・エッダ詩)の霊媒です。以下の設定に厳密に従い、JSON形式のみで出力してください。前置き・後置き・コードブロック記号は一切含めないこと。

神格: ${deity.name}（${deity.jp}）
声の性質: ${deity.voice}
詩形: ${meter.name}（${meter.jp}）

重要な制約: 「変化済み古ノルド語形」として渡された単語は、既に格変化・活用処理済みの実データです。この語形の綴りを一切変更してはいけません（大文字小文字・語尾を含め完全にそのまま使用）。あなたの役割はこれらの語を自然な語順に配置し、必要な助詞的小語（ok, en, við, af等）や句読点を補い、指定された頭韻構造（頭韻グループの語は行頭または強勢位置に置く）を活かして詩行に組み上げることだけです。新しい実質語を創作しないでください。${hendingNote ? '内韻(hendingar)が検出されている場合はその2語をなるべく行内の押韻位置に近く配置し、詩の中でその響きが感じられるよう意識してください。' : ''}

出力するJSONの構造:
{
  "norse": "上記の変化済み語形のみを用いて組んだ詩行。行区切りは改行。3〜5行。",
  "japanese": "日本語訳。荘厳で神託めいた文語調。カードのケニング表現をそのまま活かし、直訳ではなく詩として成立させること。3〜5行、改行区切り。",
  "english": "英語訳。同じ内容を格調高い英語で。3〜5行。",
  "commentary": "${deity.jp}自身が詠み終えた詩について一言添える短い台詞。1〜2文、日本語、神格の声の性質に沿うこと。"
}`;

  const userMsg = `変化済み語彙(頭韻構造ラベル付き):\n${cardList}${hendingNote}\n\nこれらの語形をそのまま用い、${meter.jp}の詩形で一篇の詩を詠んでください。`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system: sys,
        messages:[{role:"user", content:userMsg}]
      })
    });
    const data = await response.json();
    const text = (data.content||[]).map(b=>b.text||"").join("\n").trim();
    const clean = text.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(clean);
    setState({loading:false, poem:parsed, step:'poem'});
  }catch(e){
    setState({loading:false, error:"詩の生成に失敗しました。もう一度お試しください。"});
  }
}

/* ===================== オーディオ =====================
   低音ドローン + A Dorian(A,B,C,D,E,F#,G)を歩む角笛風メロディ + 谷間に響くようなエコー
========================================================= */
let audioCtx=null, droneNodes=null, audioOn=false;
let melodyTimerId=null, melodyLastIndex=3;
const SCALE = [220.00, 246.94, 261.63, 293.66, 329.63, 369.99, 392.00, 440.00]; // A3 Dorian → A4
const STEP_WEIGHTS = [-2,-1,-1,-1,0,1,1,1,2]; // 順次進行寄りのランダムウォーク

function initAudio(){ if(audioCtx) return; audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }

function startDrone(){
  initAudio();
  const now = audioCtx.currentTime;

  // 低音ドローン
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.045, now+2);
  master.connect(audioCtx.destination);
  const osc1 = audioCtx.createOscillator();
  osc1.type='sine'; osc1.frequency.value=55;
  const osc2 = audioCtx.createOscillator();
  osc2.type='triangle'; osc2.frequency.value=55*1.5;
  const lfo = audioCtx.createOscillator();
  lfo.type='sine'; lfo.frequency.value=0.08;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value=6;
  lfo.connect(lfoGain); lfoGain.connect(osc1.frequency);
  const filter = audioCtx.createBiquadFilter();
  filter.type='lowpass'; filter.frequency.value=300;
  osc1.connect(filter); osc2.connect(filter); filter.connect(master);
  osc1.start(); osc2.start(); lfo.start();

  // メロディ用バス（角笛の音がホールに響くようなエコーを付加）
  const melodyBus = audioCtx.createGain();
  melodyBus.gain.value = 1;
  melodyBus.connect(audioCtx.destination);
  const delay = audioCtx.createDelay(2.0);
  delay.delayTime.value = 0.62;
  const feedback = audioCtx.createGain();
  feedback.gain.value = 0.34;
  const delayFilter = audioCtx.createBiquadFilter();
  delayFilter.type='lowpass'; delayFilter.frequency.value=1400;
  melodyBus.connect(delayFilter);
  delayFilter.connect(delay);
  delay.connect(feedback);
  feedback.connect(delayFilter);
  delay.connect(audioCtx.destination);

  droneNodes = {osc1, osc2, lfo, master, melodyBus, delay, feedback, delayFilter};
  melodyLastIndex = 3;
  scheduleMelody();
}

function playHornNote(freq, duration, soft){
  if(!droneNodes || !droneNodes.melodyBus) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='triangle';
  osc.frequency.setValueAtTime(freq*0.996, now);
  osc.frequency.linearRampToValueAtTime(freq, now+0.1); // わずかなポルタメントで角笛らしく
  const filt = audioCtx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value = soft ? 850 : 1100; filt.Q.value=0.7;
  const peak = soft ? 0.045 : 0.065;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(peak, now+0.22);        // attack
  g.gain.linearRampToValueAtTime(peak*0.7, now+duration*0.6); // sustain
  g.gain.linearRampToValueAtTime(0, now+duration);        // release
  osc.connect(filt); filt.connect(g); g.connect(droneNodes.melodyBus);
  osc.start(now);
  osc.stop(now+duration+0.1);
}

function scheduleMelody(){
  const delta = STEP_WEIGHTS[Math.floor(Math.random()*STEP_WEIGHTS.length)];
  melodyLastIndex = Math.max(0, Math.min(SCALE.length-1, melodyLastIndex+delta));
  // 休符は控えめに、音数を増やす
  if(Math.random() > 0.08){
    const freq = SCALE[melodyLastIndex];
    const dur = 0.9 + Math.random()*1.3;
    playHornNote(freq, dur, false);
    // 3度下の副旋律を時々重ねて音数と厚みを増やす
    if(Math.random() < 0.4){
      const harmIndex = Math.max(0, melodyLastIndex-2);
      setTimeout(()=>{ playHornNote(SCALE[harmIndex], dur*0.85, true); }, 80);
    }
    // 装飾的なパッシングノートを時々挟む
    if(Math.random() < 0.25){
      const passIndex = Math.max(0, Math.min(SCALE.length-1, melodyLastIndex + (Math.random()<0.5?1:-1)));
      setTimeout(()=>{ playHornNote(SCALE[passIndex], 0.5, true); }, dur*550);
    }
  }
  const nextIn = 700 + Math.random()*1300;
  melodyTimerId = setTimeout(scheduleMelody, nextIn);
}

function stopDrone(){
  if(!droneNodes) return;
  clearTimeout(melodyTimerId);
  const now = audioCtx.currentTime;
  droneNodes.master.gain.linearRampToValueAtTime(0, now+1);
  droneNodes.melodyBus.gain.linearRampToValueAtTime(0, now+1);
  setTimeout(()=>{
    try{
      droneNodes.osc1.stop(); droneNodes.osc2.stop(); droneNodes.lfo.stop();
      droneNodes.melodyBus.disconnect(); droneNodes.delay.disconnect();
      droneNodes.feedback.disconnect(); droneNodes.delayFilter.disconnect();
    }catch(e){}
    droneNodes=null;
  }, 1100);
}

  let html = `
    <div class="brand">
      <div class="rune-row">ᛊᚲᚨᛚᛞ</div>
      <h1>詩神憑依 -北欧-</h1>
      <div class="sub">SKALD · Poetic Edda Divination</div>
    </div>
    <div class="step-nav">
      ${['title','meter','hand','poem'].map((s,i)=>`<div class="step-dot ${stepIndex()>=i?'active':''}"></div>`).join('')}
    </div>
  `;

  if(state.step==='title'){
    html += `<div class="card-shell">
      <div class="section-label">神格を選ぶ · Choose your god</div>
      <div class="deity-grid">
        ${Object.values(DEITIES).map(d=>`
          <div class="deity-card ${state.deity===d.id?'selected':''}" onclick="selectDeity('${d.id}')">
            <div class="dname-rune">${d.rune}</div>
            <div class="dname">${d.name}</div>
            <div style="font-size:0.72rem;color:${d.color};margin-bottom:0.3rem;">${d.jp}</div>
            <div class="ddesc">${d.desc}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn primary" ${!state.deity?'disabled':''} onclick="goMeter()">次へ · 韻律を選ぶ</button>
    </div>`;
  }

  else if(state.step==='meter'){
    html += `<div class="card-shell">
      <div class="section-label">${DEITIES[state.deity].jp}の詩形 · Choose meter</div>
      <div class="meter-row">
        ${METERS.map(m=>`
          <div class="meter-opt" style="${state.meter===m.id?'border-color:var(--rust);background:rgba(163,70,47,0.08);':''}" onclick="selectMeter('${m.id}')">
            <div>
              <div class="mname">${m.name}</div>
              <div class="mjp">${m.jp} ・ カード${m.cards}枚</div>
              <div class="mstruct">構造: ${m.groups.map(g=>g==='triad'?'頭韻×3':g==='pair'?'対句×2':'自由×1').join(' + ')}</div>
            </div>
            <div class="mtag">${m.tag}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn ghost" onclick="setState({step:'title'})">戻る</button>
      <button class="btn primary" ${!state.meter?'disabled':''} onclick="goHand()">次へ · 言霊を引く</button>
    </div>`;
  }

  else if(state.loading){
    html += `<div class="card-shell loading">
      <div class="rune-spin">ᛟ</div><br>
      ${DEITIES[state.deity].jp}が詩を紡いでいます…
    </div>`;
  }

  else if(state.step==='hand'){
    const need = METERS.find(m=>m.id===state.meter).cards;
    const {groupResults} = evaluateSlots();
    const slots = currentSlots();
    const nextSlot = slots[state.selected.length];
    const isDrottkvaett = state.meter==='drottkvaett';

    html += `<div class="card-shell">
      <div class="section-label">言霊カード · Word-hoard <span class="count-pill" style="margin-left:auto">${state.selected.length}/${need}</span></div>
      <div class="hand-grid">
        ${state.hand.map((c,i)=>{
          const selIdx = state.selected.findIndex(s=>s._idx===i);
          const sel = selIdx>=0;
          const slotForThis = sel ? slots[selIdx] : null;
          const disabled = !sel && state.selected.length>=need;
          const cite = citationForm(c);
          return `<div class="vcard ${sel?'selected':''} ${disabled?'disabled':''}" onclick="toggleSelect(${i})">
            ${sel ? `<div class="slotchip">${slotForThis.label}</div>` : ''}
            <div class="vtype">${c.type==='kenning'?'ケニング':c.type==='heiti'?'異名':'動詞'}</div>
            <div class="vword">${c.word}</div>
            <div class="vmeaning">${c.meaning}</div>
            <div class="vclass">${cite}${c.declClass && c.declClass!=='proper' ? ' ・ '+c.declClass : ''}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="role-legend">
        ${nextSlot ? `次に選ぶカードの役割: <b style="color:var(--gold)">${nextSlot.label}</b>${nextSlot.kind!=='free' ? '（頭韻を揃えたいスロット）' : '（制約なし）'}` : '全スロット充填済み'}
        <div class="rowline" style="margin-top:0.5rem;">
          ${groupResults.map(g=>{
            const symbol = g.kind==='free' ? '·' : (g.filled ? (g.ok?'✓':'✕') : '○');
            const cls = g.filled && g.ok ? 'match' : '';
            return `<span class="stave-dot ${cls} ${!g.filled?'empty':''}">${symbol}</span>`;
          }).join('')}
          <span style="margin-left:0.3rem;">頭韻(stuðlar)の一致状況</span>
        </div>
        ${isDrottkvaett ? `<div class="rowline" style="margin-top:0.5rem;">
          内韻(hendingar):
          ${groupResults.filter(g=>g.kind==='triad').map((g,i)=>{
            if(!g.filled) return `<span class="hending-badge none">行${i+1} 未確定</span>`;
            const label = g.hending==='aðalhending' ? '全韻 aðalhending' : (g.hending==='skothending' ? '半韻 skothending' : 'なし');
            return `<span class="hending-badge ${g.hending==='none'?'none':''}">行${i+1}: ${label}</span>`;
          }).join('')}
        </div>` : ''}
      </div>
      <button class="btn ghost" onclick="setState({step:'meter'})">戻る</button>
      <button class="btn primary" ${state.selected.length<need?'disabled':''} onclick="generatePoem()">詩を紡ぐ · Weave the verse</button>
      ${state.error?`<div class="err-box">${state.error}</div>`:''}
      <div class="info-note">
        カードを選んだ順にスロット(頭韻1→頭韻2→主頭韻…)へ割り当てられます。同グループの語は格変化・活用後も語頭の音クラスが一致すると ✓ になります(母音は全て同クラス、sk/sp/stは専用クラス)。
        ${isDrottkvaett ? '内韻(hendingar)は各行の「頭韻2」と「主頭韻」の語末の響きを比較し、母音・子音とも一致すれば全韻(aðalhending)、子音のみ一致すれば半韻(skothending)として検出します(簡易判定)。' : ''}
        動詞は実在の古ノルド語の主要形(不定形・現在3人称単数・過去3人称単数)を使用しており、強変化動詞の不規則な語幹交替も再現しています。
      </div>
    </div>`;
  }

  else if(state.step==='poem' && state.poem){
    const d = DEITIES[state.deity];
    const {assigned} = evaluateSlots();
    html += `<div class="card-shell poem-wrap">
      <div class="section-label">${d.jp}の詩 · ${METERS.find(m=>m.id===state.meter).jp}</div>
      <div class="poem-runes">${assigned.map(s=>s.inflected).join(' ᛫ ')}</div>
      <div class="poem-block norse">
        <div class="plabel">Old Norse（語形は文法エンジンで生成）</div>
        <div class="ptext">${escapeHtml(state.poem.norse||'')}</div>
      </div>
      <div class="poem-block jp">
        <div class="plabel">日本語</div>
        <div class="ptext">${escapeHtml(state.poem.japanese||'')}</div>
      </div>
      <div class="poem-block en">
        <div class="plabel">English</div>
        <div class="ptext">${escapeHtml(state.poem.english||'')}</div>
      </div>
      <div class="commentary">${escapeHtml(state.poem.commentary||'')}</div>
      <button class="btn ghost" onclick="goHand()">再び言霊を引く</button>
      <button class="btn primary" onclick="setState({step:'title', deity:null, meter:null, hand:[], selected:[], poem:null})">神格を選び直す</button>
    </div>`;
  }

  app.innerHTML = html;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function selectDeity(id){ setState({deity:id}); }
function selectMeter(id){ setState({meter:id}); }
function goMeter(){ setState({step:'meter'}); }
function goHand(){
  const hand = pickHand(state.deity);
  setState({step:'hand', hand, selected:[], poem:null, error:null});
}

window.selectDeity=selectDeity;
window.selectMeter=selectMeter;
window.goMeter=goMeter;
window.goHand=goHand;
window.toggleSelect=toggleSelect;
window.generatePoem=generatePoem;
window.setState=setState;

render();
</script>
</body>
</html>
