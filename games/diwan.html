<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詩神憑依 -ペルシャ- SHER-E JĀN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --lapis:#0d2b45;
    --lapis-deep:#081c2e;
    --turquoise:#1f8a8c;
    --turquoise-light:#5fc2c4;
    --gold:#c9a227;
    --gold-soft:#e3c874;
    --ivory:#f3ead2;
    --maroon:#7a2e2e;
    --ink:#1a1410;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--lapis-deep);color:var(--ivory);font-family:'Noto Serif JP',serif;overflow-x:hidden;}
  .fa{font-family:'Vazirmatn',sans-serif;direction:rtl;unicode-bidi:isolate;}
  button{font-family:'Noto Serif JP',serif;cursor:pointer;}
  .screen{min-height:100vh;width:100%;display:none;position:relative;}
  .screen.active{display:block;}

  /* ---------- COVER ---------- */
  #cover{
    position:relative;
    background:#000 center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  #cover::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(8,20,32,.35) 0%, rgba(8,20,32,.55) 55%, rgba(8,20,32,.92) 100%);
  }
  .cover-inner{position:relative;z-index:2;text-align:center;padding:8vh 6vw;}
  .cover-eyebrow{letter-spacing:.3em;font-size:.75rem;color:var(--gold-soft);font-family:'EB Garamond',serif;font-style:italic;margin-bottom:.8rem;}
  .cover-title{font-size:clamp(2.1rem,6vw,3.6rem);color:var(--ivory);text-shadow:0 2px 24px rgba(0,0,0,.8);line-height:1.3;margin:0 0 .3rem;}
  .cover-title .fa{display:block;font-size:.55em;color:var(--gold-soft);margin-top:.5rem;}
  .cover-sub{color:#d8cba8;font-size:.95rem;max-width:34em;margin:1.2rem auto 2.4rem;line-height:2;}
  .btn-primary{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--lapis-deep);border:none;padding:.9em 2.6em;font-size:1rem;letter-spacing:.08em;border-radius:2px;box-shadow:0 6px 20px rgba(201,162,39,.35);transition:transform .2s ease;}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-primary:disabled{opacity:.35;box-shadow:none;cursor:not-allowed;transform:none;}
  .btn-ghost{background:transparent;border:1px solid rgba(243,234,210,.4);color:var(--ivory);padding:.75em 1.8em;font-size:.85rem;letter-spacing:.06em;margin-top:1rem;border-radius:2px;}

  /* ---------- POET SELECT ---------- */
  #poets{padding:9vh 6vw 6vh;background:var(--lapis-deep);}
  .section-head{text-align:center;margin-bottom:5vh;}
  .section-head h2{font-size:1.6rem;color:var(--gold-soft);letter-spacing:.06em;margin:0 0 .4rem;}
  .section-head p{color:#b9ac8a;font-size:.85rem;}
  .poet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.6rem;max-width:1000px;margin:0 auto;}
  .poet-card{position:relative;padding:2.4rem 1.6rem 2rem;text-align:center;cursor:pointer;background:var(--lapis);border:1px solid rgba(201,162,39,.25);transition:border-color .25s ease, transform .25s ease;}
  .poet-card::before,.poet-card::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--gold-soft);}
  .poet-card::before{top:8px;left:8px;border-width:1px 0 0 1px;}
  .poet-card::after{bottom:8px;right:8px;border-width:0 1px 1px 0;}
  .poet-card:hover{border-color:var(--gold-soft);transform:translateY(-4px);}
  .poet-card .fa{font-size:1.5rem;color:var(--turquoise-light);display:block;margin-bottom:.6rem;}
  .poet-card h3{color:var(--ivory);font-size:1.15rem;margin:.2rem 0 .5rem;letter-spacing:.04em;}
  .poet-card p{color:#a9a48c;font-size:.8rem;line-height:1.9;margin:0;}
  .poet-tag{display:inline-block;margin-top:1rem;font-size:.7rem;color:var(--gold-soft);letter-spacing:.1em;border-top:1px solid rgba(201,162,39,.3);padding-top:.6rem;}

  /* ---------- CARD DRAW ---------- */
  #cards{padding:7vh 5vw 8vh;background:var(--lapis-deep);}
  .draw-head{max-width:800px;margin:0 auto 3vh;text-align:center;}
  .draw-head .poet-name-fa{color:var(--turquoise-light);font-size:1.1rem;display:block;margin-top:.3rem;}
  .draw-counter{color:var(--gold-soft);font-size:.85rem;letter-spacing:.05em;margin-top:.6rem;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.7rem;max-width:820px;margin:0 auto 3rem;}
  .word-card{
    background:var(--lapis);border:1px solid rgba(201,162,39,.3);padding:1rem .5rem .8rem;
    text-align:center;cursor:pointer;transition:all .2s ease;border-radius:4px;
  }
  .word-card:hover{border-color:var(--turquoise-light);}
  .word-card.selected{background:linear-gradient(160deg, rgba(201,162,39,.22), rgba(31,138,140,.18));border-color:var(--gold-soft);box-shadow:0 0 0 1px var(--gold-soft) inset;}
  .word-card .fa{font-size:1.15rem;color:var(--ivory);display:block;}
  .word-card .translit{font-family:'EB Garamond',serif;font-style:italic;color:var(--turquoise-light);font-size:.68rem;display:block;margin-top:.35rem;}
  .word-card .gloss{color:#a9a48c;font-size:.68rem;display:block;margin-top:.15rem;}
  .draw-actions{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;}

  /* ---------- LOADING ---------- */
  #loading{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--lapis-deep);}
  .loading-inner{text-align:center;}
  .loading-glyph{font-size:2.4rem;color:var(--gold-soft);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .loading-text{color:#b9ac8a;font-size:.85rem;margin-top:1rem;letter-spacing:.05em;}

  /* ---------- RESULT / READER ---------- */
  #result{background:var(--lapis-deep);min-height:100vh;padding:6vh 5vw 8vh;}
  .reader-nav{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto 4vh;font-size:.8rem;color:#9d967c;}
  .reader-nav button{background:none;border:none;color:#9d967c;font-size:.8rem;letter-spacing:.05em;}
  .reader-nav button:hover{color:var(--gold-soft);}
  .poem-frame{max-width:760px;margin:0 auto;position:relative;background:radial-gradient(ellipse at top, rgba(31,138,140,.18), transparent 60%), var(--lapis);border:1px solid rgba(201,162,39,.3);border-radius:160px 160px 8px 8px / 90px 90px 8px 8px;padding:5rem 3rem 3.2rem;}
  .poem-frame::before{content:"";position:absolute;top:14px;left:14px;right:14px;bottom:14px;border:1px solid rgba(95,194,196,.35);border-radius:150px 150px 4px 4px / 80px 80px 4px 4px;pointer-events:none;}
  .poem-title{text-align:center;margin-bottom:2rem;}
  .poem-title-ja{font-size:1.15rem;color:var(--gold-soft);letter-spacing:.05em;}
  .poem-title-fa{font-family:'Vazirmatn',sans-serif;direction:rtl;color:var(--turquoise-light);font-size:1rem;margin-top:.3rem;}
  .verse-block{margin-bottom:1.8rem;}
  .verse-fa{font-family:'Vazirmatn',sans-serif;direction:rtl;text-align:center;font-size:clamp(1.15rem,2.4vw,1.4rem);line-height:2.2;color:var(--ivory);}
  .verse-translit{text-align:center;font-family:'EB Garamond',serif;font-style:italic;color:var(--turquoise-light);font-size:.82rem;margin-top:.4rem;letter-spacing:.02em;}
  .verse-ja{text-align:center;color:#c9bd9c;font-size:.9rem;line-height:2;margin-top:.5rem;}
  .divider{width:60px;height:1px;background:rgba(201,162,39,.4);margin:2rem auto;}
  .commentary{max-width:600px;margin:0 auto;font-size:.82rem;line-height:2;color:#b9ac8a;text-align:justify;}
  .commentary-label{text-align:center;font-size:.72rem;letter-spacing:.2em;color:var(--gold-soft);margin-bottom:.8rem;}
  .attribution{text-align:center;margin-top:2rem;font-size:.72rem;color:#8b8567;letter-spacing:.04em;}
  .reader-actions{display:flex;justify-content:center;gap:1rem;margin-top:3rem;flex-wrap:wrap;}
  .btn-sound{background:none;border:1px solid rgba(243,234,210,.35);color:var(--ivory);padding:.6em 1.3em;font-size:.78rem;border-radius:20px;letter-spacing:.05em;}
  .btn-sound.on{border-color:var(--gold-soft);color:var(--gold-soft);}
  .error-box{max-width:600px;margin:2rem auto;text-align:center;color:#e08a7a;font-size:.85rem;line-height:1.9;}
  .note{max-width:760px;margin:3rem auto 0;text-align:center;font-size:.72rem;color:#756f58;line-height:1.9;}

  /* ---------- MENU BUTTON ---------- */
  #menuBtn{
    position:fixed;top:14px;left:14px;z-index:50;
    width:42px;height:42px;border-radius:50%;
    background:rgba(8,20,32,.55);border:1px solid rgba(201,162,39,.4);
    color:var(--gold-soft);font-size:1.15rem;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);
  }
  #menuOverlay{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(8,20,32,.88);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;
  }
  #menuOverlay.open{display:flex;}
  .menu-panel{
    background:var(--lapis);border:1px solid rgba(201,162,39,.35);
    padding:2.6rem 2.4rem;min-width:240px;text-align:center;border-radius:4px;
  }
  .menu-panel h4{color:var(--gold-soft);font-size:.85rem;letter-spacing:.15em;margin:0 0 1.6rem;font-weight:400;}
  .menu-panel button{
    display:block;width:100%;background:none;border:none;
    color:var(--ivory);font-size:.95rem;padding:.8em 0;letter-spacing:.04em;
    border-bottom:1px solid rgba(243,234,210,.12);
  }
  .menu-panel button:last-child{border-bottom:none;}
  .menu-panel button:hover{color:var(--gold-soft);}
  .menu-close{margin-top:1.4rem !important;font-size:.75rem !important;color:#9d967c !important;}

  /* ---------- PROFILE MODAL ---------- */
  .info-btn{
    position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
    background:rgba(8,20,32,.5);border:1px solid rgba(201,162,39,.4);color:var(--gold-soft);
    font-size:.75rem;display:flex;align-items:center;justify-content:center;font-style:italic;
    font-family:'EB Garamond',serif;
  }
  .info-link{
    display:inline-block;margin-top:.5rem;font-size:.75rem;color:var(--turquoise-light);
    border-bottom:1px dotted var(--turquoise-light);background:none;border-top:none;border-left:none;border-right:none;padding:0;
  }
  #profileOverlay{
    position:fixed;inset:0;z-index:70;display:none;
    background:rgba(8,20,32,.9);backdrop-filter:blur(3px);
    align-items:flex-start;justify-content:center;overflow-y:auto;padding:8vh 5vw 6vh;
  }
  #profileOverlay.open{display:flex;}
  .profile-panel{
    background:var(--lapis);border:1px solid rgba(201,162,39,.35);
    max-width:600px;width:100%;padding:2.6rem 2rem;border-radius:4px;position:relative;
  }
  .profile-close{position:absolute;top:14px;right:14px;background:none;border:none;color:#9d967c;font-size:1.2rem;}
  .profile-section{margin-bottom:2rem;}
  .profile-eyebrow{font-size:.68rem;letter-spacing:.2em;color:var(--gold-soft);margin-bottom:.5rem;}
  .profile-name-ja{font-size:1.3rem;color:var(--ivory);margin:0 0 .2rem;}
  .profile-name-fa{font-family:'Vazirmatn',sans-serif;direction:rtl;color:var(--turquoise-light);font-size:1.1rem;margin-bottom:.3rem;}
  .profile-meta{font-size:.75rem;color:#9d967c;letter-spacing:.03em;margin-bottom:1.2rem;}
  .profile-panel p{font-size:.85rem;line-height:2;color:#c9bd9c;margin:0 0 1em;}
  .profile-divider{width:50px;height:1px;background:rgba(201,162,39,.4);margin:1.8rem 0;}
</style>
</head>
<body>

<!-- ============ MENU (global) ============ -->
<button id="menuBtn" onclick="toggleMenu()">☰</button>
<div id="menuOverlay">
  <div class="menu-panel">
    <h4>メニュー</h4>
    <button onclick="menuGoTo('cover')">トップに戻る</button>
    <button onclick="menuGoTo('poets')">詩人を選び直す</button>
    <button onclick="menuToggleSound()" id="menuSoundBtn">♪ 音楽 OFF</button>
    <button class="menu-close" onclick="toggleMenu()">閉じる</button>
  </div>
</div>

      {fa:'راهرو',t:'rāhrow',ja:'修行者'},{fa:'پیر',t:'pir',ja:'導師'},{fa:'مرید',t:'morid',ja:'弟子'},
      {fa:'حلقه',t:'halghe',ja:'旋舞の輪'},{fa:'نغمه',t:'naghme',ja:'調べ'},{fa:'سرود',t:'sorud',ja:'歌'},
      {fa:'گوش',t:'gush',ja:'耳'},{fa:'چشم',t:'cheshm',ja:'瞳'},{fa:'دست',t:'dast',ja:'手'},
      {fa:'قلب',t:'ghalb',ja:'心臓'},{fa:'روح',t:'ruh',ja:'霊魂'},
      {fa:'عقل',t:'aghl',ja:'理性'},{fa:'می‌خانه',t:'meykhāne',ja:'酒場'},{fa:'ساقی',t:'sāqi',ja:'酌人'},
      {fa:'جام',t:'jām',ja:'杯'},{fa:'مستی',t:'masti',ja:'酔い'},{fa:'بیخودی',t:'bikhodi',ja:'忘我'},
      {fa:'وجد',t:'vajd',ja:'恍惚'},{fa:'طرب',t:'tarab',ja:'歓喜'},{fa:'غم',t:'gham',ja:'悲しみ'},
      {fa:'اشک',t:'ashk',ja:'涙'},{fa:'آه',t:'āh',ja:'ため息'},{fa:'ناله',t:'nāle',ja:'嘆き'},
      {fa:'فریاد',t:'faryād',ja:'叫び'},{fa:'راه',t:'rāh',ja:'道'},{fa:'مقصد',t:'maghsad',ja:'目的地'},
      {fa:'نشان',t:'neshān',ja:'しるし'},{fa:'نقش',t:'naghsh',ja:'図柄'},{fa:'صورت',t:'surat',ja:'姿'},
      {fa:'معنی',t:"ma'ni",ja:'意味'},{fa:'باطن',t:'bāten',ja:'内面'},{fa:'ظاهر',t:'zāher',ja:'外面'},
      {fa:'حجاب',t:'hejāb',ja:'覆い'},{fa:'جنون',t:'jonun',ja:'狂気'},{fa:'درد',t:'dard',ja:'痛み'},
      {fa:'یار',t:'yār',ja:'恋人'}
    ],
    openers:[
      { fa:w=>`${w} از جدایی می‌نالد`, ja:g=>`${g}は、別離ゆえに嘆いている` },
      { fa:w=>`در آتشِ عشق، ${w} می‌سوزد`, ja:g=>`恋の炎の中で、${g}が燃えている` },
      { fa:w=>`هر که ${w} را نشناسد، بی‌نصیب است`, ja:g=>`${g}を知らぬ者は、恵みを持たぬ者だ` },
      { fa:w=>`${w} راهِ وصل را نشان می‌دهد`, ja:g=>`${g}が、めぐり逢いへの道を示す` },
      { fa:w=>`میان من و ${w} پرده‌ای نیست`, ja:g=>`私と${g}の間に、隔てる幕はない` },
      { fa:w=>`${w} در من می‌خواند و من در او`, ja:g=>`${g}は私の内で歌い、私はその内で歌う` }
    ],
    closers:[
      { fa:'چرا که جدایی، عاشق را بیدار می‌کند', ja:'別離こそが、恋する者の目を覚まさせるのだから' },
      { fa:'و این نغمه از عشق است، نه از باد', ja:'この調べは恋から生まれ、風から生まれたのではない' },
      { fa:'چرا که عاشق، پرده‌ای بیش نیست', ja:'なぜなら、愛する者はただの幕にすぎないから' },
      { fa:'و جانم از این ناله سرشار می‌شود', ja:'この嘆きに、私の魂は満たされてゆく' },
      { fa:'تا پرده از میان برخیزد و وصل آید', ja:'幕が取り払われ、めぐり逢いが訪れるまで' },
      { fa:'زیرا رازِ دل از فریادِ دل دور نیست', ja:'心の秘密は、心の叫びから遠くないのだから' }
    ]
  }
};

const PICK_COUNT = 5;
const HAND_SIZE = 18;
let currentPoet = null;
let currentHand = [];
let selectedWords = [];
let lastPoem = null;

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleMenu(){
  document.getElementById('menuOverlay').classList.toggle('open');
}

function menuGoTo(id){
  toggleMenu();
  goTo(id);
}

function menuToggleSound(){
  toggleSound();
  syncMenuSoundLabel();
}

function syncMenuSoundLabel(){
  const btn = document.getElementById('menuSoundBtn');
  if(btn) btn.textContent = soundOn ? '♪ 音楽 ON' : '♪ 音楽 OFF';
  const rb = document.getElementById('soundToggle');
  if(rb){ rb.textContent = soundOn ? '♪ 音楽 ON' : '♪ 音楽 OFF'; rb.classList.toggle('on', soundOn); }
}

function openProfile(key){
  const p = POETS[key];
  const bioHtml = p.bio.map(t=>`<p>${t}</p>`).join('');
  const formHtml = p.formBio.map(t=>`<p>${t}</p>`).join('');
  document.getElementById('profileContent').innerHTML = `
    <div class="profile-section">
      <div class="profile-eyebrow">POET PROFILE</div>
      <div class="profile-name-ja">${p.ja}</div>
      <div class="profile-name-fa fa">${p.fa}</div>
      <div class="profile-meta">${p.life}</div>
      ${bioHtml}
    </div>
    <div class="profile-divider"></div>
    <div class="profile-section">
      <div class="profile-eyebrow">FORM PROFILE</div>
      <div class="profile-name-ja">${p.form}</div>
      <div class="profile-name-fa fa">${p.formFa}</div>
      ${formHtml}
    </div>
  `;
  document.getElementById('profileOverlay').classList.add('open');
}

function closeProfile(){
  document.getElementById('profileOverlay').classList.remove('open');
}

/* ---------- render poet grid ---------- */
function renderPoetGrid(){
  const grid = document.getElementById('poetGrid');
  grid.innerHTML = '';
  Object.entries(POETS).forEach(([key,p])=>{
    const card = document.createElement('div');
    card.className = 'poet-card';
    card.onclick = ()=>choosePoet(key);
    card.innerHTML = `
      <button class="info-btn" onclick="event.stopPropagation(); openProfile('${key}')">i</button>
      <span class="fa">${p.formFa}</span>
      <h3>${p.ja}</h3>
      <p>${p.desc}<br>詩形:${p.form}</p>
      <span class="poet-tag">${p.tag}</span>`;
    grid.appendChild(card);
  });
}

function choosePoet(key){
  currentPoet = key;
  selectedWords = [];
  drawHand();
  renderCards();
  goTo('cards');
  if(soundOn) startDrone();
}

function drawHand(){
  const pool = [...POETS[currentPoet].vocab];
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  currentHand = pool.slice(0, Math.min(HAND_SIZE, pool.length));
  selectedWords = [];
}

function redraw(){
  drawHand();
  renderCards();
}

function renderCards(){
  const p = POETS[currentPoet];
  document.getElementById('drawPoetJa').textContent = p.ja + ' — ' + p.form;
  document.getElementById('drawPoetFa').textContent = p.fa + ' — ' + p.formFa;
  updateCounter();
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  currentHand.forEach((w,idx)=>{
    const el = document.createElement('div');
    el.className = 'word-card' + (selectedWords.includes(idx) ? ' selected' : '');
    el.onclick = ()=>toggleWord(idx);
    el.innerHTML = `<span class="fa">${w.fa}</span><span class="translit">${w.t}</span><span class="gloss">${w.ja}</span>`;
    grid.appendChild(el);
  });
}

function toggleWord(idx){
  const pos = selectedWords.indexOf(idx);
  if(pos >= 0){
    selectedWords.splice(pos,1);
  } else {
    if(selectedWords.length >= PICK_COUNT) return;
    selectedWords.push(idx);
  }
  renderCards();
  updateCounter();
}

function updateCounter(){
  document.getElementById('drawCounter').textContent = `言葉を選ぶ (${selectedWords.length} / ${PICK_COUNT})`;
  document.getElementById('generateBtn').disabled = selectedWords.length !== PICK_COUNT;
}

/* ---------- generation (fully local — no network needed) ---------- */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function generatePoem(){
  const p = POETS[currentPoet];
  const words = selectedWords.map(i=>currentHand[i]);
  goTo('loading');
  document.getElementById('loadingGlyph').textContent = p.formFa;

  // small delay purely for atmosphere — generation itself is instant & offline
  setTimeout(()=>{
    const openers = shuffle(p.openers);
    const closers = shuffle(p.closers);

    const verses = words.map((w,i)=>{
      const op = openers[i % openers.length];
      const cl = closers[i % closers.length];
      return {
        fa: `${op.fa(w.fa)}<br>${cl.fa}`,
        ja: `${op.ja(w.ja)}——${cl.ja}`
      };
    });

    const wordGlosses = words.map(w=>w.ja);
    const poem = {
      title_fa: words[0].fa,
      title_ja: `${words[0].ja}の詩`,
      verses: verses,
      commentary_ja: `選んだ言葉——${wordGlosses.join('・')}——を軸に、${p.ja}(${p.fa})の様式による${p.form}(${p.formFa})を書き下ろした。各句は、一つの言葉から立ち上がるイメージと、それに応える一行の対句(バイト)で構成されている。実在の詩の引用ではなく、本作オリジナルの創作。`
    };

    lastPoem = poem;
    renderResult(poem, p);
    goTo('result');
    if(soundOn) startDrone();
  }, 550);
}

function renderResult(poem, p){
  let versesHtml = '';
  poem.verses.forEach(v=>{
    versesHtml += `<div class="verse-block">
        <div class="verse-fa fa">${v.fa}</div>
        <div class="verse-ja">${v.ja}</div>
      </div>`;
  });
  document.getElementById('resultInner').innerHTML = `
    <div class="poem-title">
      <div class="poem-title-ja">${poem.title_ja || ''}</div>
      <div class="poem-title-fa fa">${poem.title_fa || ''}</div>
    </div>
    ${versesHtml}
    <div class="divider"></div>
    <div class="commentary-label">創作メモ</div>
    <div class="commentary">${poem.commentary_ja || ''}</div>
    <div class="attribution">${p.ja}(${p.fa})の様式による書き下ろし・${p.form}</div>
  `;
}

/* ============================================================
   Ambient dastgah-inspired drone — richer, deeper version
   Layers: sub-bass drone, detuned mid drone (chorus), lowpass
   warmth, generated hall reverb, soft frame-drum pulse, melody.
   ============================================================ */
let audioCtx = null;
let soundOn = false;
let droneNodes = [];
let masterGain = null;
let reverbGain = null;
let dryGain = null;
let drumTimer = null;
let melodyTimer = null;

function ensureAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.9;
  masterGain.connect(audioCtx.destination);

  dryGain = audioCtx.createGain();
  dryGain.gain.value = 0.75;
  dryGain.connect(masterGain);

  const convolver = audioCtx.createConvolver();
  convolver.buffer = buildImpulseResponse(audioCtx, 3.2, 2.4);
  reverbGain = audioCtx.createGain();
  reverbGain.gain.value = 0.55;
  convolver.connect(reverbGain);
  reverbGain.connect(masterGain);
  audioCtx._convolver = convolver;
}

function buildImpulseResponse(ctx, duration, decay){
  const rate = ctx.sampleRate;
  const length = Math.floor(rate * duration);
  const impulse = ctx.createBuffer(2, length, rate);
  for(let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i=0; i<length; i++){
      data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/length, decay);
    }
  }
  return impulse;
}

function busConnect(node){
  node.connect(dryGain);
  node.connect(audioCtx._convolver);
}

function toggleSound(){
  ensureAudio();
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  soundOn = !soundOn;
  const btn = document.getElementById('soundToggle');
  if(soundOn){
    btn.textContent = '♪ 音楽 ON'; btn.classList.add('on'); startDrone();
  } else {
    btn.textContent = '♪ 音楽 OFF'; btn.classList.remove('on'); stopDrone();
  }
}

function stopDrone(){
  droneNodes.forEach(n=>{ try{ n.osc.stop(); }catch(e){} });
  droneNodes = [];
  if(drumTimer){ clearTimeout(drumTimer); drumTimer = null; }
  if(melodyTimer){ clearTimeout(melodyTimer); melodyTimer = null; }
}

function startDrone(){
  if(!soundOn) return;
  stopDrone();
  const scale = (currentPoet ? POETS[currentPoet] : POETS.hafez).scale;
  const now = audioCtx.currentTime;

  // warm lowpass shared by the drone layer
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 900;
  filter.Q.value = 0.7;
  busConnect(filter);

  // sub-bass root, two octaves down — gives the piece weight
  const rootFreq = scale[0] / 4;
  const sub = audioCtx.createOscillator();
  const subGain = audioCtx.createGain();
  sub.type = 'sine'; sub.frequency.value = rootFreq; subGain.gain.value = 0;
  sub.connect(subGain).connect(filter); sub.start();
  subGain.gain.linearRampToValueAtTime(0.09, now + 3);
  droneNodes.push({osc:sub, gain:subGain});

  // mid drone: three scale tones, each as a detuned pair (chorus) for richness
  scale.slice(0,3).forEach((freq,i)=>{
    [-4, 4].forEach(cents=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq/2;
      osc.detune.value = cents;
      gain.gain.value = 0;
      osc.connect(gain).connect(filter);
      osc.start();
      gain.gain.linearRampToValueAtTime(0.028, now + 2.5 + i*0.5);
      droneNodes.push({osc,gain});
    });
  });

  scheduleDrum();
  scheduleMelody();
}

/* soft, low frame-drum-like pulse — filtered noise burst, gives a slow heartbeat */
function playDrumHit(){
  const now = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.3;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 3); }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 160;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.16;
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  noise.connect(filter).connect(gain);
  busConnect(gain);
  noise.start(now);
}

function scheduleDrum(){
  if(!soundOn) return;
  playDrumHit();
  drumTimer = setTimeout(scheduleDrum, 4200 + Math.random()*2600);
}

function scheduleMelody(){
  if(!soundOn) return;
  const scale = (currentPoet ? POETS[currentPoet] : POETS.hafez).scale;
  const freq = scale[Math.floor(Math.random()*scale.length)];
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 2200;
  const gain = audioCtx.createGain();
  osc.type = 'triangle'; osc.frequency.value = freq; gain.gain.value = 0;
  osc.connect(filter).connect(gain);
  busConnect(gain);
  osc.start(now);
  gain.gain.linearRampToValueAtTime(0.06, now + 0.5);
  gain.gain.linearRampToValueAtTime(0, now + 3.4);
  osc.stop(now + 3.6);
  melodyTimer = setTimeout(scheduleMelody, 1800 + Math.random()*1800);
}

renderPoetGrid();
</script>
