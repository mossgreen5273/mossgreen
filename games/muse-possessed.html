<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>詩神憑依 — Muse-Possessed</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Noto+Serif+JP:wght@400;600;700&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --ink-navy: #171a2e;
    --wine-dark: #241533;
    --wine-mid: #3a1f3f;
    --bronze: #b3894a;
    --bronze-light: #d9b877;
    --parchment: #ece2c8;
    --parchment-dim: #d8ccac;
    --oxblood: #7a2b2b;
    --oxblood-light: #a8483f;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #4a2a55 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #1c3350 0%, transparent 60%),
      linear-gradient(160deg, var(--ink-navy) 0%, var(--wine-dark) 45%, var(--wine-mid) 100%);
    font-family:'Noto Serif JP', 'EB Garamond', serif;
    color: var(--parchment);
    padding: 32px 20px 80px;
  }

  /* --- Splash screen --- */
  #splash{
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #0d0a14;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition: opacity 1.1s ease;
  }
  #splash.fading{ opacity: 0; pointer-events: none; }
  #splash img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    animation: splashZoom 5s ease-out forwards;
  }
  @keyframes splashZoom{
    0%{ transform: scale(1.08); opacity: 0; }
    15%{ opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
  }
  #splash::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(13,10,20,0.35) 0%, rgba(13,10,20,0.25) 40%, rgba(13,10,20,0.88) 100%);
  }
  .splash-title{
    position:relative;
    z-index: 2;
    text-align:center;
    color: var(--parchment);
    opacity: 0;
    animation: splashTextIn 1.4s ease forwards;
    animation-delay: 0.5s;
  }
  @keyframes splashTextIn{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .splash-eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--bronze-light);
    margin-bottom: 12px;
  }
  .splash-title h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(32px, 7vw, 50px);
    margin: 0;
    letter-spacing: 0.04em;
  }
  .splash-title .jp2{
    font-family:'Noto Serif JP', serif;
    font-size: 0.5em;
    display:block;
    color: var(--parchment-dim);
    font-weight: 700;
    margin-top: 10px;
    letter-spacing: 0.2em;
  }
  .splash-hint{
    position:absolute;
    bottom: 28px;
    left:0; right:0;
    text-align:center;
    z-index:2;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--parchment-dim);
    opacity: 0;
    animation: splashTextIn 1s ease forwards;
    animation-delay: 1.6s;
  }

  .wrap{max-width: 920px; margin: 0 auto;}

  header{
    text-align:center;
    margin-bottom: 36px;
  }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--bronze-light);
    margin-bottom: 10px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(30px, 5vw, 46px);
    margin: 0 0 6px;
    letter-spacing: 0.03em;
  }
  h1 .jp{
    font-family:'Noto Serif JP', serif;
    font-size: 0.62em;
    display:block;
    color: var(--parchment-dim);
    font-weight: 600;
    margin-top: 4px;
    letter-spacing: 0.12em;
  }

  .sub{
    max-width: 560px;
    margin: 14px auto 0;
    font-size: 14px;
    line-height: 1.9;
    color: var(--parchment-dim);
  }

  .bgm-bar{
    display:flex;
    justify-content:center;
    margin-bottom: 6px;
  }
  .bgm-btn{
    background: rgba(179,137,74,0.12);
    border: 1px solid rgba(179,137,74,0.4);
    color: var(--bronze-light);
    font-family:'Noto Serif JP', serif;
    font-size: 12px;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background .2s ease;
  }
  .bgm-btn:hover{ background: rgba(179,137,74,0.22); }
  .bgm-btn.playing{ background: rgba(179,137,74,0.3); }

  .divider{
    width: 120px;
    height: 1px;
    margin: 22px auto;
    background: linear-gradient(90deg, transparent, var(--bronze), transparent);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .card{
    position:relative;
    background: linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dim) 100%);
    color: #2a1f14;
    border-radius: 3px;
    padding: 14px 12px 12px;
    cursor:pointer;
    border: 1px solid rgba(0,0,0,0.15);
    box-shadow: 0 3px 0 rgba(0,0,0,0.25), 0 8px 16px rgba(0,0,0,0.25);
    transition: transform .15s ease, box-shadow .15s ease;
    user-select:none;
  }
  .card:hover{ transform: translateY(-3px); }
  .card.selected{
    background: linear-gradient(160deg, #f5e8b8 0%, #e8cf8a 100%);
    box-shadow: 0 0 0 2px var(--bronze), 0 6px 18px rgba(179,137,74,0.5);
    transform: translateY(-4px);
  }

  .era-tag{
    position:absolute;
    top: 8px; right: 8px;
    font-size: 9px;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 2px;
    font-family:'Noto Serif JP', serif;
    font-weight: 700;
  }
  .era-tag.classical{ background: var(--oxblood); color: #f6e9d8; }
  .era-tag.modern{ background: #2f5a4f; color: #e6f3ee; }

  .greek{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 21px;
    font-weight: 600;
    margin: 6px 0 6px;
    line-height: 1.15;
  }
  .translit{
    font-size: 10px;
    color: #6b5a3f;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .jp-word{ font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .en-word{ font-size: 11px; color: #5c4a30; font-style: italic; }

  .controls{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }
  .count{
    font-size: 13px;
    color: var(--parchment-dim);
    letter-spacing: 0.04em;
  }
  .count b{ color: var(--bronze-light); }

  button.weave{
    font-family:'Cormorant Garamond', serif;
    font-size: 17px;
    letter-spacing: 0.08em;
    padding: 13px 34px;
    background: linear-gradient(160deg, var(--bronze-light), var(--bronze));
    color: #241533;
    border: none;
    border-radius: 2px;
    cursor:pointer;
    font-weight: 700;
    box-shadow: 0 4px 0 #7c5c2c, 0 10px 20px rgba(0,0,0,0.35);
    transition: transform .12s ease;
  }
  button.weave:disabled{
    background: #5c5240;
    color: #9a9081;
    box-shadow:none;
    cursor:not-allowed;
  }
  button.weave:not(:disabled):hover{ transform: translateY(-2px); }
  button.weave:not(:disabled):active{ transform: translateY(1px); }

  .reset{
    background:none;
    border: 1px solid var(--bronze);
    color: var(--bronze-light);
    font-family:'Noto Serif JP', serif;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 2px;
    cursor: pointer;
  }

  .result{
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(179,137,74,0.35);
    border-radius: 4px;
    padding: 28px 26px;
    margin-top: 10px;
    position: relative;
  }
  .result::before{
    content: "";
    position:absolute; inset: 6px;
    border: 1px solid rgba(179,137,74,0.18);
    pointer-events:none;
  }

  .poem-block{ margin-bottom: 22px; }
  .poem-label{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--bronze-light);
    margin-bottom: 10px;
  }
  .poem-grc{
    font-family:'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 600;
    line-height: 2;
    white-space: pre-wrap;
    color: var(--bronze-light);
    margin-bottom: 14px;
    letter-spacing: 0.01em;
  }
  .poem-jp{
    font-size: 16px;
    line-height: 2.1;
    white-space: pre-wrap;
    margin-bottom: 14px;
  }
  .poem-en{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.85;
    white-space: pre-wrap;
    color: var(--parchment-dim);
  }

  .scores{
    display:flex;
    gap: 26px;
    margin: 22px 0;
    flex-wrap: wrap;
  }
  .score{
    flex: 1;
    min-width: 140px;
  }
  .score-label{ font-size: 11px; color: var(--parchment-dim); letter-spacing:0.05em; margin-bottom:6px;}
  .bar-track{
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--oxblood-light), var(--bronze-light));
    border-radius: 3px;
    transition: width .8s ease;
  }
  .score-num{ font-size: 13px; color: var(--bronze-light); margin-top: 4px; }

  .commentary{
    border-top: 1px solid rgba(179,137,74,0.25);
    padding-top: 18px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--parchment-dim);
  }
  .commentary .en{
    font-style: italic;
    margin-top: 10px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
  }

  .loading, .error{
    text-align:center;
    padding: 40px 20px;
    color: var(--parchment-dim);
    font-size: 14px;
  }
  .error{ color: #e2a5a0; }

  .lyre{
    display:inline-block;
    animation: sway 1.6s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-4deg); }
    50%{ transform: rotate(4deg); }
  }

  @media (max-width: 480px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
    .controls{ flex-direction: column; align-items: stretch; }
    button.weave{ width: 100%; }
  }
</style>
</head>

let selected = [];
const MAX_SELECT = 5;

const CARDS_SHOWN = 20;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// プール全体からランダムに CARDS_SHOWN 枚を引く
function drawCards(){
  return shuffle(WORDS).slice(0, CARDS_SHOWN);
}

let shuffled = drawCards();

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  shuffled.forEach((w, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (selected.includes(idx) ? ' selected' : '');
    card.innerHTML = `
      <div class="era-tag ${w.era}">${w.era === 'classical' ? '古' : '現'}</div>
      <div class="greek">${w.greek}</div>
      <div class="translit">${w.translit}</div>
      <div class="jp-word">${w.jp}</div>
      <div class="en-word">${w.en}</div>
    `;
    card.addEventListener('click', () => toggleSelect(idx));
    grid.appendChild(card);
  });
  updateControls();
}

function toggleSelect(idx){
  if(selected.includes(idx)){
    selected = selected.filter(i => i !== idx);
  } else {
    if(selected.length >= MAX_SELECT) return;
    selected.push(idx);
  }
  renderGrid();
}

function updateControls(){
  document.getElementById('selCount').textContent = selected.length;
  document.getElementById('selCountEn').textContent = selected.length;
  document.getElementById('weaveBtn').disabled = selected.length === 0;
}

// 選択のみクリア(カードはそのまま)
document.getElementById('resetBtn').addEventListener('click', () => {
  selected = [];
  document.getElementById('resultArea').innerHTML = '';
  renderGrid();
});

// カード自体をプールから引き直す
document.getElementById('redrawBtn').addEventListener('click', () => {
  shuffled = drawCards();
  selected = [];
  document.getElementById('resultArea').innerHTML = '';
  renderGrid();
});

document.getElementById('weaveBtn').addEventListener('click', weavePoem);

  {jp:"「{w1}」と「{w2}」という取り合わせが、詩全体に思いがけない奥行きを与えている。",
   en:'The pairing of "{w1}" and "{w2}" lends the whole poem an unexpected depth.'},
  {jp:"「{w1}」の傍らに「{w2}」を置くことで、両者の対比がかえって際立つ結果となった。",
   en:'Placing "{w2}" beside "{w1}" throws the contrast between the two into sharper relief.'},
  {jp:"「{w1}」と「{w2}」、この二つの言葉が響き合うことで、詩に独特のリズムが生まれている。",
   en:'"{w1}" and "{w2}" echo against each other, giving the verse its own particular rhythm.'},
];

// 叙事詩度の帯ごとの評
const EPIC_TIER_COMMENTS = {
  high: {jp:"叙事詩としての格調は極めて高く、古の吟遊詩人の系譜に恥じない出来栄えと言えるだろう。",
         en:"As epic verse, its register runs high — a piece the old bards themselves would not disown."},
  mid:  {jp:"叙事詩としての骨格はしっかりしており、安定した気品を保っている。",
         en:"Its epic bones are sound, holding a steady and dignified poise."},
  low:  {jp:"型破りな一節ではあるが、それもまた一興だろう。",
         en:"An unconventional verse, perhaps — but there is charm in that too."},
};

// 時代錯りの妙の帯ごとの評
const ANACH_TIER_COMMENTS = {
  high: {jp:"時代を大胆に飛び越える遊び心が、随所に効いている。",
         en:"A bold, playful leap across eras shows through at every turn."},
  mid:  {jp:"控えめながら、現代の気配がそこはかとなく忍び込んでいる。",
         en:"Subtly, faintly, a trace of the modern world has crept in."},
  low:  {jp:"現代の気配はほとんどなく、純粋な叙事詩の趣が保たれている。",
         en:"With barely a trace of the modern world, the poem keeps a purely epic character."},
};

function tierOf(score, midMin, highMin){
  if(score >= highMin) return 'high';
  if(score >= midMin) return 'mid';
  return 'low';
}

function pickRandom(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function clamp(n, min, max){
  return Math.max(min, Math.min(max, n));
}

function generateLocalPoem(chosenWords){
  // 詩の中での並び順は毎回シャッフルする(選んだ順序に意味を持たせないため)
  const order = shuffle(chosenWords);

  const opening = pickRandom(OPENING_LINES);
  const closing = pickRandom(CLOSING_LINES);

  // 各単語につき「本句+繋ぎの句」の対句を作り、詩に厚みを持たせる
  const bodyLines = [];
  order.forEach(w => {
    const t = pickRandom(LINE_TEMPLATES);
    bodyLines.push({
      grc: t.grc.replace('{E}', w.epithet.grc),
      jp: t.jp.replace('{E}', w.epithet.jp),
      en: t.en.replace('{E}', w.epithet.en),
    });
    const r = pickRandom(REFLECTION_LINES);
    bodyLines.push({ grc: r.grc, jp: r.jp, en: r.en });
  });

  const poem_grc = [opening.grc, ...bodyLines.map(l => l.grc), closing.grc].join('\n');
  const poem_jp = [opening.jp, ...bodyLines.map(l => l.jp), closing.jp].join('\n');
  const poem_en = [opening.en, ...bodyLines.map(l => l.en), closing.en].join('\n');

  const classicalCount = chosenWords.filter(w => w.era === 'classical').length;
  const modernCount = chosenWords.length - classicalCount;

  const epic_score = clamp(Math.round(55 + classicalCount * 9 + (Math.random() * 10 - 5)), 0, 100);
  const anachronism_score = clamp(Math.round(modernCount * 22 + (Math.random() * 10 - 5)), 0, 100);

  // --- 解説を複数の視点(語選び全体・単語同士の組み合わせ・スコアの読み解き)から組み立てる ---
  const commentParts_jp = [];
  const commentParts_en = [];

  if(modernCount === 0){
    const c = pickRandom(CLASSICAL_ONLY_COMMENTS);
    commentParts_jp.push(c.jp);
    commentParts_en.push(c.en);
  } else {
    const modernWord = chosenWords.find(w => w.era === 'modern');
    const c = pickRandom(MIXED_COMMENTS);
    commentParts_jp.push(c.jp.replace('{modernWord}', modernWord.jp));
    commentParts_en.push(c.en.replace('{modernWord}', modernWord.en));
  }

  if(chosenWords.length >= 2){
    const shuffledForPair = shuffle(chosenWords);
    const [w1, w2] = shuffledForPair;
    const pc = pickRandom(PAIR_COMMENTS);
    commentParts_jp.push(pc.jp.replace('{w1}', w1.jp).replace('{w2}', w2.jp));
    commentParts_en.push(pc.en.replace('{w1}', w1.en).replace('{w2}', w2.en));
  }

  const epicTier = tierOf(epic_score, 55, 80);
  commentParts_jp.push(EPIC_TIER_COMMENTS[epicTier].jp);
  commentParts_en.push(EPIC_TIER_COMMENTS[epicTier].en);

  const anachTier = tierOf(anachronism_score, 20, 60);
  commentParts_jp.push(ANACH_TIER_COMMENTS[anachTier].jp);
  commentParts_en.push(ANACH_TIER_COMMENTS[anachTier].en);

  const commentary_jp = commentParts_jp.join('');
  const commentary_en = commentParts_en.join(' ');

  return { poem_grc, poem_jp, poem_en, commentary_jp, commentary_en, epic_score, anachronism_score };
}

async function weavePoem(){
  const resultArea = document.getElementById('resultArea');
  const chosenWords = selected.map(i => shuffled[i]);

  resultArea.innerHTML = `
    <div class="result">
      <div class="loading"><span class="lyre">🎼</span><br><br>詩神が言葉を紡いでいます…<br>The Muse is weaving your verse…</div>
    </div>
  `;

  // サーバー・AI APIは使わず、ブラウザ内だけで詩を組み立てる。
  // (演出として一瞬の「間」を置く)
  await new Promise(resolve => setTimeout(resolve, 550));

  try{
    const parsed = generateLocalPoem(chosenWords);

    resultArea.innerHTML = `
      <div class="result">
        <div class="poem-block">
          <div class="poem-label">Ἀρχαία Ἑλληνική · 古典ギリシア語</div>
          <div class="poem-grc">${escapeHtml(parsed.poem_grc)}</div>
        </div>
        <div class="poem-block">
          <div class="poem-label">日本語版</div>
          <div class="poem-jp">${escapeHtml(parsed.poem_jp)}</div>
        </div>
        <div class="poem-block">
          <div class="poem-label">English</div>
          <div class="poem-en">${escapeHtml(parsed.poem_en)}</div>
        </div>

        <div class="scores">
          <div class="score">
            <div class="score-label">叙事詩度 · Epic Fidelity</div>
            <div class="bar-track"><div class="bar-fill" style="width:${parsed.epic_score}%"></div></div>
            <div class="score-num">${parsed.epic_score} / 100</div>
          </div>
          <div class="score">
            <div class="score-label">時代錯りの妙 · Anachronistic Wit</div>
            <div class="bar-track"><div class="bar-fill" style="width:${parsed.anachronism_score}%"></div></div>
            <div class="score-num">${parsed.anachronism_score} / 100</div>
          </div>
        </div>

        <div class="commentary">
          <div>${escapeHtml(parsed.commentary_jp)}</div>
          <div class="en">${escapeHtml(parsed.commentary_en)}</div>
        </div>
      </div>
    `;
  } catch(err){
    console.error("Poem generation error:", err);
    resultArea.innerHTML = `
      <div class="result">
        <div class="error">詩神の声が届きませんでした。もう一度お試しください。<br>The Muse's voice was lost. Please try again.</div>
      </div>
    `;
  }
}

function escapeHtml(str){
  if(!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==========================================================
// BGM: 「主よ、人の望みの喜びよ」(J.S.バッハ, パブリックドメイン) の編曲
// 有名な流れるようなアルペジオ伴奏 + コラール風旋律を
// Web Audio APIで自前生成してループ再生する。
// ==========================================================
(function initBGM(){
  const N = {
    C3:130.81, D3:146.83, E3:164.81, Fs3:185.00, G3:196.00, A3:220.00, B3:246.94,
    C4:261.63, D4:293.66, E4:329.63, Fs4:369.99, G4:392.00, A4:440.00, B4:493.88,
    C5:523.25, D5:587.33,
    G2:98.00, A2:110.00, B2:123.47, C2:65.41*2, D2:73.42*2, E2:82.41*2, Fs2:92.50*2
  };

  // テンポ倍率:大きいほどゆっくり・荘重になる
  const TEMPO = 1.75;

  // コラール風の旋律(バッハの原曲の輪郭を踏まえた編曲。逐語的な採譜ではない)
  const MELODY = [
    {f:N.G4,d:0.6},{f:N.G4,d:0.6},{f:N.Fs4,d:0.6},{f:N.G4,d:0.6},
    {f:N.A4,d:0.6},{f:N.B4,d:0.6},{f:N.B4,d:0.6},{f:N.A4,d:0.6},
    {f:N.G4,d:0.6},{f:N.A4,d:0.6},{f:N.B4,d:0.6},{f:N.C5,d:0.6},
    {f:N.D5,d:1.2},{f:N.C5,d:0.6},{f:N.B4,d:0.6},
    {f:N.A4,d:0.6},{f:N.B4,d:0.6},{f:N.C5,d:0.6},{f:N.B4,d:0.6},
    {f:N.A4,d:0.6},{f:N.G4,d:0.6},{f:N.Fs4,d:0.6},{f:N.G4,d:0.6},
    {f:N.A4,d:0.6},{f:N.G4,d:0.6},{f:N.Fs4,d:0.6},{f:N.E4,d:0.6},
    {f:N.D4,d:1.8},
  ].map(n => ({f:n.f, d:n.d * TEMPO}));

  // 和声進行(各コードの持続秒数)。原曲を思わせるI-V-vi-IVの循環を軽く踏襲。
  const CHORD_DEFS = [
    {notes:[N.G3,N.B3,N.D4,N.G4], bass:N.G2, dur:2.4},   // G
    {notes:[N.D3,N.Fs3,N.A3,N.D4], bass:N.D2, dur:2.4},  // D
    {notes:[N.E3,N.G3,N.B3,N.E4], bass:N.E2, dur:2.4},   // Em
    {notes:[N.C3,N.E3,N.G3,N.C4], bass:N.C2, dur:2.4},   // C
    {notes:[N.G3,N.B3,N.D4,N.G4], bass:N.G2, dur:2.4},   // G
    {notes:[N.D3,N.Fs3,N.A3,N.D4], bass:N.D2, dur:2.4},  // D
    {notes:[N.E3,N.G3,N.B3,N.E4], bass:N.E2, dur:1.8},   // Em
    {notes:[N.G3,N.B3,N.D4,N.G4], bass:N.G2, dur:2.4},   // G (終止)
  ].map(c => ({...c, dur: c.dur * TEMPO}));

  // 各コード区間を、原曲を象徴する流れるようなアルペジオで埋める(テンポを落とした分、粒立ちも大きめに)
  function buildArpeggio(chords, eighth){
    const pattern = [0,1,2,3,2,1,0,1]; // ルート-3度-5度-8度...と巡る定番の流れるパターン
    const notes = [];
    chords.forEach(chord => {
      let t = 0, i = 0;
      while(t < chord.dur - 1e-6){
        const idx = pattern[i % pattern.length] % chord.notes.length;
        notes.push({f: chord.notes[idx], d: eighth});
        t += eighth; i++;
      }
    });
    return notes;
  }
  const ACCOMPANIMENT = buildArpeggio(CHORD_DEFS, 0.3 * TEMPO);

  // 通奏低音のペダル(各コードごとに1音、持続させて厳かさを出す)
  const PEDAL = CHORD_DEFS.map(c => ({f: c.bass, d: c.dur}));

  let ctx = null, master = null, convolver = null, dryGain = null, wetGain = null;
  let playing = false, timeoutId = null;

  // 簡易的な残響(教会・大聖堂のような空間感)をノイズから合成する
  function makeReverbImpulse(context, seconds, decay){
    const rate = context.sampleRate;
    const length = rate * seconds;
    const impulse = context.createBuffer(2, length, rate);
    for(let ch = 0; ch < 2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i = 0; i < length; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  function ensureAudioGraph(){
    if(ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.55;

    dryGain = ctx.createGain();
    dryGain.gain.value = 0.75;
    wetGain = ctx.createGain();
    wetGain.gain.value = 0.35;

    convolver = ctx.createConvolver();
    convolver.buffer = makeReverbImpulse(ctx, 3.2, 2.5);

    master.connect(dryGain).connect(ctx.destination);
    master.connect(convolver).connect(wetGain).connect(ctx.destination);
  }

  // 丸めの音色・ゆったりしたアタックで、厳かに音を鳴らす
  function playNote(freq, startTime, dur, type, peak, attack){
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(peak, startTime + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    osc.connect(gain).connect(master);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.1);
  }

  function scheduleLoop(){
    const now = ctx.currentTime + 0.2;

    let tMel = now;
    MELODY.forEach(n => { playNote(n.f, tMel, n.d * 0.96, 'sine', 0.17, Math.min(0.18, n.d * 0.35)); tMel += n.d; });

    let tAcc = now;
    ACCOMPANIMENT.forEach(n => { playNote(n.f, tAcc, n.d * 0.95, 'sine', 0.055, Math.min(0.12, n.d * 0.3)); tAcc += n.d; });

    let tPed = now;
    PEDAL.forEach(n => { playNote(n.f, tPed, n.d * 0.98, 'sine', 0.10, Math.min(0.5, n.d * 0.3)); tPed += n.d; });

    const totalDur = MELODY.reduce((s, n) => s + n.d, 0);
    timeoutId = setTimeout(scheduleLoop, totalDur * 1000);
  }

  const bgmBtn = document.getElementById('bgmBtn');
  bgmBtn.addEventListener('click', () => {
    if(!playing){
      ensureAudioGraph();
      if(ctx.state === 'suspended') ctx.resume();
      playing = true;
      scheduleLoop();
      bgmBtn.textContent = '🔇 BGM停止 · Stop BGM';
      bgmBtn.classList.add('playing');
    } else {
      playing = false;
      clearTimeout(timeoutId);
      // scheduleLoop は1ループ分(数十秒先)の音を前もって全部スケジュール済みのため、
      // clearTimeout だけでは次のループを止められても「今鳴っている分」は消えない。
      // AudioContext自体を破棄することで、予約済みの音も含めて即座に無音にする。
      if(ctx){
        ctx.close();
        ctx = null;
        master = null;
        convolver = null;
        dryGain = null;
        wetGain = null;
      }
      bgmBtn.textContent = '🎵 BGM再生 · Play BGM';
      bgmBtn.classList.remove('playing');
    }
  });
})();

renderGrid();

// --- Splash screen: 数秒表示してからゲーム画面へフェード ---
(function initSplash(){
  const splash = document.getElementById('splash');
  let dismissed = false;
  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    splash.classList.add('fading');
    setTimeout(() => { splash.style.display = 'none'; }, 1100);
  }
  setTimeout(dismiss, 3200); // 3.2秒後に自動遷移
  splash.addEventListener('click', dismiss); // タップでスキップ可能
})();
</script>
