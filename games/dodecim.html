<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DODECIM(十二紋章戦) — あおの</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#16171a; --ink-dim:#6b6f76; --line:#e7e7e9;
    --accent:#a97f1f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter','Noto Sans JP',sans-serif; -webkit-font-smoothing:antialiased; }
  a{color:inherit;}
  .jp{font-family:'Noto Sans JP','Inter',sans-serif;}
  .wrap{max-width:640px; margin:0 auto; padding:0 24px 100px;}

  header.nav{ display:flex; align-items:center; justify-content:space-between; padding:36px 0 30px; }
  .back-link{ font-size:15px; text-decoration:none; color:var(--ink-dim); transition:color .15s; }
  .back-link:hover{ color:var(--ink); }
  .nav-name{ font-size:19px; font-weight:700; text-decoration:underline; text-underline-offset:4px; }

  .thumb{ width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden; margin-bottom:28px; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

  .status-tag{
    display:inline-block; font-size:12.5px; font-weight:500; color:var(--accent);
    border:1px solid var(--accent); padding:5px 12px; border-radius:999px; margin-bottom:20px;
  }
  h1{ font-size:clamp(26px,5vw,34px); font-weight:700; margin:0 0 6px; letter-spacing:-0.01em; }
  .subtitle{ font-size:14.5px; color:var(--ink-dim); margin-bottom:26px; }
  .lede{ font-size:16px; line-height:1.9; color:var(--ink); margin:0 0 36px; }

  .spec-list{ border-top:1px solid var(--line); margin-top:30px; }
  .spec-row{
    display:flex; justify-content:space-between; gap:20px;
    padding:16px 0; border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .spec-row .k{ color:var(--ink-dim); flex:0 0 130px; }
  .spec-row .v{ text-align:right; }

  .note{
    margin-top:36px; padding:18px 20px; background:#f7f7f8; border-radius:10px;
    font-size:14px; line-height:1.8; color:var(--ink-dim);
  }

  footer{ padding-top:50px; font-size:13.5px; color:var(--ink-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header class="nav">
    <a class="back-link" href="../index.html">← 一覧に戻る</a>
    <span class="nav-name">あおの</span>
  </header>

  <div class="thumb"><img src="../images/thumb-dodecim.png" alt="DODECIM サムネイル"></div>

  <span class="status-tag jp">開発中</span>
  <h1 class="jp">DODECIM(十二紋章戦)</h1>
  <div class="subtitle">DODECIM</div>

  <p class="lede jp">
    十二面ダイスが趨勢を決める、レーン制のカードバトル。4つの紋章カテゴリに分かれた
    20種のカードを操り、1人プレイヤーとしてAIと対峙する。
  </p>

  <div class="spec-list">
    <div class="spec-row"><span class="k jp">形式</span><span class="v jp">1人 vs AI / レーン制カードバトル</span></div>
    <div class="spec-row"><span class="k jp">判定方式</span><span class="v jp">十二面ダイス(d12)</span></div>
    <div class="spec-row"><span class="k jp">カード数</span><span class="v jp">4カテゴリ・全20種</span></div>
    <div class="spec-row"><span class="k jp">開発環境</span><span class="v">React / JSX</span></div>
  </div>

  <div class="note jp">
    現在開発中の作品です。プレイ可能版の公開準備が整い次第、このページから
    itch.io / BOOTH のリンクを追加する予定です。
  </div>

  <footer class="jp">
    <p>あおの © 2026</p>
  </footer>
</div>
</body>
</html>
