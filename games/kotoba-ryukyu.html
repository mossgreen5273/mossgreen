    --paper:#F6F1E7;
    --ink:#1D1A15;
    --ink-soft:#5b564a;
    --accent:#E8785A;
    --deep:#0B4F4A;
    --deeper:#08262B;
    --tint:#F3E9D2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New', sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:60px;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .serif{font-family:'Shippori Mincho', serif;}

  header{background:var(--deeper);color:var(--tint);padding:34px 20px 30px;position:relative;overflow:hidden;}
  header.has-photo{
    background-image: linear-gradient(180deg, rgba(8,38,43,.55) 0%, rgba(8,38,43,.88) 78%, rgba(8,38,43,1) 100%), var(--header-photo);
    background-size:cover;
    background-position:center;
  }
  header::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px);pointer-events:none;}
  .eyebrow{font-family:'JetBrains Mono', monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;margin-bottom:10px;}
  h1{font-family:'Shippori Mincho', serif;font-weight:800;font-size:28px;line-height:1.35;margin:0 0 12px;}
  h1 small{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;font-size:13px;letter-spacing:.02em;opacity:.8;margin-top:6px;}

  /* family selector */
  .family-row{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 0;position:relative;z-index:2;}
  .family-chip{
    flex:0 0 auto;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 15px;
    background:rgba(255,255,255,.06);color:var(--tint);font-size:12.5px;font-weight:700;cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;white-space:nowrap;
  }
  .family-chip.active{background:var(--tint);color:var(--deeper);border-color:transparent;}
  .family-chip.disabled{opacity:.85;cursor:default;background:rgba(255,255,255,.03);border-style:dashed;border-color:rgba(255,255,255,.35);color:rgba(243,233,210,.85);}

  /* dialect selector */
  .dialect-row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 20px -34px;position:relative;z-index:2;}
  .dialect-chip{
    border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.07);
    color:var(--tint);cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;text-align:left;flex:1 1 auto;min-width:78px;
  }
  .dialect-chip .dc-name{font-family:'Shippori Mincho',serif;font-weight:700;font-size:13.5px;display:block;}
  .dialect-chip .dc-count{font-size:9.5px;font-family:'JetBrains Mono',monospace;opacity:.7;}
  .dialect-chip.active{background:var(--tint);color:var(--deeper);border-color:transparent;box-shadow:0 8px 18px -8px rgba(0,0,0,.4);}

  main{max-width:640px;margin:0 auto;padding:0 16px;}
  .card{background:#fff;border-radius:18px;margin-top:34px;padding:22px 18px 20px;box-shadow:0 18px 34px -22px rgba(20,15,5,.35);border:1px solid rgba(0,0,0,.05);}

  .mode-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .mode-btn{flex:1;padding:9px 8px;border-radius:999px;border:1.5px solid #e4dcc9;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .mode-btn.active{background:var(--deep);border-color:var(--deep);color:#fff;}

  label.field-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
  textarea{width:100%;min-height:96px;border-radius:12px;border:1.5px solid #e4dcc9;padding:12px 13px;font-size:15.5px;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);background:#FCFAF4;resize:vertical;line-height:1.6;}
  textarea:focus{outline:none;border-color:var(--accent);}

  .sample-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .chip{font-size:11.5px;padding:6px 11px;border-radius:999px;background:var(--tint);color:var(--deeper);border:1px solid rgba(0,0,0,.06);cursor:pointer;font-weight:600;}
  .chip:active{transform:scale(.96);}

  .convert-btn{margin-top:16px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;box-shadow:0 10px 20px -10px rgba(0,0,0,.4);}
  .convert-btn:active{transform:translateY(1px);}

  .output-wrap{margin-top:22px;display:none;}
  .output-wrap.show{display:block;}
  .output-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .hit-count{color:var(--accent);}
  .output-box{background:var(--tint);border-radius:14px;padding:18px 16px;font-size:17px;line-height:2.6;font-family:'Shippori Mincho',serif;color:var(--deeper);word-break:break-word;}
  .word-hit{position:relative;cursor:pointer;border-bottom:2px dashed var(--accent);padding-bottom:1px;font-weight:700;color:var(--deep);ruby-position:under;-webkit-ruby-position:after;margin:0 1px;}
  .romaji-tag{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--accent);
    letter-spacing:.01em;ruby-align:center;
  }

  .popover{display:none;position:fixed;left:16px;right:16px;bottom:16px;background:var(--deeper);color:var(--tint);border-radius:14px;padding:16px 18px;z-index:50;box-shadow:0 20px 40px -12px rgba(0,0,0,.55);}
  .popover.show{display:block;}
  .pop-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--tint);font-size:18px;opacity:.6;cursor:pointer;}
  .pop-region{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 8px;margin-bottom:6px;}
  .pop-orig{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7;margin-bottom:4px;}
  .pop-dialect{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;margin-bottom:2px;}
  .pop-romaji{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);margin-bottom:8px;}

let state = { family:"yaeyama", dialect:"すべて", mode:"ja" };

  "おはよう、今日はいい天気だね。",
  "ありがとう、気をつけてね。",

  "Good morning! The weather is nice today.",
  "Thank you, please be careful.",

  "Grandfather and grandmother, father and mother. The family is all healthy.",
  "My head hurts. I wash my eye, nose, and mouth.",
  "Yesterday I washed my face. The soul is here."
];

function currentFamily(){ return FAMILIES[state.family]; }

function currentEntries(){
  const fam = currentFamily();
  if(state.dialect === "すべて") return fam.entries;
  return fam.entries.filter(e => e.region === state.dialect || (e.region && e.region.includes(state.dialect)));
}

function renderFamilyRow(){
  const row = document.getElementById('familyRow');
  row.innerHTML = "";
  Object.keys(FAMILIES).forEach(key=>{
    const fam = FAMILIES[key];
    const btn = document.createElement('button');
    btn.className = 'family-chip' + (key===state.family?' active':'') + (fam.enabled?'':' disabled');
    btn.textContent = fam.enabled ? fam.label : fam.label + '（準備中）';
    if(fam.enabled){ btn.onclick = ()=> setFamily(key); }
    row.appendChild(btn);
  });
}

function renderDialectRow(){
  const row = document.getElementById('dialectRow');
  row.innerHTML = "";
  const fam = currentFamily();
  Object.keys(fam.dialects).forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'dialect-chip' + (key===state.dialect?' active':'');
    const count = key==="すべて" ? fam.entries.length : fam.entries.filter(e=>e.region===key || (e.region&&e.region.includes(key))).length;
    btn.innerHTML = `<span class="dc-name">${key}</span><span class="dc-count">${count}語</span>`;
    btn.onclick = ()=> setDialect(key);
    row.appendChild(btn);
  });
}

function setFamily(key){
  state.family = key;
  state.dialect = "すべて";
  browserState.limit = PAGE_SIZE;
  renderFamilyRow();
  renderDialectRow();
  document.getElementById('outputWrap').classList.remove('show');
  renderSamples();
  renderBrowser();
  renderSources();
}

function setDialect(key){
  state.dialect = key;
  browserState.limit = PAGE_SIZE;
  renderDialectRow();
  document.getElementById('outputWrap').classList.remove('show');
  renderBrowser();
}

function setMode(mode){
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  document.getElementById('fieldLabel').textContent = mode==='ja' ? "文章を入力 / TYPE SOMETHING" : "Type a sentence in English";
  document.getElementById('input').placeholder = mode==='ja'
    ? "例：おはよう、今日はいい天気だね。"
    : "e.g. Good morning! The weather is nice today.";
  renderSamples();
}

  list.forEach(s=>{
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.textContent = s.length>22 ? s.slice(0,22)+"…" : s;
    chip.onclick = ()=>{ document.getElementById('input').value = s; convert(); };
    row.appendChild(chip);
  });
}

function buildMaps(entries){
  const jaMap = {}, enMap = {};
  entries.forEach(e=>{
    e.ja.forEach(w=> jaMap[w]=e );
    e.en.forEach(w=> enMap[w.toLowerCase()]=e );
  });
  return {jaMap, enMap};
}

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function convert(){
  const entries = currentEntries();
  const {jaMap, enMap} = buildMaps(entries);
  const raw = document.getElementById('input').value;
  const out = document.getElementById('outputBox');
  out.innerHTML = "";
  let hits = 0;

  if(!raw.trim()){ document.getElementById('outputWrap').classList.remove('show'); return; }

  if(state.mode === 'ja'){
    const keys = Object.keys(jaMap).sort((a,b)=>b.length-a.length);
    if(keys.length===0){ out.textContent = raw; }
    else{
      const re = new RegExp('(' + keys.map(escapeRegExp).join('|') + ')','g');
      raw.split(re).forEach(part=>{
        if(part === undefined || part === "") return;
        if(jaMap[part]){ hits++; out.appendChild(makeHitSpan(jaMap[part], part)); }
        else out.appendChild(document.createTextNode(part));
      });
    }
  } else {
    raw.split(/([A-Za-z']+)/).forEach(part=>{
      if(part === "") return;
      const key = part.toLowerCase();
      if(enMap[key]){ hits++; out.appendChild(makeHitSpan(enMap[key], part)); }
      else out.appendChild(document.createTextNode(part));
    });
  }

  document.getElementById('hitCount').textContent = hits>0 ? `${hits} 語を置き換えました` : "一致する語なし";
  document.getElementById('outputWrap').classList.add('show');
}

function makeHitSpan(entry, original){
  const ruby = document.createElement('ruby');
  ruby.className = 'word-hit';
  ruby.appendChild(document.createTextNode(entry.dialect));
  const rt = document.createElement('rt');
  rt.className = 'romaji-tag';
  rt.textContent = entry.romaji ? entry.romaji : '（読み未収録）';
  ruby.appendChild(rt);
  ruby.onclick = ()=> openPop(entry, original);
  return ruby;
}

function openPop(entry, original){
  document.getElementById('popRegion').textContent = entry.region || "";
  document.getElementById('popOrig').textContent = "原語: " + original;
  document.getElementById('popDialect').textContent = entry.dialect;
  const romajiEl = document.getElementById('popRomaji');
  romajiEl.textContent = entry.romaji || "(ローマ字表記は未収録)";
  document.getElementById('popNote').textContent = entry.note || "";
  document.getElementById('popSource').textContent = "出典: " + entry.source;
  document.getElementById('popover').classList.add('show');
}
function closePop(){ document.getElementById('popover').classList.remove('show'); }

const GOJUON = [
  {label:"あ", test:c=>"あいうえおぁぃぅぇぉ".includes(c)},
  {label:"か", test:c=>"かきくけこがぎぐげご".includes(c)},
  {label:"さ", test:c=>"さしすせそざじずぜぞ".includes(c)},
  {label:"た", test:c=>"たちつてとだぢづでどっ".includes(c)},
  {label:"な", test:c=>"なにぬねの".includes(c)},
  {label:"は", test:c=>"はひふへほばびぶべぼぱぴぷぺぽ".includes(c)},
  {label:"ま", test:c=>"まみむめも".includes(c)},
  {label:"や", test:c=>"やゆよゃゅょ".includes(c)},
  {label:"ら", test:c=>"らりるれろ".includes(c)},
  {label:"わ", test:c=>"わをんゎ".includes(c)}
];
let browserState = { search:"", kana:"すべて", limit:40 };
const PAGE_SIZE = 40;

function firstReadingChar(e){
  const r = e.reading || e.ja[0];
  return r ? r.charAt(0) : "";
}
function kanaRowOf(e){
  const c = firstReadingChar(e);
  const row = GOJUON.find(g=>g.test(c));
  return row ? row.label : "他";
}

function renderKanaRow(){
  const row = document.getElementById('kanaRow');
  row.innerHTML = "";
  const opts = ["すべて", ...GOJUON.map(g=>g.label), "他"];
  opts.forEach(key=>{
    const chip = document.createElement('button');
    chip.className = 'kana-chip' + (key===browserState.kana ? ' active' : '');
    chip.textContent = key;
    chip.onclick = ()=>{ browserState.kana = key; browserState.limit = PAGE_SIZE; renderKanaRow(); renderBrowser(); };
    row.appendChild(chip);
  });
}

function onSearchInput(){
  browserState.search = document.getElementById('wordSearch').value.trim();
  browserState.limit = PAGE_SIZE;
  renderBrowser();
}

function showMore(){
  browserState.limit += PAGE_SIZE;
  renderBrowser();
}

function renderBrowser(){
  const fam = currentFamily();
  document.getElementById('browserTitle').textContent = fam.label + "（" + state.dialect + "）の単語帳";

  let list = currentEntries();
  if(browserState.kana !== "すべて"){
    list = list.filter(e => kanaRowOf(e) === browserState.kana);
  }
  if(browserState.search){
    const q = browserState.search;
    list = list.filter(e => e.ja.some(w=>w.includes(q)) || e.dialect.includes(q) || (e.reading && e.reading.includes(q)));
  }

  document.getElementById('resultCount').textContent = `${list.length} 語中 ${Math.min(browserState.limit, list.length)} 語を表示`;

  const grid = document.getElementById('wordGrid');
  grid.innerHTML = "";
  list.slice(0, browserState.limit).forEach(e=>{
    const card = document.createElement('div');
    card.className = 'word-card';
    card.onclick = ()=> openPop(e, e.ja[0]);
    card.innerHTML = `<div class="wc-ja">${e.ja[0]}</div><div class="wc-region">${e.region||''}</div><div class="wc-dialect">${e.dialect}</div><div class="wc-romaji">${e.romaji}</div>`;
    grid.appendChild(card);
  });

  const moreBtn = document.getElementById('moreBtn');
  moreBtn.style.display = list.length > browserState.limit ? 'block' : 'none';
}

function renderSources(){
  const fam = currentFamily();
  const box = document.getElementById('sourcesBox');
  box.innerHTML = `
    <div class="warn">これは「翻訳機」ではなく、辞書にある単語だけを置き換える語彙学習ゲームです。琉球諸語は日本語と同じ語族なので比較的自然に読めますが、助詞や文法まで正しく変換しているわけではありません。載っていない単語はそのまま表示され、推測変換はしません。現在 ${fam.entries.length} 語収録（${fam.label}）。</div>
    <h3>収録方針・出典</h3>
    <p>${fam.sourceNote}</p>
    <p>${fam.sources.map(s=>'・'+s).join('<br>')}</p>
  `;
}

/* init */
renderFamilyRow();
renderDialectRow();
setMode('ja');
renderSamples();
renderKanaRow();
renderBrowser();
renderSources();

/* splash / cover screen */
function dismissSplash(){
  const splash = document.getElementById('splash');
  if(!splash || splash.classList.contains('hide')) return;
  splash.classList.add('hide');
  document.body.classList.remove('splash-active');
}
setTimeout(dismissSplash, 3200);
</script>
