<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2D Wave Ripple Simulator</title>
  <style>
    body { font-family: sans-serif; background: #080810; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 1.5rem; color: #00b0ff; margin-top: 0; }
    .top-bar { display: flex; justify-content: flex-end; width: 100%; max-width: 700px; }
    #langBtn { padding: 6px 14px; font-size: 0.8rem; border-radius: 4px; background: #14243a; color: #fff; border: 1px solid #2a4d6e; cursor: pointer; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    canvas { background: #000; border-radius: 8px; cursor: pointer; image-rendering: pixelated; }
    .controls { background: #10101c; padding: 20px; border-radius: 8px; width: 260px; display: flex; flex-direction: column; gap: 12px; }
    button { padding: 8px; border-radius: 4px; background: #14243a; color: #fff; border: 1px solid #2a4d6e; cursor: pointer; }
    label { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="top-bar"><button id="langBtn">EN</button></div>
  <h1 id="title">2D波動シミュレーション（波紋と干渉）</h1>
  <div class="container">
    <canvas id="canvas" width="180" height="180" style="width: 380px; height: 380px;"></canvas>
    <div class="controls">
      <button id="calmBtn">水面を静める</button>
      <label><input type="checkbox" id="autoDropChk" checked> <span id="autoDropLabel">自動の水滴</span></label>
      <div id="explain" style="font-size: 0.8rem; color: #888;">【操作】水面をクリックまたはドラッグすると波紋が広がります。</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    let buffer1 = new Float32Array(w * h);
    let buffer2 = new Float32Array(w * h);
    const damping = 0.96;
    let autoDrop = true;

    function drop(x, y, radius, strength) {
      for (let i = -radius; i <= radius; i++) {
        for (let j = -radius; j <= radius; j++) {
          if (x + i >= 0 && x + i < w && y + j >= 0 && y + j < h) {
            buffer1[(y + j) * w + (x + i)] += strength;
          }
        }
      }
    }

    function calm() {
      buffer1.fill(0);
      buffer2.fill(0);
    }

    function processWaves() {
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          let idx = y * w + x;
          buffer2[idx] = (
            buffer1[idx - 1] +
            buffer1[idx + 1] +
            buffer1[idx - w] +
            buffer1[idx + w]
          ) / 2 - buffer2[idx];
          buffer2[idx] *= damping;
        }
      }
      let temp = buffer1; buffer1 = buffer2; buffer2 = temp;
    }

    function draw() {
      processWaves();
      const imgData = ctx.createImageData(w, h);
      for (let i = 0; i < buffer1.length; i++) {
        let val = buffer1[i];
        let idx = i * 4;
        imgData.data[idx] = Math.min(255, Math.max(0, val * -12));
        imgData.data[idx+1] = Math.min(255, Math.max(0, 100 + val*20));
        imgData.data[idx+2] = Math.min(255, Math.max(0, 150 + val*30));
        imgData.data[idx+3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      requestAnimationFrame(draw);
    }

    let isDown = false;
    const addRipple = (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const x = Math.floor((cx - rect.left) * (w / rect.width));
      const y = Math.floor((cy - rect.top) * (h / rect.height));
      drop(x, y, 2, 200);
    };

    canvas.addEventListener('mousedown', e => { isDown = true; addRipple(e); });
    canvas.addEventListener('mousemove', e => { if (isDown) addRipple(e); });
    window.addEventListener('mouseup', () => isDown = false);
    canvas.addEventListener('touchstart', e => { isDown = true; addRipple(e); e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchmove', e => { if (isDown) addRipple(e); e.preventDefault(); }, {passive:false});
    window.addEventListener('touchend', () => isDown = false);

    document.getElementById('calmBtn').addEventListener('click', calm);
    document.getElementById('autoDropChk').addEventListener('change', e => autoDrop = e.target.checked);

    setInterval(() => { if (autoDrop) drop(Math.floor(Math.random()*w), Math.floor(Math.random()*h), 1, 150); }, 2000);
    draw();

    const i18n = {
      ja: {
        title: '2D波動シミュレーション（波紋と干渉）',
        explain: '【操作】水面をクリックまたはドラッグすると波紋が広がります。',
        calm: '水面を静める',
        autoDrop: '自動の水滴',
        btn: 'EN'
      },
      en: {
        title: '2D Wave Simulation (Ripples & Interference)',
        explain: '[How it works] Click or drag on the surface to create expanding ripples.',
        calm: 'Calm the Water',
        autoDrop: 'Random Drops',
        btn: '日本語'
      }
    };
    let lang = 'ja';
    function applyLang() {
      const t = i18n[lang];
      document.getElementById('title').textContent = t.title;
      document.getElementById('explain').textContent = t.explain;
      document.getElementById('calmBtn').textContent = t.calm;
      document.getElementById('autoDropLabel').textContent = t.autoDrop;
      document.getElementById('langBtn').textContent = t.btn;
      document.documentElement.lang = lang;
    }
    document.getElementById('langBtn').addEventListener('click', () => { lang = lang === 'ja' ? 'en' : 'ja'; applyLang(); });
    applyLang();
  </script>
</body>
</html>
