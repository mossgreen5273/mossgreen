<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gravity Bounce</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080820;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed;inset:0}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const C=document.getElementById('c');const X=C.getContext('2d');
let W=400,H=600,S=1;
function resize(){W=window.innerWidth||document.documentElement.clientWidth||320;H=window.innerHeight||document.documentElement.clientHeight||480;if(W<50)W=320;if(H<50)H=480;C.width=W;C.height=H;S=Math.min(W,H)/600;if(S<.3)S=.3;if(S>2.5)S=2.5;}
resize();window.addEventListener('resize',()=>{resize();if(state!=='menu')loadLvl(lvl);});

let AC=null;function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,tp,v,dl){if(!AC)return;try{const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=tp||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}
function sndBounce(){tone(280+Math.random()*200,.07,'sine',.12);}function sndGem(){tone(660,.1,'sine',.2);tone(880,.15,'sine',.2,.07);}function sndWin(){tone(523,.1,'sine',.22);tone(659,.1,'sine',.22,.1);tone(784,.2,'sine',.22,.2);}

function noteFreq(name){const SEMIS={C:-9,'C#':-8,D:-7,'D#':-6,E:-5,F:-4,'F#':-3,G:-2,'G#':-1,A:0,'A#':1,B:2};const m=name.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,(SEMIS[m[1]]+(parseInt(m[2])-4)*12)/12);}
function baseName(n){return n.replace(/\d+$/,'');}
const BGM_MELODY_TWINKLE=[['C4',1],['C4',1],['G4',1],['G4',1],['A4',1],['A4',1],['G4',2],['F4',1],['F4',1],['E4',1],['E4',1],['D4',1],['D4',1],['C4',2],['G4',1],['G4',1],['F4',1],['F4',1],['E4',1],['E4',1],['D4',2],['G4',1],['G4',1],['F4',1],['F4',1],['E4',1],['E4',1],['D4',2],['C4',1],['C4',1],['G4',1],['G4',1],['A4',1],['A4',1],['G4',2],['F4',1],['F4',1],['E4',1],['E4',1],['D4',1],['D4',1],['C4',2]];
const BGM_MELODY_WALTZ=[['A4',1],['D5',1],['F#5',1],['A5',2],['F#5',1],['G5',1],['E5',1],['C#5',1],['D5',1],['F#5',1],['A4',1],['B4',1],['D5',1],['F#5',1],['A5',2],['G5',1],['F#5',1],['D5',1],['B4',1],['G4',1],['A4',1],['D5',1],
['D5',1],['C#5',1],['B4',1],['A4',2],['F#4',1],['G4',1],['B4',1],['D5',1],['F#5',2],['E5',1],['D5',1],['B4',1],['G4',1],['A4',2],['E4',1],['F#4',1],['G4',1],['A4',1],['D4',3]];
const BGM_TRACKS=[
  {name:'きらきら星',melody:BGM_MELODY_TWINKLE,beat:.34,beatsPerMeasure:4,chordMap:{C:'C',D:'G',E:'C',F:'F',G:'C',A:'F',B:'G'}},
  {name:'花のワルツ(簡易編曲)',melody:BGM_MELODY_WALTZ,beat:.3,beatsPerMeasure:3,chordMap:{D:'D',E:'A','F#':'D',G:'G',A:'A',B:'G','C#':'A'}}
];
for(const trk of BGM_TRACKS){const grid=[],chords=[];let cur=null;for(const[note,b]of trk.melody){for(let i=0;i<b;i++){grid.push(i===0?{note,dur:b}:null);cur=i===0?note:cur;chords.push(trk.chordMap[baseName(note)]);}}trk.beatGrid=grid;trk.chordGrid=chords;}
let bgmOn=true,bgmTrack=0,bgmBeatIdx=0,bgmNextTime=0,bgmStarted=false;
function playBgmNote(freq,dur,startTime,peak,type){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(freq,startTime);g.gain.setValueAtTime(0,startTime);g.gain.linearRampToValueAtTime(peak,startTime+.025);g.gain.linearRampToValueAtTime(peak*.72,startTime+dur*.6);g.gain.linearRampToValueAtTime(0,startTime+dur*.95);o.connect(g);g.connect(AC.destination);o.start(startTime);o.stop(startTime+dur+.05);}catch(e){}}
function updateBgm(){if(!AC||AC.state!=='running')return;const trk=BGM_TRACKS[bgmTrack];if(!bgmStarted){bgmNextTime=AC.currentTime+.05;bgmStarted=true;}while(bgmNextTime<AC.currentTime+.15){const ev=trk.beatGrid[bgmBeatIdx],chordRoot=trk.chordGrid[bgmBeatIdx],mp=bgmBeatIdx%trk.beatsPerMeasure;if(bgmOn){if(ev)playBgmNote(noteFreq(ev.note),ev.dur*trk.beat*.92,bgmNextTime,.055,'triangle');if(mp===0)playBgmNote(noteFreq(chordRoot+'2'),trk.beat*.85,bgmNextTime,.075,'sine');else playBgmNote(noteFreq(chordRoot+'3'),trk.beat*.5,bgmNextTime,.022,'sine');}bgmNextTime+=trk.beat;bgmBeatIdx=(bgmBeatIdx+1)%trk.beatGrid.length;}}
function muteBtnPos(){return{x:26*S,y:H-26*S,r:Math.max(14,18*S)};}
function muteHit(mx,my){const m=muteBtnPos();return Math.hypot(mx-m.x,my-m.y)<m.r+6*S;}
function drawMuteBtn(){const m=muteBtnPos();X.fillStyle='rgba(20,20,50,0.55)';X.beginPath();X.arc(m.x,m.y,m.r,0,6.28);X.fill();X.strokeStyle='#4fc3f7';X.lineWidth=Math.max(1.5,2*S);X.stroke();X.fillStyle='#4fc3f7';X.font=`${Math.max(12,15*S)}px system-ui`;X.textAlign='center';X.textBaseline='middle';X.fillText(bgmOn?'♪':'✕',m.x,m.y+1);}
function trackBtnPos(){return{x:68*S,y:H-26*S,r:Math.max(14,18*S)};}
function trackHit(mx,my){const m=trackBtnPos();return Math.hypot(mx-m.x,my-m.y)<m.r+6*S;}
function drawTrackBtn(){const m=trackBtnPos();X.fillStyle='rgba(20,20,50,0.55)';X.beginPath();X.arc(m.x,m.y,m.r,0,6.28);X.fill();X.strokeStyle='#ba68c8';X.lineWidth=Math.max(1.5,2*S);X.stroke();X.fillStyle='#ba68c8';X.font=`bold ${Math.max(11,13*S)}px system-ui`;X.textAlign='center';X.textBaseline='middle';X.fillText(String(bgmTrack+1),m.x,m.y+1);}
function homeBtnPos(){return{x:26*S,y:26*S,r:Math.max(14,18*S)};}
function homeHit(mx,my){if(state==='menu')return false;const m=homeBtnPos();return Math.hypot(mx-m.x,my-m.y)<m.r+6*S;}
function drawHomeBtn(){if(state==='menu')return;const m=homeBtnPos();X.fillStyle='rgba(20,20,50,0.55)';X.beginPath();X.arc(m.x,m.y,m.r,0,6.28);X.fill();X.strokeStyle='#66bb6a';X.lineWidth=Math.max(1.5,2*S);X.stroke();X.strokeStyle='#66bb6a';X.lineWidth=Math.max(1.5,2*S);X.lineJoin='round';X.beginPath();X.moveTo(m.x-6*S,m.y+1*S);X.lineTo(m.x,m.y-5*S);X.lineTo(m.x+6*S,m.y+1*S);X.stroke();X.strokeRect(m.x-4*S,m.y+1*S,8*S,5*S);}

let PX=[];function spawn(x,y,c,n){for(let i=0;i<(n||8);i++){const a=Math.random()*6.28,sp=1+Math.random()*2.5;PX.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:.025+Math.random()*.02,c,s:2+Math.random()*2.5});}}
function tickPX(){for(let i=PX.length-1;i>=0;i--){const p=PX[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=p.d;if(p.l<=0)PX.splice(i,1);}}
function drawPX(){for(const p of PX){X.globalAlpha=Math.max(0,p.l);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,Math.max(.5,p.s*p.l),0,6.28);X.fill();}X.globalAlpha=1;}

const LEVELS=[
  {name:"First Drop",nameJa:"はじめの一歩",ball:[.5,.1],gems:[[.6,.45]],exit:[.6,.86],walls:[],maxP:3,star:[4,3,2]},
  {name:"Two Stars",nameJa:"ふたつの星",ball:[.25,.1],gems:[[.72,.38],[.28,.66]],exit:[.72,.88],walls:[[.38,.24,.62,.24]],maxP:4,star:[5,4,3]},
  {name:"The Bounce",nameJa:"跳ね返り",ball:[.28,.1],gems:[[.78,.48]],exit:[.78,.88],walls:[[.52,.16,.52,.5]],maxP:3,star:[4,3,2]},
  {name:"Zigzag",nameJa:"ジグザグ",ball:[.15,.08],gems:[[.82,.28],[.18,.52],[.82,.74]],exit:[.5,.92],walls:[[0,.18,.68,.18],[.32,.42,1,.42],[0,.66,.68,.66]],maxP:5,star:[6,5,4]},
  {name:"The Maze",nameJa:"迷路",ball:[.15,.08],gems:[[.85,.26],[.15,.5],[.85,.74]],exit:[.5,.92],walls:[[0,.18,.72,.18],[.28,.32,1,.32],[0,.46,.72,.46],[.28,.6,1,.6],[0,.74,.72,.74]],maxP:6,star:[7,6,5]},
  {name:"Double Drop",nameJa:"ふたつの落下",ball:[.5,.08],gems:[[.2,.34],[.8,.34],[.5,.66]],exit:[.5,.92],walls:[[.3,.2,.7,.2],[.15,.48,.45,.48],[.55,.48,.85,.48]],maxP:5,star:[5,4,3]},
  {name:"Pinball",nameJa:"ピンボール",ball:[.5,.07],gems:[[.2,.28],[.8,.28],[.5,.5],[.2,.72],[.8,.72]],exit:[.5,.92],walls:[[0,.18,.4,.18],[.6,.18,1,.18],[.3,.4,.7,.4],[0,.6,.4,.6],[.6,.6,1,.6]],maxP:7,star:[7,5,4]},
  {name:"Final Challenge",nameJa:"最終試練",ball:[.5,.06],gems:[[.15,.2],[.85,.2],[.5,.38],[.15,.58],[.85,.58],[.5,.78]],exit:[.5,.94],walls:[[0,.12,.36,.12],[.64,.12,1,.12],[.26,.28,.74,.28],[0,.46,.36,.46],[.64,.46,1,.46],[.26,.66,.74,.66]],maxP:8,star:[8,6,5]},
  {name:"Cascade",nameJa:"連鎖の滝",ball:[.5,.05],gems:[[.15,.18],[.85,.18],[.5,.34],[.15,.5],[.85,.5],[.5,.66],[.15,.82]],exit:[.85,.94],walls:[[0,.11,.34,.11],[.66,.11,1,.11],[.28,.27,.72,.27],[0,.43,.34,.43],[.66,.43,1,.43],[.28,.59,.72,.59],[0,.75,.34,.75]],maxP:9,star:[9,7,6]},
  {name:"Grand Finale",nameJa:"グランドフィナーレ",ball:[.5,.04],gems:[[.12,.14],[.88,.14],[.5,.28],[.12,.42],[.88,.42],[.5,.56],[.12,.7],[.88,.7],[.5,.84]],exit:[.5,.95],walls:[[0,.09,.3,.09],[.7,.09,1,.09],[.24,.23,.76,.23],[0,.37,.3,.37],[.7,.37,1,.37],[.24,.51,.76,.51],[0,.65,.3,.65],[.7,.65,1,.65],[.24,.79,.76,.79]],maxP:11,star:[11,9,7]}
];

const GRAV=.16,FRICX=.965,FRICY=.999,BOUNCE=.8,MAXV=13;
let state='menu',lvl=0;let ball,planks,gems,exitP,walls,trail,pCount;
let dragging=false,dragA=null,dragB=null;let bestStars=new Array(LEVELS.length).fill(0);let shake=0;
let countdownT=0;
let mode='normal',freeGrav=.16,sliderDrag=false,sliderTouchId=null;
const GRAV_MIN=.04,GRAV_MAX=.42;
function sliderY(){return Math.max(8,16*S)+46*S;}
function sliderX1(){return W*.2;}
function sliderX2(){return W*.8;}
function freeGravFromX(mx){const x1=sliderX1(),x2=sliderX2();const t=Math.max(0,Math.min(1,(mx-x1)/(x2-x1)));return GRAV_MIN+t*(GRAV_MAX-GRAV_MIN);}
function knobX(){const x1=sliderX1(),x2=sliderX2();const t=(freeGrav-GRAV_MIN)/(GRAV_MAX-GRAV_MIN);return x1+t*(x2-x1);}
function sliderHit(mx,my){if(mode!=='free'||!(state==='edit'||state==='play'||state==='countdown'))return false;const y=sliderY();return mx>=sliderX1()-18*S&&mx<=sliderX2()+18*S&&my>=y-18*S&&my<=y+18*S;}
function drawGravSlider(){if(mode!=='free'||!(state==='edit'||state==='play'||state==='countdown'))return;const y=sliderY(),x1=sliderX1(),x2=sliderX2(),kx=knobX();X.strokeStyle='#3a3a6a';X.lineWidth=Math.max(3,4*S);X.lineCap='round';X.beginPath();X.moveTo(x1,y);X.lineTo(x2,y);X.stroke();X.strokeStyle='#ffb74d';X.beginPath();X.moveTo(x1,y);X.lineTo(kx,y);X.stroke();X.fillStyle='#ffb74d';X.shadowColor='#ffb74d';X.shadowBlur=Math.max(4,8*S);X.beginPath();X.arc(kx,y,Math.max(7,10*S),0,6.28);X.fill();X.shadowBlur=0;X.fillStyle='#ffb74d';X.font=`bold ${Math.max(8,10*S)}px system-ui`;X.textAlign='center';X.textBaseline='bottom';X.fillText(`重力/Gravity: ${freeGrav.toFixed(2)} (ドラッグ/drag)`,W/2,y-14*S);}

function loadLvl(i){lvl=i;const L=LEVELS[i];ball={x:L.ball[0]*W,y:L.ball[1]*H,vx:0,vy:0,r:Math.min(W,H)*.024};planks=[];gems=L.gems.map(g=>({x:g[0]*W,y:g[1]*H}));exitP={x:L.exit[0]*W,y:L.exit[1]*H};walls=L.walls.map(w=>({x1:w[0]*W,y1:w[1]*H,x2:w[2]*W,y2:w[3]*H}));trail=[];pCount=0;shake=0;state='edit';PX=[];}

function cpSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(l2<1e-8)return{x:ax,y:ay};const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));return{x:ax+dx*t,y:ay+dy*t};}
function bounceSeg(b,ax,ay,bx,by){const cp=cpSeg(b.x,b.y,ax,ay,bx,by);const dx=b.x-cp.x,dy=b.y-cp.y,d=Math.sqrt(dx*dx+dy*dy);if(d<b.r&&d>1e-6){const nx=dx/d,ny=dy/d;b.x=cp.x+nx*(b.r+.5);b.y=cp.y+ny*(b.r+.5);const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=nx*vn*(1+BOUNCE);b.vy-=ny*vn*(1+BOUNCE);const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;b.vx-=tx*vt*.03;b.vy-=ty*vt*.03;return true;}}return false;}
function nearestPlankIdx(px,py,maxDist){let bd=maxDist,bi=-1;for(let i=0;i<planks.length;i++){const pl=planks[i];const cp=cpSeg(px,py,pl.x1,pl.y1,pl.x2,pl.y2);const dd=Math.sqrt((px-cp.x)**2+(py-cp.y)**2);if(dd<bd){bd=dd;bi=i;}}return bi;}

function update(){tickPX();if(state==='countdown'){countdownT-=1/60;if(countdownT<=0)state='play';return;}if(state!=='play')return;ball.vy+=(mode==='free'?freeGrav:GRAV);ball.vx*=FRICX;ball.vy*=FRICY;const sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);if(sp>MAXV){ball.vx=ball.vx/sp*MAXV;ball.vy=ball.vy/sp*MAXV;}ball.x+=ball.vx;ball.y+=ball.vy;trail.push({x:ball.x,y:ball.y});if(trail.length>35)trail.shift();for(const w of walls){if(bounceSeg(ball,w.x1,w.y1,w.x2,w.y2)){spawn(ball.x,ball.y,'#5566aa',4);sndBounce();shake=2;}}for(const p of planks){if(bounceSeg(ball,p.x1,p.y1,p.x2,p.y2)){spawn(ball.x,ball.y,'#d4a574',6);sndBounce();shake=3;}}if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*BOUNCE;}if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*BOUNCE;}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*BOUNCE;}for(let i=gems.length-1;i>=0;i--){const g=gems[i],dx=ball.x-g.x,dy=ball.y-g.y;if(Math.sqrt(dx*dx+dy*dy)<ball.r+16*S){spawn(g.x,g.y,'#ffd54f',14);sndGem();gems.splice(i,1);}}if(gems.length===0){const dx=ball.x-exitP.x,dy=ball.y-exitP.y;if(Math.sqrt(dx*dx+dy*dy)<ball.r+24*S){state='win';sndWin();const sc=calcStars();if(sc>bestStars[lvl])bestStars[lvl]=sc;}}if(ball.y>H+120||ball.x<-120||ball.x>W+120||ball.y<-250)state='lose';if(shake>0){shake*=.88;if(shake<.1)shake=0;}}

function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();}
function drawBg(){const g=X.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#0e0e38');g.addColorStop(1,'#080820');X.fillStyle=g;X.fillRect(0,0,W,H);}
function drawWalls(){X.strokeStyle='#2a2a5a';X.lineWidth=4*S;X.lineCap='round';for(const w of walls){X.beginPath();X.moveTo(w.x1,w.y1);X.lineTo(w.x2,w.y2);X.stroke();}}
function drawPlanks(){X.lineCap='round';for(const p of planks){X.strokeStyle='#a0714a';X.lineWidth=6*S;X.shadowColor='#c8956c';X.shadowBlur=6;X.beginPath();X.moveTo(p.x1,p.y1);X.lineTo(p.x2,p.y2);X.stroke();}X.shadowBlur=0;if(dragging&&dragA&&dragB){X.strokeStyle='rgba(200,149,108,0.45)';X.lineWidth=4*S;X.setLineDash([8,8]);X.beginPath();X.moveTo(dragA.x,dragA.y);X.lineTo(dragB.x,dragB.y);X.stroke();X.setLineDash([]);}}
function drawGems(){const t=Date.now()/1000;for(const g of gems){const p=1+Math.sin(t*3.2)*.18,r=Math.max(3,11*S*p);X.shadowColor='#ffd54f';X.shadowBlur=Math.max(4,14*S);X.fillStyle='#ffd54f';X.save();X.translate(g.x,g.y);X.rotate(Math.PI/4);X.fillRect(-r,-r,r*2,r*2);X.restore();X.fillStyle='#fff8e1';X.beginPath();X.arc(g.x,g.y,Math.max(1,r*.3),0,6.28);X.fill();X.shadowBlur=0;}}
function drawExit(){const t=Date.now()/1000,ready=gems.length===0;const p=1+Math.sin(t*(ready?3:1.5))*.1,r=Math.max(5,20*S*p);X.strokeStyle=ready?'#66bb6a':'#66bb6a55';X.lineWidth=Math.max(2,3*S);X.shadowColor='#66bb6a';X.shadowBlur=ready?20:3;X.beginPath();X.arc(exitP.x,exitP.y,r,0,6.28);X.stroke();X.fillStyle=ready?'#66bb6a33':'#66bb6a0a';X.fill();if(ready){X.fillStyle='#66bb6a';X.font=`bold ${Math.max(8,12*S)}px system-ui`;X.textAlign='center';X.textBaseline='middle';X.fillText('▼',exitP.x,exitP.y+1);}X.shadowBlur=0;if(state==='edit'){X.fillStyle='#66bb6a';X.font=`${Math.max(8,10*S)}px system-ui`;X.textAlign='center';X.textBaseline='top';X.fillText('ゴール/GOAL (固定/fixed)',exitP.x,exitP.y+r+4*S);}}
function drawHint(){if(state!=='edit'||pCount>0)return;const t=Date.now()/1000;const hx1=W*.22,hx2=W*.78,hy=H*.56;const prog=(t*.6)%1;const hx=hx1+(hx2-hx1)*prog;X.strokeStyle='rgba(255,213,79,0.35)';X.lineWidth=Math.max(3,5*S);X.setLineDash([6,6]);X.beginPath();X.moveTo(hx1,hy);X.lineTo(hx2,hy);X.stroke();X.setLineDash([]);X.fillStyle='#ffd54f';X.shadowColor='#ffd54f';X.shadowBlur=Math.max(6,12*S);X.beginPath();X.arc(hx,hy,Math.max(5,8*S),0,6.28);X.fill();X.shadowBlur=0;X.fillStyle='#ffd54f';X.font=`bold ${Math.max(10,13*S)}px system-ui`;X.textAlign='center';X.textBaseline='bottom';X.fillText('何もない場所をなぞって板を作成 / Trace empty space to draw ↑',W/2,hy-14*S);}
function drawBall(){if(!ball)return;for(let i=0;i<trail.length;i++){const a=i/trail.length*.35,sz=Math.max(1,ball.r*(i/trail.length)*.7);X.fillStyle=`rgba(79,195,247,${a})`;X.beginPath();X.arc(trail[i].x,trail[i].y,sz,0,6.28);X.fill();}X.shadowColor='#4fc3f7';X.shadowBlur=Math.max(6,20*S);const g=X.createRadialGradient(ball.x-ball.r*.3,ball.y-ball.r*.3,0,ball.x,ball.y,ball.r);g.addColorStop(0,'#b3e5fc');g.addColorStop(.5,'#4fc3f7');g.addColorStop(1,'#0288d1');X.fillStyle=g;X.beginPath();X.arc(ball.x,ball.y,ball.r,0,6.28);X.fill();X.fillStyle='rgba(255,255,255,0.5)';X.beginPath();X.arc(ball.x-ball.r*.25,ball.y-ball.r*.25,Math.max(1,ball.r*.28),0,6.28);X.fill();X.shadowBlur=0;if(state==='edit'){X.fillStyle='#4fc3f7';X.font=`${Math.max(8,10*S)}px system-ui`;X.textAlign='center';X.textBaseline='bottom';X.fillText('スタート/START (固定/fixed)',ball.x,ball.y-ball.r-4*S);}}
function drawBtn(x,y,w,h,t,c){X.fillStyle=c;X.shadowColor=c;X.shadowBlur=Math.max(4,10*S);rr(x,y,w,h,Math.max(4,10*S));X.fill();X.shadowBlur=0;X.fillStyle='#080820';X.font=`bold ${Math.max(10,Math.min(16*S,h*.42))}px system-ui`;X.textAlign='center';X.textBaseline='middle';X.fillText(t,x+w/2,y+h/2);}
function calcStars(){const L=LEVELS[lvl];if(pCount<=L.star[2])return 3;if(pCount<=L.star[1])return 2;return 1;}

function drawUI(){const p=Math.max(8,16*S);if(state==='menu'){const t=Date.now()/1000;const bx=W/2+Math.sin(t*1.5)*W*.1;const by=H*.12+Math.abs(Math.sin(t*2))*H*.03;X.shadowColor='#4fc3f7';X.shadowBlur=18;const bg=X.createRadialGradient(bx-4,by-4,0,bx,by,Math.max(6,10*S));bg.addColorStop(0,'#e1f5fe');bg.addColorStop(.4,'#4fc3f7');bg.addColorStop(1,'#0277bd');X.fillStyle=bg;X.beginPath();X.arc(bx,by,Math.max(6,10*S),0,6.28);X.fill();X.shadowBlur=0;X.fillStyle='#fff';X.font=`bold ${Math.max(20,34*S)}px system-ui`;X.textAlign='center';X.textBaseline='middle';X.fillText('Gravity Bounce',W/2,H*.25);X.fillStyle='#7777aa';X.font=`${Math.max(10,13*S)}px system-ui`;X.fillText('画面をドラッグして板を置こう',W/2,H*.29);X.font=`${Math.max(8,10*S)}px system-ui`;X.fillStyle='#5c5c88';X.fillText('Drag on the screen to place planks',W/2,H*.325);X.fillStyle='#7777aa';X.font=`${Math.max(10,13*S)}px system-ui`;X.fillText('宝石を集めてゴールへ!',W/2,H*.365);X.font=`${Math.max(8,10*S)}px system-ui`;X.fillStyle='#5c5c88';X.fillText('Collect the gems and reach the goal!',W/2,H*.4);const bw=Math.max(150,190*S),bh=Math.max(34,42*S),by1=H*.46,by2=by1+bh+10*S;drawBtn(W/2-bw/2,by1,bw,bh,'▶ ノーマル / NORMAL','#4fc3f7');drawBtn(W/2-bw/2,by2,bw,bh,'🌗 重力フリー / FREE GRAVITY','#ba68c8');X.fillStyle='#444466';X.font=`${Math.max(9,11*S)}px system-ui`;X.fillText('全10レベル ・ 物理パズル / 10 Levels • Physics Puzzle',W/2,by2+bh+16*S);return;}if(state==='edit'||state==='play'||state==='countdown'){X.fillStyle='#fff';X.font=`bold ${Math.max(11,16*S)}px system-ui`;X.textAlign='center';X.textBaseline='top';X.fillText(`${lvl+1}. ${LEVELS[lvl].name} / ${LEVELS[lvl].nameJa}`,W/2,p);X.fillStyle='#9999bb';X.font=`${Math.max(9,11*S)}px system-ui`;X.textAlign='right';X.fillText(`板/Planks ${pCount} (★3:${LEVELS[lvl].star[2]}以内/≤${LEVELS[lvl].star[2]})`,W-p,p+16*S);X.textAlign='left';X.fillText(`宝石/Gems ${gems.length}`,p+46*S,p+16*S);if(state==='edit'){const bw=Math.max(120,150*S),bh=Math.max(36,44*S);drawBtn(W/2-bw/2,H-70*S,bw,bh,'▶ スタート/PLAY','#4fc3f7');const cw=Math.max(90,110*S);drawBtn(W/2+bw/2+8*S,H-70*S,cw,bh,'消去/CLEAR','#e05545');X.fillStyle='#ffd54f';X.font=`bold ${Math.max(8,10*S)}px system-ui`;X.textAlign='center';X.fillText('① 何もない場所をなぞって板を作成 / Trace empty space to draw a plank',W/2,H-46*S);X.fillStyle='#555577';X.font=`${Math.max(7,9*S)}px system-ui`;X.fillText('② 落下中も追加OK・長押しで削除 / Add anytime, even mid-fall • Long-press to delete',W/2,H-30*S);X.fillText('③ 全10レベル / 10 levels total',W/2,H-16*S);}else if(state==='play'){const rw=Math.max(100,130*S),rh=Math.max(36,44*S);drawBtn(W/2-rw/2,H-65*S,rw,rh,'↺ リセット/RESET','#e05545');X.fillStyle='#555577';X.font=`${Math.max(8,10*S)}px system-ui`;X.textAlign='center';X.fillText('ボールを跳ね返して宝石とゴールへ / Bounce the ball to the gems and goal',W/2,H-18*S);}if(state==='countdown'){X.fillStyle='rgba(8,8,32,.35)';X.fillRect(0,0,W,H);const n=Math.ceil(countdownT);X.fillStyle='#4fc3f7';X.font=`bold ${Math.max(40,70*S)}px system-ui`;X.textAlign='center';X.textBaseline='middle';X.fillText(n>0?String(n):'GO!',W/2,H/2);}}if(state==='win'){X.fillStyle='rgba(8,8,32,.72)';X.fillRect(0,0,W,H);const sc=calcStars();X.font=`bold ${Math.max(24,40*S)}px system-ui`;X.textAlign='center';X.textBaseline='middle';for(let i=0;i<3;i++){X.fillStyle=i<sc?'#ffd54f':'#222244';X.fillText('★',W/2+(i-1)*50*S,H*.28);}X.fillStyle='#fff';X.font=`bold ${Math.max(16,24*S)}px system-ui`;X.fillText('クリア! / Level Clear!',W/2,H*.42);X.fillStyle='#9999bb';X.font=`${Math.max(10,13*S)}px system-ui`;X.fillText('使用した板/Planks used: '+pCount,W/2,H*.49);const bw1=Math.max(120,150*S),bh1=Math.max(34,42*S),bw2=Math.max(100,130*S),bh2=Math.max(28,36*S);if(lvl<LEVELS.length-1)drawBtn(W/2-bw1/2,H*.58,bw1,bh1,'次へ▶/NEXT','#66bb6a');drawBtn(W/2-bw2/2,H*.68,bw2,bh2,'もう一度/REPLAY','#4fc3f7');drawBtn(W/2-bw2/2+10*S,H*.77,bw2-20*S,bh2-4*S,'メニュー/MENU','#7777aa');}if(state==='lose'){X.fillStyle='rgba(8,8,32,.72)';X.fillRect(0,0,W,H);X.fillStyle='#ff7043';X.font=`bold ${Math.max(16,24*S)}px system-ui`;X.textAlign='center';X.textBaseline='middle';X.fillText('あっ! / Oops!',W/2,H*.36);X.fillStyle='#9999bb';X.font=`${Math.max(10,13*S)}px system-ui`;X.fillText('ボールが画面外へ / The ball fell off the screen',W/2,H*.44);const bw=Math.max(120,150*S),bh=Math.max(36,44*S);drawBtn(W/2-bw/2,H*.55,bw,bh,'↺ もう一度/RETRY','#e05545');}}

function render(){X.save();if(shake>0)X.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);drawBg();if(state!=='menu'){drawWalls();drawExit();drawGems();drawPlanks();drawBall();drawHint();drawPX();}drawUI();drawGravSlider();drawMuteBtn();drawTrackBtn();drawHomeBtn();X.restore();}

function inR(px,py,rx,ry,rw,rh){return px>=rx&&px<=rx+rw&&py>=ry&&py<=ry+rh;}
function handleClick(mx,my){audio();if(state==='menu'){const bw=Math.max(150,190*S),bh=Math.max(34,42*S),by1=H*.46,by2=by1+bh+10*S;if(inR(mx,my,W/2-bw/2,by1,bw,bh)){mode='normal';loadLvl(0);return;}if(inR(mx,my,W/2-bw/2,by2,bw,bh)){mode='free';freeGrav=.16;loadLvl(0);return;}return;}if(state==='edit'){const bw=Math.max(120,150*S),bh=Math.max(36,44*S),cw=Math.max(90,110*S);if(inR(mx,my,W/2-bw/2,H-70*S,bw,bh)){state='countdown';countdownT=1.8;return;}if(inR(mx,my,W/2+bw/2+8*S,H-70*S,cw,bh)){planks=[];pCount=0;return;}}if(state==='play'){const rw=Math.max(100,130*S),rh=Math.max(36,44*S);if(inR(mx,my,W/2-rw/2,H-65*S,rw,rh)){loadLvl(lvl);return;}}if(state==='win'){const bw1=Math.max(120,150*S),bh1=Math.max(34,42*S),bw2=Math.max(100,130*S),bh2=Math.max(28,36*S);if(lvl<LEVELS.length-1&&inR(mx,my,W/2-bw1/2,H*.58,bw1,bh1)){loadLvl(lvl+1);return;}if(inR(mx,my,W/2-bw2/2,H*.68,bw2,bh2)){loadLvl(lvl);return;}if(inR(mx,my,W/2-bw2/2+10*S,H*.77,bw2-20*S,bh2-4*S)){state='menu';return;}}if(state==='lose'){const bw=Math.max(120,150*S),bh=Math.max(36,44*S);if(inR(mx,my,W/2-bw/2,H*.55,bw,bh))loadLvl(lvl);}}
function inBtn(mx,my){if(state==='edit'){const bw=Math.max(120,150*S),bh=Math.max(36,44*S),cw=Math.max(90,110*S);return inR(mx,my,W/2-bw/2,H-70*S,bw,bh)||inR(mx,my,W/2+bw/2+8*S,H-70*S,cw,bh);}if(state==='play'){const rw=Math.max(100,130*S),rh=Math.max(36,44*S);return inR(mx,my,W/2-rw/2,H-65*S,rw,rh);}return false;}

C.addEventListener('mousedown',e=>{const r=C.getBoundingClientRect();const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);audio();if(homeHit(mx,my)){state='menu';return;}if(muteHit(mx,my)){bgmOn=!bgmOn;return;}if(trackHit(mx,my)){bgmTrack=(bgmTrack+1)%BGM_TRACKS.length;bgmBeatIdx=0;bgmStarted=false;return;}if(sliderHit(mx,my)){e.preventDefault();if(e.button===0){sliderDrag=true;freeGrav=freeGravFromX(mx);}return;}if(e.button===2&&(state==='edit'||state==='play')){e.preventDefault();const bi=nearestPlankIdx(mx,my,20*S);if(bi>=0){planks.splice(bi,1);pCount--;}return;}if(e.button!==0)return;handleClick(mx,my);if((state==='edit'||state==='play')&&!inBtn(mx,my)){dragging=true;dragA={x:mx,y:my};dragB={x:mx,y:my};}});
C.addEventListener('contextmenu',e=>e.preventDefault());
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);if(sliderDrag){freeGrav=freeGravFromX(mx);return;}if(!dragging)return;dragB={x:mx,y:my};});
C.addEventListener('mouseup',()=>{if(sliderDrag){sliderDrag=false;return;}if(!dragging)return;dragging=false;if(dragA&&dragB){const d=Math.sqrt((dragB.x-dragA.x)**2+(dragB.y-dragA.y)**2);if(d>18*S){planks.push({x1:dragA.x,y1:dragA.y,x2:dragB.x,y2:dragB.y});pCount++;}}dragA=dragB=null;});

let activeTouch=null;let longPressTimer=null,longPressFired=false,longPressStart=null;
function startPlankDrag(id,mx,my){activeTouch=id;dragging=true;dragA={x:mx,y:my};dragB={x:mx,y:my};longPressFired=false;longPressStart={x:mx,y:my};clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{if(activeTouch!==id||!dragA)return;const dx=dragB.x-longPressStart.x,dy=dragB.y-longPressStart.y;if(Math.sqrt(dx*dx+dy*dy)<12*S){const bi=nearestPlankIdx(longPressStart.x,longPressStart.y,20*S);if(bi>=0){const pl=planks[bi];spawn((pl.x1+pl.x2)/2,(pl.y1+pl.y2)/2,'#e05545',8);planks.splice(bi,1);pCount--;}longPressFired=true;dragging=false;dragA=dragB=null;}},480);}
C.addEventListener('touchstart',e=>{e.preventDefault();audio();const r=C.getBoundingClientRect();for(const t of e.changedTouches){const mx=(t.clientX-r.left)*(W/r.width),my=(t.clientY-r.top)*(H/r.height);if(homeHit(mx,my)){state='menu';continue;}if(muteHit(mx,my)){bgmOn=!bgmOn;continue;}if(trackHit(mx,my)){bgmTrack=(bgmTrack+1)%BGM_TRACKS.length;bgmBeatIdx=0;bgmStarted=false;continue;}if(sliderHit(mx,my)){sliderTouchId=t.identifier;freeGrav=freeGravFromX(mx);continue;}if(state==='menu'){const bw=Math.max(150,190*S),bh=Math.max(34,42*S),by1=H*.46,by2=by1+bh+10*S;if(inR(mx,my,W/2-bw/2,by1,bw,bh)){mode='normal';loadLvl(0);continue;}if(inR(mx,my,W/2-bw/2,by2,bw,bh)){mode='free';freeGrav=.16;loadLvl(0);continue;}continue;}if(state==='edit'){const bw=Math.max(120,150*S),bh=Math.max(36,44*S),cw=Math.max(90,110*S);if(inR(mx,my,W/2-bw/2,H-70*S,bw,bh)){state='countdown';countdownT=1.8;continue;}if(inR(mx,my,W/2+bw/2+8*S,H-70*S,cw,bh)){planks=[];pCount=0;continue;}if(!inBtn(mx,my))startPlankDrag(t.identifier,mx,my);continue;}if(state==='play'){const rw=Math.max(100,130*S),rh=Math.max(36,44*S);if(inR(mx,my,W/2-rw/2,H-65*S,rw,rh)){loadLvl(lvl);continue;}if(!inBtn(mx,my))startPlankDrag(t.identifier,mx,my);continue;}if(state==='win'){const bw1=Math.max(120,150*S),bh1=Math.max(34,42*S),bw2=Math.max(100,130*S),bh2=Math.max(28,36*S);if(lvl<LEVELS.length-1&&inR(mx,my,W/2-bw1/2,H*.58,bw1,bh1)){loadLvl(lvl+1);continue;}if(inR(mx,my,W/2-bw2/2,H*.68,bw2,bh2)){loadLvl(lvl);continue;}if(inR(mx,my,W/2-bw2/2+10*S,H*.77,bw2-20*S,bh2-4*S)){state='menu';continue;}}if(state==='lose'){const bw=Math.max(120,150*S),bh=Math.max(36,44*S);if(inR(mx,my,W/2-bw/2,H*.55,bw,bh))loadLvl(lvl);}}},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const r=C.getBoundingClientRect();for(const t of e.changedTouches){if(t.identifier===sliderTouchId){freeGrav=freeGravFromX((t.clientX-r.left)*(W/r.width));continue;}if(dragging&&t.identifier===activeTouch){const mx=(t.clientX-r.left)*(W/r.width),my=(t.clientY-r.top)*(H/r.height);dragB={x:mx,y:my};if(longPressStart){const dx=dragB.x-longPressStart.x,dy=dragB.y-longPressStart.y;if(Math.sqrt(dx*dx+dy*dy)>=12*S)clearTimeout(longPressTimer);}}}},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===sliderTouchId){sliderTouchId=null;continue;}if(t.identifier===activeTouch){activeTouch=null;clearTimeout(longPressTimer);if(!longPressFired&&dragA&&dragB){const d=Math.sqrt((dragB.x-dragA.x)**2+(dragB.y-dragA.y)**2);if(d>18*S){planks.push({x1:dragA.x,y1:dragA.y,x2:dragB.x,y2:dragB.y});pCount++;}}dragA=dragB=null;dragging=false;longPressFired=false;}}},{passive:false});

window.addEventListener('keydown',e=>{audio();if(e.code==='Space'&&state==='edit'){state='countdown';countdownT=1.8;e.preventDefault();}if(e.code==='KeyR'&&(state==='play'||state==='lose'||state==='countdown'))loadLvl(lvl);if(e.code==='Escape'&&state!=='menu')state='menu';});

function loop(){try{update();updateBgm();render();}catch(e){console.error(e);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
