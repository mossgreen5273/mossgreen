<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>駅、あるいは家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #191c28;
    --bg-deep: #14161f;
    --panel: #232735;
    --gold: #c19a53;
    --gold-dim: #8a7148;
    --frost: #d6dfe8;
    --frost-dim: #93a1b0;
    --danger: #7a3838;
    --danger-bright: #c25f52;
    --ghost: #6d5a90;
    --home: #4f8168;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #1e2230 0%, transparent 60%),
      var(--bg-deep);
    color:var(--frost);
    font-family:'Shippori Mincho', serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:480px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding:20px 18px 40px;
  }
  header{
    text-align:center; margin-bottom:18px;
  }
  .title-en{
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-weight:400;
    letter-spacing:0.18em;
    font-size:11px;
    color:var(--gold-dim);
    text-transform:uppercase;
  }
  .title-jp{
    font-size:20px; letter-spacing:0.12em;
    color:var(--frost);
    margin-top:4px;
    font-weight:500;
  }
  .divider{
    width:40px; height:1px; background:var(--gold-dim);
    margin:14px auto;
  }
  .bgm-toggle{
    margin-top:10px;
    background:none; border:1px solid #333850; border-radius:20px;
    color:var(--frost-dim); font-family:'Cormorant Garamond', serif;
    font-size:11px; letter-spacing:0.12em; padding:5px 14px;
    cursor:pointer;
  }
  .bgm-toggle:active{ opacity:0.6; }

  /* --- gauges --- */
  .gauges{
    display:flex; justify-content:center; gap:34px;
    margin-bottom:20px;
  }
  .gauge{ text-align:center; }
  .dial{
    width:76px; height:76px; border-radius:50%;
    position:relative;
    background: conic-gradient(var(--gauge-color) calc(var(--pct) * 1%), #23273580 0);
    display:flex; align-items:center; justify-content:center;
    transition: background 0.6s ease;
  }
  .dial::before{
    content:''; position:absolute; inset:7px;
    border-radius:50%;
    background: var(--panel);
    border:1px solid #2a2e3d;
  }
  .dial-val{
    position:relative; z-index:1;
    font-family:'Cormorant Garamond', serif;
    font-size:19px; color:var(--frost);
  }
  .gauge-label{
    margin-top:8px; font-size:11px; letter-spacing:0.15em;
    color:var(--frost-dim);
  }

  /* --- scene panel --- */
  /* --- route map --- */
  .routemap{
    background:var(--panel);
    border:1px solid #262b3a;
    border-radius:2px;
    padding:10px 6px 6px;
    margin-bottom:14px;
  }
  .routemap svg{ width:100%; height:auto; display:block; }
  .rm-edge{ stroke:#2c3040; stroke-width:1.4; }
  .rm-edge.traveled{ stroke:var(--gold-dim); stroke-width:1.8; }
  .rm-node{ stroke:#33384a; stroke-width:1.2; fill:#20232f; }
  .rm-node.visited{ fill:#2a2e3e; stroke:var(--frost-dim); }
  .rm-node.current{ stroke:var(--gold); stroke-width:2.4; }
  .rm-node.danger{ fill:#2a1414; }
  .rm-label{
    font-family:'Cormorant Garamond', serif; font-size:6.5px;
    fill:var(--frost-dim); text-anchor:middle;
  }
  .rm-label.current{ fill:var(--frost); }
  @keyframes rmpulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .rm-pulse{ animation: rmpulse 1.6s ease-in-out infinite; }

  /* --- scene panel --- */
  .scene{
    background:var(--panel);
    border:1px solid #262b3a;
    border-radius:2px;
    padding:22px 20px;
    flex:1;
    display:flex; flex-direction:column;
    animation: fadein 0.5s ease;
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .scene::before{
    content:''; position:absolute; inset:0; z-index:0;
    transition: background 0.8s ease;
  }
  .scene::after{
    content: attr(data-icon);
    position:absolute; right:-8px; bottom:-18px;
    font-size:108px; line-height:1; opacity:0.07;
    z-index:0; filter:grayscale(1);
    pointer-events:none;
  }
  .scene > *{ position:relative; z-index:1; }

  .scene[data-theme="night"]::before{ background:linear-gradient(160deg,#171b2a,#1a1d29 65%); }
  .scene[data-theme="station"]::before{ background:linear-gradient(160deg,#1c2029,#1a1d29 65%); }
  .scene[data-theme="candle"]::before{ background:linear-gradient(160deg,#2a2118,#1a1d29 65%); }
  .scene[data-theme="snow"]::before{ background:linear-gradient(160deg,#1c2530,#1a1d29 65%); }
  .scene[data-theme="ghost"]::before{ background:linear-gradient(160deg,#241c30,#1a1d29 65%); }
  .scene[data-theme="port"]::before{ background:linear-gradient(160deg,#152631,#1a1d29 65%); }
  .scene[data-theme="sea"]::before{ background:linear-gradient(160deg,#0f2230,#141a22 65%); }
  .scene[data-theme="home"]::before{ background:linear-gradient(160deg,#1a2620,#1a1d29 65%); }
  .scene[data-theme="gold"]::before{ background:linear-gradient(160deg,#2a2312,#1a1d29 65%); }
  .scene[data-theme="danger"]::before{ background:linear-gradient(160deg,#3a2222,#242029 65%); }
  .scene[data-theme="foreign"]::before{ background:linear-gradient(160deg,#16202e,#1a1d29 65%); }
  .scene[data-theme="warm"]::before{ background:linear-gradient(160deg,#2c2416,#1a1d29 65%); }

  .scene-name{
    font-size:13px; letter-spacing:0.2em; color:var(--gold);
    margin-bottom:14px; text-align:center;
  }
  .scene-text{
    font-size:15.5px; line-height:2.05;
    color:var(--frost);
    white-space:pre-line;
    flex:1;
  }
  .scene-text .voice{
    display:block; margin-top:14px; color:var(--frost-dim);
    font-style:italic;
  }
  .lang-ru{
    display:block; font-family:'Cormorant Garamond', serif;
    font-weight:600; color:var(--gold);
    font-size:1.18em; line-height:1.55; letter-spacing:0.015em;
    text-shadow:0 0 14px rgba(163,131,63,0.25);
  }
  .lang-en{
    display:block; font-family:'Cormorant Garamond', serif;
    font-style:italic; color:var(--frost-dim);
    font-size:0.92em; line-height:1.6; margin-top:4px;
  }
  .lang-jp{
    display:block; color:#5c6274;
    font-size:0.76em; line-height:1.9; margin-top:10px;
    padding-top:10px; border-top:1px dashed #2c3040;
  }
  .scene-text .lang-ru.block{ margin-top:16px; }
  .scene-text .lang-en.block{ margin-top:2px; }
  .scene-name{ text-align:center; }
  .scene-name .name-ru{
    font-size:1.5em; letter-spacing:0.05em;
    padding:2px 0 8px;
    border-bottom:1px solid var(--gold-dim);
    margin-bottom:6px;
  }
  .scene-name .name-en{ font-size:0.7em; margin-top:2px; }
  .scene-name .name-jp{
    display:block; font-size:11px; color:var(--frost-dim);
    border-top:none; padding-top:0; margin-top:4px;
  }
  button.choice .lang-ru{ font-size:1.02em; }
  button.choice .lang-en{ font-size:0.85em; }
  button.choice .lang-jp{ font-size:0.72em; border-top:none; padding-top:2px; margin-top:4px; }

  .choices{
    margin-top:22px;
    display:flex; flex-direction:column; gap:10px;
  }
  button.choice{
    font-family:'Shippori Mincho', serif;
    background:transparent;
    color:var(--frost);
    border:1px solid #333850;
    border-radius:2px;
    padding:13px 16px;
    font-size:14.5px;
    text-align:left;
    letter-spacing:0.03em;
    cursor:pointer;
    transition: border-color 0.2s, background 0.2s;
    position:relative;
  }
  button.choice:active{ transform: scale(0.99); }
  button.choice.near{ border-left:3px solid var(--danger-bright); }
  button.choice.detour{ border-left:3px solid var(--gold); }
  button.choice.home{ border-left:3px solid var(--home); opacity:0.88; }
  button.choice.ghostc{ border-left:3px solid var(--ghost); }
  button.choice.rest{ border-left:3px solid #4a4f66; font-size:13px; color:var(--frost-dim); }
  button.choice.talk{ border-left:3px solid #c98a5a; }
  button.choice:disabled{
    opacity:0.35; pointer-events:none;
  }
  .cost{
    display:block; font-size:10.5px; color:var(--frost-dim); margin-top:3px;
    font-family:'Cormorant Garamond', serif; letter-spacing:0.05em;
  }

  .ending-badge{
    text-align:center; margin-top:8px;
    font-family:'Cormorant Garamond', serif;
    letter-spacing:0.2em; font-size:12px;
  }
  .ending-badge.bad{ color:var(--danger-bright); }
  .ending-badge.rare{ color:#6d9fc7; }
  .ending-badge.true{ color:#c79fe8; }

  .achievement{
    margin-top:18px; padding:12px 14px;
    border:1px dashed var(--ghost);
    border-radius:2px;
    font-size:12.5px; color:#b8a8d8;
    text-align:center;
    line-height:1.7;
  }

  .restart{
    margin-top:16px;
    background:none; border:none;
    color:var(--frost-dim); text-decoration:underline;
    font-family:'Cormorant Garamond', serif;
    font-size:13px; letter-spacing:0.1em;
    cursor:pointer; align-self:center;
  }

  footer{
    text-align:center; margin-top:18px;
    font-size:10px; color:#454a5c;
    font-family:'Cormorant Garamond', serif;
    letter-spacing:0.1em;
  }

  /* --- splash cover --- */
  #splash{
    position:fixed; inset:0; z-index:1000;
    background:#05060a;
    display:flex; align-items:center; justify-content:center;
    animation: splashFadeOut 1.1s ease forwards;
    animation-delay: 2.6s;
  }
  #splash img{
    width:100%; height:100%; object-fit:cover;
    animation: splashBang 1.1s cubic-bezier(0.2,0.8,0.2,1) forwards;
  }
  #splash::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 50%, transparent 40%, #05060a 92%);
  }
  #splash .splash-title{
    position:absolute; bottom:14%; left:0; right:0; text-align:center; z-index:2;
    font-family:'Cormorant Garamond', serif; color:#e9dfc8;
    opacity:0; animation: splashTitleIn 1s ease forwards; animation-delay:0.9s;
    text-shadow:0 2px 18px rgba(0,0,0,0.8);
  }
  #splash .splash-title .jp{ font-family:'Shippori Mincho', serif; font-size:22px; letter-spacing:0.15em; display:block; }
  #splash .splash-title .sub{ font-size:11px; letter-spacing:0.2em; opacity:0.7; display:block; margin-top:6px; font-style:italic; }
  @keyframes splashBang{
    0%{ transform:scale(1.22); opacity:0; filter:brightness(2.2) saturate(1.4); }
    35%{ opacity:1; }
    100%{ transform:scale(1.04); opacity:1; filter:brightness(1) saturate(1); }
  }
  @keyframes splashTitleIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes splashFadeOut{
    from{ opacity:1; visibility:visible; }
    to{ opacity:0; visibility:hidden; }
  }
  #splash.skip{ animation: splashFadeOut 0.6s ease forwards !important; animation-delay:0s !important; }

  /* --- illustration inside a scene --- */
  .scene-art{
    width:100%; border-radius:2px; margin-bottom:16px;
    border:1px solid #2a2e3d; display:block;
    opacity:0.92;
  }
</style>
</head>
<body>
<div id="splash" onclick="this.classList.add('skip')">
  <img id="splash-img" src="" alt="">
  <div class="splash-title">
    <span class="jp">駅、あるいは家</span>
    <span class="sub">Station, or Home</span>
  </div>
</div>
<div class="app" id="app"></div>

           en:'A wooden station house, the sound of sandals, signs in unfamiliar characters. No one knows who he is. For the first time, the old man stands on a platform as a mere traveler. A distant bell tolled, strangely, like something remembered.'},
    voice:{ru:'Этой тишине имя ни к чему.', en:'This stillness needs no name.'},
    badge:{ru:'СКРЫТАЯ КОНЦОВКА — Чужбина (Япония)', en:'HIDDEN END — A Foreign Land (Japan)'}
  },
  reconcile: {
    name:{ru:'Дом', en:'Home'},
    text:{ru:'Она ничего не сказала — просто открыла дверь. После долгого молчания она произнесла: «…С возвращением». Этого было достаточно. Их тени, наконец, легли в одну сторону.',
           en:'She said nothing — only opened the door. After a long silence, she spoke: "...Welcome home." That alone was enough. At last, their two shadows fell the same way.'},
    voice:{ru:'Вот место, которое я искал.', en:'This was the place I had been searching for.'},
    badge:{ru:'Финал — Дом', en:'Ending — Home'}
  },
  reject: {
    name:{ru:'Ворота дома', en:'The Gate of Home'},
    text:{ru:'Слова не находились. В конце концов, он повернул назад. Лишь свет ворот ещё долго освещал его удаляющуюся спину.',
           en:"The words would not come. In the end, he turned back. Only the gate's light went on lighting his retreating back."},
    voice:{ru:'Слова так и не нашлись до самого конца.', en:'The words never came, not even at the very end.'},
    badge:{ru:'КОНЦОВКА — Неизречённое', en:'END — Unspoken'}
  }
};
const UI_I18N = {
  title: {ru:'Станция, или дом'},
  hp: {ru:'Здоровье', en:'Health'},
  wp: {ru:'Воля', en:'Will'},
  restart: {ru:'Отправиться в путь снова', en:'Set out once more'},
  bgmOn: {ru:'Включить музыку', en:'Play music'},
  bgmOff: {ru:'Выключить музыку', en:'Stop music'},
  wpExhausted: {ru:'Воля иссякла, выбор больше не в его власти — ноги сами несут на юг',
                en:"His will is spent; the choice is no longer his — his feet carry him south"},
  achievement: {ru:'Скрытое достижение: тот, кто видел пустую станцию — Вам поклонилась тень на станции, которой нет ни на одной карте. Только эта память остаётся неизменной, каким бы ни был финал.',
                en:'Hidden achievement: one who saw the hollow station — A shadow bowed to you at a station on no map. That memory alone remains, unchanged by whatever ending follows.'}
};
function costFor(type){
  switch(type){
    case 'near':   return {hp:-13, wp:-3};
    case 'detour': return {hp:-7,  wp:-8};
    case 'home':   return {hp:-14, wp:8};
    case 'ghostc': return {hp:-7,  wp:-2};
    case 'rest':   return {hp:15,  wp:-10};
    case 'talk':   return {hp:-3,  wp:12};
  }
  return {hp:0, wp:0};
}
function clamp(v){ return Math.max(0, Math.min(100, v)); }

/* ---------------- 遷移処理 ---------------- */
function choose(choice){
  const delta = costFor(choice.type);
  state.hp = clamp(state.hp + delta.hp - 2); // -2: 基礎消耗
  state.wp = clamp(state.wp + delta.wp - 1);
  state.turn++;

  if (choice.type === 'rest' || choice.type === 'talk'){
    sfx.page();
    render();
    return;
  }
  if (choice.type === 'near'){ sfx.whistle(); }
  else { sfx.step(); }

  let target = choice.target;

  // 自宅の門: 和解判定
  if (target === 'reconcile_check'){
    target = (state.wp >= 50) ? 'reconcile' : 'reject';
  }

  // 体力切れ:目的地が既に終了ノードでなければ客死へ差し替え
  const isEnding = NODES[target] && NODES[target].end;
  if (state.hp <= 0 && !isEnding){
    target = 'lonely';
  }

  state.node = target;
  if (!state.visited.includes(target)) state.visited.push(target);
  const n = NODES[target];
  if (n && n.onEnter) n.onEnter(state);
  if (n && n.end){ setTimeout(()=>sfx.chime(), 300); }

  // sea の自動遷移
  if (n && n.auto){
    setTimeout(()=>{
      const dest = n.auto(state);
      state.node = dest;
      if (!state.visited.includes(dest)) state.visited.push(dest);
      if (NODES[dest] && NODES[dest].end){ setTimeout(()=>sfx.chime(), 300); }
      render();
    }, 1400);
  }

  render();
}

function restart(){
  state = { hp:80, wp:60, node:'start', ghostSeen:false, turn:0, visited:['start'] };
  render();
}

/* ---------------- 描画 ---------------- */
/* ---------------- 文体崩壊(気力低下時に地の文が崩れる) ---------------- */
function degrade(text, wp){
  if (!text || wp >= 60) return text;
  const heavy = wp < 30;
  const pRate = heavy ? 0.7 : 0.35;
  let t = text.replace(/[。.]/g, (m) => {
    if (Math.random() >= pRate) return m;
    if (heavy) return '……';
    return m === '。' ? '、' : ',';
  });
  if (heavy){
    t = t.split('\n').map(line => (line && Math.random() < 0.4) ? line + '……' : line).join('\n');
  }
  return t;
}
// 体力低下時、地の文の末尾に付く身体的な苦しさの一文
function physicalOverlay(hp, lang){
  const table = {
    jp: {40:'\n\n(息が、うまく続かない)', 10:'\n\n(もう、そう長くは保たない)'},
    ru: {40:'\n\n(Дыхание больше не слушается)', 10:'\n\n(Дальше так продолжаться не может)'},
    en: {40:'\n\n(Breath won\u2019t come steadily)', 10:'\n\n(It cannot go on much longer)'}
  };
  const t = table[lang] || table.jp;
  if (hp <= 10) return t[10];
  if (hp <= 40) return t[40];
  return '';
}

function gaugeColor(v){
  if (v > 55) return '#7a9e7c';
  if (v > 25) return '#a3833f';
  return '#b5453f';
}

function buildMap(){
  // 訪問済みノードのみ地図上に描画(未踏の分岐は霧の中=非表示)
  const knownEdges = EDGES.filter(([a,b]) => state.visited.includes(a) && (state.visited.includes(b) || b===state.node));
  const shownNodeIds = new Set(state.visited);
  if (NODES[state.node]) shownNodeIds.add(state.node);

  let edgesSVG = '';
  EDGES.forEach(([a,b])=>{
    const na = NODES[a], nb = NODES[b];
    if (!na || !nb) return;
    if (!shownNodeIds.has(a) || !shownNodeIds.has(b)) return;
    const traveled = state.visited.includes(a) && state.visited.includes(b);
    edgesSVG += `<line class="rm-edge ${traveled?'traveled':''}" x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}"/>`;
  });

  let nodesSVG = '';
  shownNodeIds.forEach(id=>{
    const nd = NODES[id];
    if (!nd) return;
    const isCurrent = id === state.node;
    const isVisited = state.visited.includes(id);
    const isDanger = nd.theme === 'danger';
    const cls = ['rm-node'];
    if (isVisited) cls.push('visited');
    if (isDanger) cls.push('danger');
    if (isCurrent) cls.push('current');
    const r = isCurrent ? 5.5 : 3.4;
    nodesSVG += `<circle class="${cls.join(' ')} ${isCurrent?'rm-pulse':''}" cx="${nd.x}" cy="${nd.y}" r="${r}"/>`;
    nodesSVG += `<text class="rm-label ${isCurrent?'current':''}" x="${nd.x}" y="${nd.y - (isCurrent?9:6)}">${nd.icon}</text>`;
  });

  return `<div class="routemap"><svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid meet">
    ${edgesSVG}${nodesSVG}
  </svg></div>`;
}

function render(){
  const n = NODES[state.node];
  const t = I18N[state.node] || {};
  const app = document.getElementById('app');

  const hpColor = gaugeColor(state.hp);
  const wpColor = gaugeColor(state.wp);

  let choicesHTML = '';
  if (!n.end && !n.auto){
    choicesHTML = '<div class="choices">' + n.choices.map((c,i)=>{
      const visible = !c.cond || c.cond(state);
      if (!visible) return '';
      const d = costFor(c.type);
      const dHp = d.hp>0?`+${d.hp}`:d.hp;
      const dWp = d.wp>0?`+${d.wp}`:d.wp;
      const disabled = (state.wp<=0 && c.type!=='near') ? 'disabled' : '';
      const tc = (t.choices && t.choices[i]) || {};
      return `<button class="choice ${c.type}" ${disabled} onclick='window.__choose(${JSON.stringify(c).replace(/'/g,"&apos;")})'>
        ${tc.ru ? `<span class="lang-ru">${tc.ru}</span>` : ''}
        ${tc.en ? `<span class="lang-en">${tc.en}</span>` : ''}
        <span class="lang-jp">${c.label}</span>
        <span class="cost">体力${dHp} ／ 気力${dWp}</span>
      </button>`;
    }).join('') + '</div>';
    if (state.wp<=0){
      choicesHTML += `<div class="cost" style="text-align:center;margin-top:10px;">
        <span class="lang-ru" style="font-size:1em;">${UI_I18N.wpExhausted.ru}</span><br>
        <span class="lang-en">${UI_I18N.wpExhausted.en}</span><br>
        気力が尽き、もう選べない ── 足は南へ向かう
      </div>`;
    }
  }

  let endBlock = '';
  if (n.end){
    const tb = t.badge || {};
    endBlock = `<div class="ending-badge ${n.badgeClass}">
      <span class="lang-ru" style="font-size:1.2em;">${tb.ru||''}</span>
      <span class="lang-en">${tb.en||''}</span>
      <span class="lang-jp" style="border-top:none;padding-top:2px;">${n.badge}</span>
    </div>`;
    if (state.ghostSeen){
      endBlock += `<div class="achievement">
      <span class="lang-ru" style="font-size:1.05em;">${UI_I18N.achievement.ru}</span>
      <br><span class="lang-en">${UI_I18N.achievement.en}</span>
      <br><span class="lang-jp" style="color:#8878a8;">隠し実績:虚ろな駅を見た者──あなたは、地図にない駅で誰かに会釈された。その記憶だけは、どの結末にも消えずに残っている。</span>
      </div>`;
    }
    endBlock += `<button class="restart" onclick="window.__restart()">${UI_I18N.restart.ru} / ${UI_I18N.restart.en} / もう一度、旅立つ</button>`;
  }

  const tName = t.name || {};
  const tVoice = t.voice || {};

  app.innerHTML = `
    <header>
      <div class="title-en">${UI_I18N.title.ru} ／ Station, or Home</div>
      <div class="title-jp">駅、あるいは家</div>
      <button class="bgm-toggle" onclick="window.__toggleBgm()">${audio.playing
        ? `♪ ${UI_I18N.bgmOff.ru} / ${UI_I18N.bgmOff.en} / 音を止める`
        : `♪ ${UI_I18N.bgmOn.ru} / ${UI_I18N.bgmOn.en} / 音を鳴らす`}</button>
    </header>

    <div class="gauges">
      <div class="gauge">
        <div class="dial" style="--pct:${state.hp}; --gauge-color:${hpColor};"><span class="dial-val">${state.hp}</span></div>
        <div class="gauge-label">${UI_I18N.hp.ru} / ${UI_I18N.hp.en} / 体力</div>
      </div>
      <div class="gauge">
        <div class="dial" style="--pct:${state.wp}; --gauge-color:${wpColor};"><span class="dial-val">${state.wp}</span></div>
        <div class="gauge-label">${UI_I18N.wp.ru} / ${UI_I18N.wp.en} / 気力</div>
      </div>
    </div>

    ${buildMap()}

    <div class="scene" data-theme="${n.theme||'station'}" data-icon="${n.icon||''}">
      <div class="scene-name">
        ${tName.ru ? `<span class="name-ru">${tName.ru}</span>` : ''}
        ${tName.en ? `<span class="lang-en name-en">${tName.en}</span>` : ''}
        <span class="lang-jp name-jp">${n.name}</span>
      </div>
      ${state.node === 'start' ? `<img class="scene-art" src="${COVER_ART}" alt="">` : ''}
      <div class="scene-text">
        ${t.text && t.text.ru ? `<span class="lang-ru">${degrade(t.text.ru, state.wp)}${physicalOverlay(state.hp,'ru')}</span>` : ''}
        ${t.text && t.text.en ? `<span class="lang-en block">${degrade(t.text.en, state.wp)}${physicalOverlay(state.hp,'en')}</span>` : ''}
        <span class="lang-jp">${degrade(n.text, state.wp)}${physicalOverlay(state.hp,'jp')}</span>
        ${n.voice ? `<span class="voice">${tVoice.ru?`<span class="lang-ru" style="font-size:1.05em;">«${tVoice.ru}»</span>`:''}${tVoice.en?`<span class="lang-en">"${tVoice.en}"</span>`:''}<span class="lang-jp">「${n.voice}」</span></span>` : ''}
      </div>
      ${choicesHTML}
      ${endBlock}
    </div>

    <footer>turn ${state.turn} ／ 1910</footer>
  `;
  window.scrollTo({top:0, behavior:'smooth'});
}


/* ---------------- BGM: シェーンベルク「浄められた夜」風コード進行アレンジ ---------------- */
/* 原曲は1899年作品でパブリックドメイン。同曲がニ短調からニ長調へ
   「浄化」されて終わる構造を踏まえ、ループ末尾でピカルディ終止
   (短調→同主長調)を用いたオリジナル進行を使用。
   Dm → F → B♭ → Gm → A7 → Dm → B♭ → D(picardy) */
const CHORD_PROGRESSION = [
  ['D3','F3','A3','D4'],
  ['F3','A3','C4','F4'],
  ['A#3','D4','F4','A#4'],
  ['G3','A#3','D4','G4'],
  ['A3','C#4','E4','G4'],
  ['D3','F3','A3','D4'],
  ['A#3','D4','F4','A#4'],
  ['D3','F#3','A3','D4'],
];
const NOTE_INDEX = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function noteToFreq(note){
  const m = note.match(/^([A-G]#?)(\d)$/);
  const idx = NOTE_INDEX[m[1]];
  const octave = parseInt(m[2],10);
  const semitonesFromA4 = (idx - 9) + (octave - 4) * 12;
  return 440 * Math.pow(2, semitonesFromA4/12);
}

/* ---------------- 効果音(SE) ---------------- */
const sfx = {
  ctx: null, noiseBuffer: null,
  init(){
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = this.ctx.sampleRate * 1.2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<len;i++) data[i] = Math.random()*2-1;
    this.noiseBuffer = buf;
  },
  noiseBurst(dur, freq, q, gain){
    this.init();
    const c = this.ctx;
    const src = c.createBufferSource();
    src.buffer = this.noiseBuffer;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = c.createGain();
    const now = c.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, now+dur);
    src.connect(bp).connect(g).connect(c.destination);
    src.start(now); src.stop(now+dur);
  },
  step(){
    // 足音:低い帯域の短いノイズ
    this.noiseBurst(0.16, 220, 2.2, 0.22);
  },
  page(){
    // 紙・衣擦れ:高めの帯域の短いノイズ
    this.noiseBurst(0.22, 2600, 1.4, 0.10);
  },
  whistle(){
    // 汽笛:短二度でうなる持続音
    this.init();
    const c = this.ctx; const now = c.currentTime;
    [440, 523.25].forEach((f,i)=>{
      const osc = c.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f*0.85, now);
      osc.frequency.linearRampToValueAtTime(f, now+0.15);
      const lp = c.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value = 1200;
      const g = c.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.06, now+0.12);
      g.gain.linearRampToValueAtTime(0.05, now+0.55);
      g.gain.exponentialRampToValueAtTime(0.001, now+0.95);
      osc.connect(lp).connect(g).connect(c.destination);
      osc.start(now); osc.stop(now+1.0);
    });
  },
  chime(){
    // 結末到達の鐘
    this.init();
    const c = this.ctx; const now = c.currentTime;
    [523.25, 659.25, 784.0].forEach((f,i)=>{
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = c.createGain();
      const start = now + i*0.12;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.12, start+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, start+1.8);
      osc.connect(g).connect(c.destination);
      osc.start(start); osc.stop(start+1.9);
    });
  }
};

const audio = {
  ctx: null, master: null, playing: false,
  chordIdx: 0, timer: null,
  init(){
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.17;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1900;
    this.master.connect(lp).connect(this.ctx.destination);
    this.filter = lp;
  },
  playChord(notes, dur, detuneAmt){
    const now = this.ctx.currentTime;
    notes.forEach((note, i)=>{
      const osc = this.ctx.createOscillator();
      osc.type = i===0 ? 'triangle' : 'sine';
      osc.frequency.value = noteToFreq(note);
      osc.detune.value = (Math.random()-0.5) * detuneAmt;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.42/notes.length, now + dur*0.4);
      g.gain.linearRampToValueAtTime(0, now + dur*0.98);
      osc.connect(g).connect(this.master);
      osc.start(now);
      osc.stop(now + dur);
    });
  },
  // 分散和音の層:同じ和音を崩して重ね、対旋律のように響かせる
  playArpeggio(notes, dur, detuneAmt){
    const now = this.ctx.currentTime;
    const up = notes.slice(1); // ルート以外を使用(パッドのルートと被らないように)
    const seq = [...up, ...up.slice().reverse().slice(1)]; // 上行→下行の弧を描く
    const step = dur / (seq.length + 1);
    seq.forEach((note,i)=>{
      const t = now + step*(i+0.6);
      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = noteToFreq(note) * 2; // 1オクターブ上できらめかせる
      osc.detune.value = (Math.random()-0.5) * detuneAmt * 0.6;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.075, t + step*0.2);
      g.gain.linearRampToValueAtTime(0, t + step*1.1);
      osc.connect(g).connect(this.master);
      osc.start(t);
      osc.stop(t + step*1.15);
    });
  },
  // ゆっくり動く低音の対旋律(次の和音のルートへ先取りして経過的につなぐ)
  playBassLine(currentRoot, nextRoot, dur){
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sine';
    const f1 = noteToFreq(currentRoot) / 2;
    const f2 = noteToFreq(nextRoot) / 2;
    osc.frequency.setValueAtTime(f1, now);
    osc.frequency.linearRampToValueAtTime(f2, now + dur*0.97);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.16, now + dur*0.5);
    g.gain.linearRampToValueAtTime(0, now + dur*0.99);
    osc.connect(g).connect(this.master);
    osc.start(now);
    osc.stop(now + dur);
  },
  step(){
    if (!this.playing) return;
    // 体力が低いほどテンポがゆるやかになる(ただし悲愴風より軽め)
    const hp = state.hp;
    const dur = 2.3 + (100 - hp) * 0.015; // 2.3s(元気)〜3.8s(瀕死)
    // 気力が低いほど和音が濁る(デチューンは控えめに)
    const wp = state.wp;
    const detune = 1.5 + (100 - wp) * 0.35; // 1.5〜36.5 cent
    this.filter.frequency.setTargetAtTime(1400 + wp*7, this.ctx.currentTime, 1.5);

    const chord = CHORD_PROGRESSION[this.chordIdx];
    const nextChord = CHORD_PROGRESSION[(this.chordIdx + 1) % CHORD_PROGRESSION.length];
    this.playChord(chord, dur, detune);
    this.playArpeggio(chord, dur, detune);
    this.playBassLine(chord[0], nextChord[0], dur);

    this.chordIdx = (this.chordIdx + 1) % CHORD_PROGRESSION.length;
    this.timer = setTimeout(()=>this.step(), dur*1000*0.92);
  },
  toggle(){
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.playing = !this.playing;
    if (this.playing){ this.step(); }
    else { clearTimeout(this.timer); }
  }
};
window.__toggleBgm = ()=>{ audio.toggle(); render(); };

window.__choose = choose;
window.__restart = restart;
document.getElementById('splash-img').src = COVER_ART;
render();
</script>
