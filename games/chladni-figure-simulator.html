<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Chladni Figure Simulator</title>
  <style>
    body { font-family: sans-serif; background: #0f0f13; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 1.5rem; color: #ffab40; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    canvas { background: #050508; border-radius: 8px; }
    .controls { background: #1a1a24; padding: 20px; border-radius: 8px; width: 280px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
    input[type="range"] { width: 100%; }
    button { padding: 8px; border-radius: 4px; background: #2a2a38; color: #fff; border: 1px solid #3d3d52; cursor: pointer; }
    .top-bar { display: flex; justify-content: flex-end; width: 100%; max-width: 700px; }
    #langBtn { padding: 6px 14px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="top-bar"><button id="langBtn">EN</button></div>
  <h1 id="title">クラドニ図形（音の振動パターン）</h1>
  <div class="container">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls">
      <label id="nLabel">周波数 N: <input type="range" id="nInput" min="1" max="10" value="3"></label>
      <label id="mLabel">周波数 M: <input type="range" id="mInput" min="1" max="10" value="5"></label>
      <label id="countLabel">粒子密度: <input type="range" id="countInput" min="1000" max="15000" step="500" value="4000"></label>
      <button id="resetBtn">砂を撒き直す</button>
      <div id="explain" style="font-size: 0.8rem; color: #888;">【仕組み】振動の「節（動かない場所）」に砂が集まり模様を作ります。</div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let N = 3, M = 5;

    const MAX_COUNT = 15000;
    let count = 4000;
    const xs = new Float32Array(MAX_COUNT);
    const ys = new Float32Array(MAX_COUNT);
    // index buffers per settledness bucket, filled fresh each frame (avoids re-scanning + repeated fillStyle switches)
    const idxMoving = new Int32Array(MAX_COUNT);
    const idxMid = new Int32Array(MAX_COUNT);
    const idxSettled = new Int32Array(MAX_COUNT);

    // Precomputed amplitude field so we don't run sin() per-particle per-frame.
    const FIELD_RES = 160;
    const field = new Float32Array(FIELD_RES * FIELD_RES);

    function computeField() {
      const piN = Math.PI * N, piM = Math.PI * M;
      for (let i = 0; i < FIELD_RES; i++) {
        const x = (i / (FIELD_RES - 1)) * 2 - 1;
        const sinNx = Math.sin(piN * x), sinMx = Math.sin(piM * x);
        for (let j = 0; j < FIELD_RES; j++) {
          const y = (j / (FIELD_RES - 1)) * 2 - 1;
          const val = sinNx * Math.sin(piM * y) - 0.5 * sinMx * Math.sin(piN * y);
          field[i * FIELD_RES + j] = Math.abs(val);
        }
      }
    }

    function sampleField(x, y) {
      let i = ((x + 1) * 0.5 * (FIELD_RES - 1)) | 0;
      let j = ((y + 1) * 0.5 * (FIELD_RES - 1)) | 0;
      if (i < 0) i = 0; else if (i >= FIELD_RES) i = FIELD_RES - 1;
      if (j < 0) j = 0; else if (j >= FIELD_RES) j = FIELD_RES - 1;
      return field[i * FIELD_RES + j];
    }

    function seedParticle(k) {
      xs[k] = (Math.random() - 0.5) * 2;
      ys[k] = (Math.random() - 0.5) * 2;
    }

    function init() {
      for (let k = 0; k < count; k++) seedParticle(k);
    }

    const w = canvas.width, h = canvas.height;

    function draw() {
      let nMoving = 0, nMid = 0, nSettled = 0;
      for (let k = 0; k < count; k++) {
        const amp = sampleField(xs[k], ys[k]);
        if (amp > 0.02) {
          xs[k] += (Math.random() - 0.5) * 0.015 * amp;
          ys[k] += (Math.random() - 0.5) * 0.015 * amp;
        }
        if (xs[k] < -1 || xs[k] > 1 || ys[k] < -1 || ys[k] > 1) seedParticle(k);

        if (amp >= 0.03) idxMoving[nMoving++] = k;
        else if (amp >= 0.01) idxMid[nMid++] = k;
        else idxSettled[nSettled++] = k;
      }

      // faint trail instead of a hard clear, gives the sand a flowing look
      ctx.fillStyle = 'rgba(5,5,8,0.35)';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(255,171,64,0.35)';
      for (let n = 0; n < nMoving; n++) { const k = idxMoving[n]; ctx.fillRect((xs[k] + 1) * 0.5 * w, (ys[k] + 1) * 0.5 * h, 1.3, 1.3); }
      ctx.fillStyle = '#ffcf7a';
      for (let n = 0; n < nMid; n++) { const k = idxMid[n]; ctx.fillRect((xs[k] + 1) * 0.5 * w, (ys[k] + 1) * 0.5 * h, 1.4, 1.4); }
      ctx.fillStyle = '#fff6d8';
      for (let n = 0; n < nSettled; n++) { const k = idxSettled[n]; ctx.fillRect((xs[k] + 1) * 0.5 * w, (ys[k] + 1) * 0.5 * h, 1.6, 1.6); }

      requestAnimationFrame(draw);
    }

    document.getElementById('nInput').addEventListener('input', e => { N = parseInt(e.target.value); computeField(); });
    document.getElementById('mInput').addEventListener('input', e => { M = parseInt(e.target.value); computeField(); });
    document.getElementById('countInput').addEventListener('input', e => {
      const newCount = parseInt(e.target.value);
      if (newCount > count) for (let k = count; k < newCount; k++) seedParticle(k);
      count = newCount;
    });
    document.getElementById('resetBtn').addEventListener('click', init);

    const i18n = {
      ja: {
        title: 'クラドニ図形（音の振動パターン）',
        n: '周波数 N: ',
        m: '周波数 M: ',
        count: '粒子密度: ',
        reset: '砂を撒き直す',
        explain: '【仕組み】振動の「節（動かない場所）」に砂が集まり模様を作ります。',
        btn: 'EN'
      },
      en: {
        title: 'Chladni Figures (Sound Vibration Patterns)',
        n: 'Frequency N: ',
        m: 'Frequency M: ',
        count: 'Particle Density: ',
        reset: 'Scatter Sand Again',
        explain: '[How it works] Sand collects at the vibration\'s "nodes" (still points), forming a pattern.',
        btn: '日本語'
      }
    };
    let lang = 'ja';
    function applyLang() {
      const t = i18n[lang];
      document.getElementById('title').textContent = t.title;
      document.getElementById('nLabel').firstChild.textContent = t.n;
      document.getElementById('mLabel').firstChild.textContent = t.m;
      document.getElementById('countLabel').firstChild.textContent = t.count;
      document.getElementById('resetBtn').textContent = t.reset;
      document.getElementById('explain').textContent = t.explain;
      document.getElementById('langBtn').textContent = t.btn;
      document.documentElement.lang = lang;
    }
    document.getElementById('langBtn').addEventListener('click', () => {
      lang = lang === 'ja' ? 'en' : 'ja';
      applyLang();
    });

    applyLang();
    computeField(); init(); draw();
  </script>
</body>
</html>
