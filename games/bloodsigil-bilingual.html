<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOODSIGIL: Five Spirits — 血印</title>
<style>

:root{
  --bg-0:#0a0809; --bg-1:#150f16; --bg-2:#1d151f;
  --blood:#8e2430; --blood-soft:#c5555a; --bone-soft:#d9c9a0; --ink-dim:#867d70;
  --panel-border: rgba(168,154,120,0.22);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 15% -10%, #2a1420 0%, transparent 55%),
    radial-gradient(ellipse at 95% 105%, #1a1024 0%, transparent 50%),
    var(--bg-0);
  color:var(--ink-dim);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:56px 24px 40px;
  font-family:Georgia, 'Times New Roman', serif;
}
#boot{ text-align:center; max-width:420px; }
#boot .glyph{ font-size:44px; margin-bottom:10px; }
#boot h1{
  font-size:40px; letter-spacing:0.06em; color:var(--bone-soft); margin:0 0 6px;
  text-shadow:0 0 22px rgba(142,36,48,0.45);
}
#boot p{ font-size:14px; font-style:italic; margin:0 0 30px; color:var(--ink-dim); }
.lang-row{ display:flex; gap:14px; justify-content:center; }
.lang-btn{
  font-family:Georgia, serif; font-size:16px; letter-spacing:0.05em;
  background:linear-gradient(165deg,#241a26,#150f16); color:var(--bone-soft);
  border:1px solid var(--panel-border); border-bottom:2px solid rgba(142,36,48,0.4);
  padding:16px 26px; border-radius:3px; cursor:pointer; min-width:150px;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.lang-btn:hover{ border-color:var(--blood-soft); box-shadow:0 0 18px rgba(142,36,48,0.3); transform:translateY(-1px); }
.lang-btn .flagline{ display:block; font-size:11px; color:var(--ink-dim); margin-top:4px; letter-spacing:0.1em; }
#app{width:100%; max-width:640px;}

</style>
</head>
<body>

<div id="boot">
  <div class="glyph">🩸</div>
  <h1>BLOODSIGIL</h1>
  <p>A cursed card duel of Might &amp; Lore — 力と知の呪われたデュエル</p>
  <div class="lang-row">
    <button class="lang-btn" id="pick-en" onclick="bootGame('en')">English<span class="flagline">PLAY IN ENGLISH</span></button>
    <button class="lang-btn" id="pick-ja" onclick="bootGame('ja')">日本語<span class="flagline">日本語でプレイ</span></button>
  </div>
</div>

<div id="app"></div>

button{
  font-family:'Cinzel',serif;
  background:linear-gradient(165deg,#241a26,#150f16);
  color:var(--bone-soft);
  border:1px solid var(--panel-border);

  padding:13px 20px;
  border-radius:3px;
  font-size:14px;
  letter-spacing:0.05em;

  width:100%;
}
button:hover{border-color:var(--blood-soft); box-shadow:0 0 18px rgba(142,36,48,0.3); transform:translateY(-1px);}

button.primary{background:linear-gradient(165deg, #5c1a22, #340e14); color:#f0e2d8; border-color:var(--blood-soft);}
button.ghost{background:transparent;}

.name-row{display:flex; gap:10px; margin-bottom:10px;}
.name-row input{
  flex:1; background:var(--bg-0); border:1px solid var(--panel-border); color:var(--ink);
  padding:10px 12px; border-radius:3px; font-family:'EB Garamond',serif; font-size:15px;
}

/* ---- HUD ---- */
.hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px;}
.mute-btn{
  width:auto; flex:0 0 auto; padding:6px 10px; font-size:15px; border-radius:3px;
  background:var(--bg-1); border:1px solid var(--panel-border);
}
.mute-btn:hover{border-color:var(--blood-soft);}
.round-badge{
  font-family:'Cinzel',serif; font-size:12px; color:var(--blood-soft); letter-spacing:0.12em;
  border:1px solid var(--panel-border); padding:6px 14px; border-radius:3px; background:var(--bg-1);
}
.sigil-mini{display:flex; gap:16px; font-size:13.5px;}
.sigil-mini span{color:var(--bone-soft);}

.field-card{
  text-align:center; padding:22px 16px; border-radius:3px; margin-bottom:16px;
  border:1px solid var(--panel-border); position:relative; overflow:hidden;
}
.field-card::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%, rgba(142,36,48,0.12), transparent 70%);
}
.field-card.field-plains{background:linear-gradient(165deg, #2a1416, #17111c);}
.field-card.field-library{background:linear-gradient(165deg, #201530, #17111c);}
.field-card.field-labyrinth{background:linear-gradient(165deg, #1c1620, #14101a);}
.field-card.field-mirror{background:linear-gradient(165deg, #241a2e, #17111c);}
.field-card.field-storm{background:linear-gradient(165deg, #241514, #17111c);}
.field-card.field-widowveil{background:linear-gradient(165deg, #1e1428, #17111c);}
.field-card.field-feasthall{background:linear-gradient(165deg, #2a1620, #17111c);}
.field-card.field-gallows{background:linear-gradient(165deg, #201a14, #17111c);}
.field-icon{font-size:32px; display:block; margin-bottom:6px; filter:grayscale(0.3);}
.field-name{font-family:'Cinzel',serif; font-size:19px; color:var(--bone-soft); margin:0 0 4px; letter-spacing:0.04em;}
.field-desc{color:var(--ink-dim); font-size:13.5px; margin:0;}

/* ---- pass / info screens ---- */
.pass-screen{text-align:center; padding:44px 20px;}
.pass-screen .glyph{font-size:42px; margin-bottom:14px; filter:grayscale(0.3);}
.pass-screen h2{color:var(--bone-soft); margin:0 0 10px; font-weight:600;}
.pass-screen p{color:var(--ink-dim); margin:0 0 22px; font-size:14.5px;}
.janken-row{display:flex; gap:10px; justify-content:center;}
.janken-row button{width:auto; flex:1; padding:16px 8px; font-size:13px; line-height:1.7;}

/* ---- hand grid ---- */
.hand-title{font-size:13px; color:var(--ink-dim); text-align:center; margin:0 0 12px; letter-spacing:0.06em; text-transform:uppercase;}
.hand-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:16px;}
.card{
  border-radius:3px; padding:12px 9px 10px; text-align:center; cursor:pointer;
  border:1px solid var(--panel-border); background:var(--bg-0); position:relative;
  transition:transform .12s ease, border-color .12s ease;
}
.card:hover{transform:translateY(-3px);}
.card.selected{border-color:var(--blood-soft); box-shadow:0 0 16px rgba(142,36,48,0.4);}
.card.power{border-top:3px solid var(--blood);}
.card.wisdom{border-top:3px solid var(--lore);}
.card.balance{border-top:3px solid var(--bone);}
.card .icon{font-size:26px; display:block; margin-bottom:4px; filter:grayscale(0.25);}
.card .cname{font-size:12.5px; color:var(--ink); display:block; margin-bottom:5px; font-weight:600; letter-spacing:0.01em;}
.card .stats{font-size:11.5px; color:var(--ink-dim); display:flex; justify-content:center; gap:10px; margin-bottom:6px;}
.card .stats b{color:var(--blood-soft); font-weight:700;}
.card .stats i{color:var(--lore-soft); font-style:normal; font-weight:700;}
.stats .relevant{color:var(--bone-soft) !important; text-decoration:underline; text-underline-offset:3px;}
.card.used{opacity:0.16; pointer-events:none;}
.card.banned{opacity:0.4; pointer-events:none; border-color:var(--blood);}
.card.banned .outcome{color:var(--blood-soft); font-weight:600;}

.outcome{margin-top:6px; font-size:10.5px; line-height:1.55; text-align:left; border-top:1px solid var(--panel-border); padding-top:6px;}
.outcome .row{display:flex; gap:5px;}
.outcome .tag{flex:0 0 auto; font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.03em; padding:1px 5px; border-radius:2px; height:fit-content;}
.outcome .tag.win{background:rgba(143,170,110,0.15); color:var(--win-col-soft); border:1px solid rgba(143,170,110,0.3);}
.outcome .tag.lose{background:rgba(142,36,48,0.15); color:var(--blood-soft); border:1px solid rgba(142,36,48,0.3);}
.outcome .txt{color:var(--ink); flex:1;}

.peek-row{display:flex; flex-wrap:wrap; gap:8px;}
.peek-card{
  display:flex; align-items:center; gap:6px; background:var(--bg-0);
  border:1px solid var(--panel-border); border-radius:3px; padding:6px 10px;
}
.peek-card .icon{font-size:16px; filter:grayscale(0.25);}
.peek-card .pname2{font-size:11.5px; color:var(--lore-soft);}

/* ---- reveal ---- */
.reveal-row{display:flex; gap:12px; align-items:stretch; margin-bottom:14px;}
.reveal-slot{flex:1; text-align:center;}
.reveal-slot .pname{font-size:12.5px; color:var(--ink-dim); margin-bottom:8px; letter-spacing:0.03em;}
@keyframes cardReveal{
  0%{ transform: rotateY(90deg) scale(0.82); opacity:0; }
  55%{ transform: rotateY(-10deg) scale(1.04); opacity:1; }
  100%{ transform: rotateY(0deg) scale(1); opacity:1; }
}
.reveal-card{border-radius:3px; padding:18px 8px; background:var(--bg-0); border:1px solid var(--panel-border);
  animation: cardReveal 0.55s cubic-bezier(.2,.8,.3,1) both; transform-style:preserve-3d;}
.reveal-card.power{border-top:4px solid var(--blood);}
.reveal-card.wisdom{border-top:4px solid var(--lore);}
.reveal-card.balance{border-top:4px solid var(--bone);}
.reveal-card .icon{font-size:36px; display:block; margin-bottom:6px; filter:grayscale(0.25);}
.reveal-card .cname{font-size:13px; margin-bottom:6px;}
.reveal-card .stats{font-size:12.5px; color:var(--ink-dim);}
.reveal-card .stats b{color:var(--blood-soft); font-weight:700;}
.reveal-card .stats i{color:var(--lore-soft); font-style:normal; font-weight:700;}
.vs{align-self:center; font-family:'Pirata One',serif; color:var(--blood-soft); font-size:22px;}

@keyframes logPulse{
  0%{ box-shadow: 0 0 0 rgba(142,36,48,0); }
  30%{ box-shadow: 0 0 22px rgba(142,36,48,0.5); }
  100%{ box-shadow: 0 0 0 rgba(142,36,48,0); }
}
@keyframes screenShake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-6px); }
  40%{ transform:translateX(5px); }
  60%{ transform:translateX(-4px); }
  80%{ transform:translateX(3px); }
}
.log-box{ animation: logPulse 1.1s ease-out; }
.log-box.big-effect{ animation: logPulse 1.1s ease-out, screenShake 0.4s ease-in-out; border-color: var(--blood-soft); }

.log-box{
  background:var(--bg-0); border:1px solid var(--panel-border); border-radius:3px;
  padding:14px 16px; margin-bottom:16px; font-size:13.5px; line-height:1.7; color:var(--ink);
}
.log-box .win-line{color:var(--bone-soft); font-weight:600;}
.log-box .curse-voice{display:block; margin-top:6px; font-style:italic; color:var(--lore-soft); font-size:12.5px; opacity:0.9;}

.sigil-diff{display:flex; justify-content:space-around; margin-bottom:16px; font-size:13.5px;}
.sigil-diff .c-name{color:var(--ink-dim);}
.sigil-diff .c-val{font-size:20px; color:var(--bone-soft); font-family:'Cinzel',serif;}

/* ---- end screen ---- */
.end-screen{text-align:center;}
.winner-name{font-size:26px; color:var(--bone-soft); font-family:'Pirata One',serif; margin:8px 0 20px; text-shadow:0 0 20px rgba(142,36,48,0.4);}
.final-scores{display:flex; justify-content:space-around; margin-bottom:24px;}
.final-scores div{font-size:14px;}
.final-scores .val{font-size:28px; color:var(--bone-soft); font-family:'Cinzel',serif;}

.footer-note{text-align:center; color:var(--ink-dim); font-size:11.5px; margin-top:18px; opacity:0.7;}

.draft-counter{
  text-align:center; font-family:'Cinzel',serif;
  font-size:14px; color:var(--bone-soft); background:var(--bg-0); border:1px solid var(--panel-border);
  border-radius:3px; padding:8px; margin-bottom:12px;
}
.draft-counter b{color:var(--blood-soft);}

.ai-grid{display:flex; flex-direction:column; gap:12px; margin-bottom:8px;}
.ai-card{
  background:linear-gradient(165deg, var(--bg-1), var(--bg-2));
  border:1px solid var(--panel-border); border-radius:3px; padding:18px 16px;
  cursor:pointer; text-align:center; transition:transform .12s ease, border-color .12s ease;
}
.ai-card:hover{transform:translateY(-2px); border-color:var(--blood-soft); box-shadow:0 0 18px rgba(142,36,48,0.25);}
.ai-card .icon{font-size:32px; display:block; margin-bottom:8px; filter:grayscale(0.25);}
.ai-card .ai-name{font-family:'Cinzel',serif; font-size:17px; color:var(--bone-soft); margin-bottom:6px;}
.ai-card .ai-blurb{color:var(--ink-dim); font-size:13px; font-style:italic; margin:0; line-height:1.6;}

.story-panel{
  background:var(--bg-0); border:1px solid var(--lore-soft); border-radius:3px;
  padding:18px 18px; margin-bottom:18px; text-align:left; position:relative;
}
.story-panel .story-glyph{font-size:22px; display:block; text-align:center; margin-bottom:8px; filter:grayscale(0.25);}
.story-panel p{margin:0; font-style:italic; color:var(--ink); font-size:14px; line-height:1.8;}

@media (max-width:380px){
  .hand-grid{gap:7px;}
  .card{padding:10px 6px 8px;}
  .card .cname{font-size:11.5px;}
  .outcome{font-size:10px;}
  .title-main{font-size:38px;}
}

</style></template>

  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(peak||0.2, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  const filter = audioCtx.createBiquadFilter();
  filter.type='lowpass'; filter.frequency.value = cutoff||1800;
  src.connect(filter); filter.connect(gain); gain.connect(masterGain);
  src.start(t0);
}

function sfxClick(){ ensureAudio(); blip(220, 0.08, 'square', 0.14); }
function sfxSelect(){ ensureAudio(); blip(330, 0.1, 'triangle', 0.16); }
function sfxReveal(){ ensureAudio(); noiseBurst(0.35, 0.18); blip(140,0.3,'sawtooth',0.08,0.02); }
function sfxWin(){ ensureAudio(); blip(392,0.16,'triangle',0.2,0); blip(523,0.2,'triangle',0.2,0.1); blip(659,0.28,'triangle',0.22,0.2); }
function sfxCurse(){ ensureAudio(); blip(110,0.4,'sawtooth',0.16,0); blip(116,0.4,'sawtooth',0.12,0.03); noiseBurst(0.25,0.1,0.04); }
function sfxStorm(){ ensureAudio(); noiseBurst(0.7,0.16,0,900); blip(70,0.6,'sawtooth',0.09,0.05); }
function sfxCoin(){ ensureAudio(); blip(880,0.08,'square',0.13,0); blip(1108,0.1,'square',0.13,0.07); }

/* ---- BGM: low drone + breathing filter + haunted bells (with echo) + distant thuds ---- */
function ensureEcho(){
  if(echoNode || !audioCtx) return;
  echoNode = audioCtx.createDelay(2.5);
  echoNode.delayTime.value = 0.6;
  echoFeedback = audioCtx.createGain();
  echoFeedback.gain.value = 0.36;
  echoWet = audioCtx.createGain();
  echoWet.gain.value = 0.55;
  echoNode.connect(echoFeedback);
  echoFeedback.connect(echoNode);
  echoNode.connect(echoWet);
  echoWet.connect(masterGain);
}

function bellTone(freq, dur, peak, delay){
  if(!audioCtx) return;
  ensureEcho();
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0+0.06);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain);
  gain.connect(masterGain);
  if(echoNode) gain.connect(echoNode);
  osc.start(t0); osc.stop(t0+dur+0.15);
}

function startBGM(){
  ensureAudio();
  if(!audioCtx || bgmNodes) return;
  ensureEcho();

  const droneRoot  = audioCtx.createOscillator();
  const droneRoot2 = audioCtx.createOscillator();
  const droneFifth = audioCtx.createOscillator();
  const fifthGain  = audioCtx.createGain();
  const filter     = audioCtx.createBiquadFilter();
  const droneGain  = audioCtx.createGain();

  filter.type = 'lowpass';
  filter.frequency.value = 380;
  droneRoot.type='sine';  droneRoot.frequency.value=41.20;   // low E
  droneRoot2.type='sine'; droneRoot2.frequency.value=41.45;  // detuned, slow beating
  droneFifth.type='sine'; droneFifth.frequency.value=61.74;  // quiet fifth above
  fifthGain.gain.value = 0.4;
  droneGain.gain.value = 0.07;

  droneRoot.connect(filter);
  droneRoot2.connect(filter);
  droneFifth.connect(fifthGain); fifthGain.connect(filter);
  filter.connect(droneGain); droneGain.connect(masterGain);

  // slow filter movement — the drone seems to "breathe"
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.type='sine'; lfo.frequency.value = 0.045;
  lfoGain.gain.value = 150;
  lfo.connect(lfoGain); lfoGain.connect(filter.frequency);

  droneRoot.start(); droneRoot2.start(); droneFifth.start(); lfo.start();
  bgmNodes = {droneRoot, droneRoot2, droneFifth, fifthGain, filter, droneGain, lfo, lfoGain};
  scheduleBell();
  scheduleThud();
}

function scheduleBell(){
  if(!bgmNodes) return;
  // low, Phrygian-flavored scale — a half-step above the root reads as ominous
  const scale = [164.81,174.61,196.00,220.00,246.94,261.63,293.66];
  const freq = scale[Math.floor(Math.random()*scale.length)] / 2;
  bellTone(freq, 3.2, 0.055);
  bgmTimer = setTimeout(scheduleBell, 3800+Math.random()*3800);
}

function scheduleThud(){
  if(!bgmNodes) return;
  blip(38, 1.1, 'sine', 0.08);
  noiseBurst(0.5, 0.05, 0.05, 300);
  bgmThudTimer = setTimeout(scheduleThud, 9000+Math.random()*9000);
}

function stopBGM(){
  if(bgmTimer) clearTimeout(bgmTimer);
  if(bgmThudTimer) clearTimeout(bgmThudTimer);
  bgmTimer = null; bgmThudTimer = null;
  if(bgmNodes){
    try{
      bgmNodes.droneRoot.stop(); bgmNodes.droneRoot2.stop();
      bgmNodes.droneFifth.stop(); bgmNodes.lfo.stop();
    }catch(e){}
    bgmNodes = null;
  }
}

function aiDraftDeck(aiChar){
  const scored = CARD_DEFS.map(c=>{
    const statScore = c.power + c.wisdom;
    const lossScore = (LOSS_VALUE[c.ability] || 0) * aiChar.lossWeight;
    const favBonus = abilityFavorBonus(c.ability, aiChar);
    const score = statScore*0.6 + lossScore + favBonus + Math.random()*4;
    return {id:c.id, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0, DECK_SIZE).map(s=>s.id);
}

function newGame(name1, aiChar, playerDeck){
  const aiDeck = aiDraftDeck(aiChar);
  const fieldSeq = [];
  for(let i=0;i<MAX_ROUNDS;i++){
    fieldSeq.push(FIELD_POOL[Math.floor(Math.random()*FIELD_POOL.length)]);
  }
  state = {
    phase:'janken',
    round:1,
    fieldSeq,
    forcedNext:null,
    firstPlayer:null,
    jankenMessage:null,
    aiChar,
    players:[
      {name:name1||'Challenger', crystals:0, deck:playerDeck.slice(), hand:playerDeck.slice(), bannedCardIds:[], destroyedCards:[], bonusNextWin:false, canSeeOpponentHand:false},
      {name:aiChar.name, crystals:0, deck:aiDeck.slice(), hand:aiDeck.slice(), bannedCardIds:[], destroyedCards:[], bonusNextWin:false, canSeeOpponentHand:false},
    ],
    selections:[null,null],
    lastResolution:null,
    pendingReclaim:null,
  };
  render();
}

function currentField(){ return FIELDS[state.fieldSeq[state.round-1]]; }
function currentFieldKey(){ return state.fieldSeq[state.round-1]; }
function getCard(id){ return CARD_DEFS.find(c=>c.id===id); }

/* ============ RESOLUTION LOGIC ============ */
function awardWin(winner, log, note){
  let amount = 1;
  if(winner.bonusNextWin){
    amount = 2;
    winner.bonusNextWin = false;
    log.push(`👑 The Undying Guardian's blessing doubles the reward.`);
  }
  winner.crystals += amount;
  log.unshift(`<span class="win-line">${note} (+${amount} ${sigilWord(amount)})</span>`);
  if(winner === state.players[HUMAN_IDX]) sfxWin();
}

function resolveRound(){
  sfxReveal();
  const p1 = state.players[0], p2 = state.players[1];
  const c1 = getCard(state.selections[0]);
  const c2 = getCard(state.selections[1]);
  const fieldKey = currentFieldKey();
  const field = FIELDS[fieldKey];
  const log = [];
  let crystalBefore = [p1.crystals, p2.crystals];
  let reclaimInfo = null;
  const hadScoutBefore = [p1.canSeeOpponentHand, p2.canSeeOpponentHand];
  let actualWinnerIdx = null;

  if(fieldKey === 'storm'){
    p1.crystals += 1; p2.crystals += 1;
    log.push('The storm swallows the field whole. Both sides gain +1 Blood Sigil.');
    sfxStorm();
  } else {
    const diff = field.compare(c1, c2);
    if(diff === 0){
      const fpIdx = state.firstPlayer;
      const fp = state.players[fpIdx];
      const fpCard = fpIdx===0? c1:c2;
      actualWinnerIdx = fpIdx;
      log.push(`Neither yields — a tie. But ${fp.name}, holding First Strike, forces the issue.`);
      awardWin(fp, log, `${fpCard.icon} ${fp.name}'s ${fpCard.name} claims the duel by right of First Strike`);
    } else {
      let winnerIdx = diff>0 ? 0 : 1;
      let loserIdx = diff>0 ? 1 : 0;
      let winner = state.players[winnerIdx];
      let loser = state.players[loserIdx];
      let winnerCard = winnerIdx===0? c1:c2;
      let loserCard = loserIdx===0? c1:c2;

      if(loserCard.ability === 'LOSS_BECOMES_WIN'){
        actualWinnerIdx = loserIdx;
        log.push(`👻 ${loserCard.name} rewrites the ending. Defeat becomes victory.`);
        log.push(`<span class="curse-voice">"${loserCard.curseVoice}"</span>`);
        sfxCurse();
        awardWin(loser, log, `${loser.name}'s ${loserCard.name} unmakes its own fate`);
      } else {
        actualWinnerIdx = winnerIdx;
        let winnerGains = true;
        if(winnerCard.ability === 'SPY'){
          winnerGains = false;
          log.push(`🎭 ${winnerCard.name} wins, but reveals nothing. No Sigil is claimed.`);
        }
        switch(loserCard.ability){
          case 'GAIN1':
            loser.crystals += 1;
            log.push(`${loserCard.icon} ${loserCard.name} grants ${loser.name} +1 Blood Sigil.`);
            break;
          case 'GAIN2':
            loser.crystals += 2;
            log.push(`${loserCard.icon} ${loserCard.name} grants ${loser.name} +2 Blood Sigils — better than a win.`);
            break;
          case 'SPY':
            loser.crystals += 3;
            log.push(`🎭 ${loserCard.name} bares its true face for a rich reward: +3 Blood Sigils.`);
            break;
          case 'STEAL1':
            if(winner.crystals>0){ winner.crystals-=1; loser.crystals+=1; }
            log.push(`${loserCard.icon} ${loserCard.name} steals 1 Blood Sigil from ${winner.name}.`);
            break;
          case 'FORCE_FIELD':
            state.forcedNext = loserCard.forceField;
            log.push(`${loserCard.icon} ${loserCard.name} binds the next battlefield to the ${FIELDS[loserCard.forceField].name}.`);
            break;
          case 'NEGATE':
            winnerGains = false;
            log.push(`${loserCard.icon} ${loserCard.name} unravels the outcome. ${winner.name} claims nothing.`);
            break;
          case 'SCOUT':
            loser.canSeeOpponentHand = true;
            log.push(`${loserCard.icon} ${loserCard.name} marks every card left in ${winner.name}'s hand — open to sight, until ${loser.name} next loses a clash.`);
            break;
          case 'SUM_BONUS':{
            const loserSum = loserCard.power + loserCard.wisdom;
            const winnerSum = winnerCard.power + winnerCard.wisdom;
            if(loserSum > winnerSum){
              loser.crystals += 1;
              log.push(`${loserCard.icon} ${loserCard.name} held the higher combined total (${loserSum}) — ${loser.name} gains +1 Blood Sigil.`);
            } else {
              log.push(`${loserCard.icon} ${loserCard.name}'s combined total (${loserSum}) still falls short of ${winnerSum}.`);
            }
            break;
          }
          case 'BAN_NEXT':{
            const pool = winner.hand.filter(id=>id!==winnerCard.id);
            if(pool.length>1){
              const banId = pool[Math.floor(Math.random()*pool.length)];
              winner.bannedCardIds.push(banId);
              const banCard = getCard(banId);
              log.push(`${loserCard.icon} ${loserCard.name} strikes from the dark, sealing ${winner.name}'s "${banCard.name}" for one round.`);
            } else {
              log.push(`${loserCard.icon} ${loserCard.name} takes aim, but sealing their last card would leave them with nothing to play — the blade stays sheathed.`);
            }
            break;
          }
          case 'BAN_NEXT_2':{
            const pool = winner.hand.filter(id=>id!==winnerCard.id);
            if(pool.length>2){
              const shuffled = pool.slice().sort(()=>Math.random()-0.5);
              const banIds = shuffled.slice(0,2);
              banIds.forEach(id=>winner.bannedCardIds.push(id));
              const names = banIds.map(id=>getCard(id).name).join('" and "');
              log.push(`${loserCard.icon} ${loserCard.name} spreads its blight, sealing ${winner.name}'s "${names}" for one round.`);
            } else {
              log.push(`${loserCard.icon} ${loserCard.name} tries to spread, but too little of ${winner.name}'s hand remains — the sickness fails to take hold.`);
            }
            break;
          }
          case 'STEAL2':{
            const amt = Math.min(2, winner.crystals);
            winner.crystals -= amt; loser.crystals += amt;
            log.push(`${loserCard.icon} ${loserCard.name} steals ${amt} Blood Sigil${amt===1?'':'s'} from ${winner.name}.`);
            break;
          }
          case 'GAIN_PER_ROUND':
            loser.crystals += state.round;
            log.push(`${loserCard.icon} ${loserCard.name} grants ${loser.name} +${state.round} Blood Sigils — one for every round already fought.`);
            break;
          case 'COIN_FLIP':
            if(Math.random() < 0.5){
              loser.crystals += 3;
              log.push(`${loserCard.icon} ${loserCard.name} flips fate's coin — heads. ${loser.name} gains +3 Blood Sigils.`);
              sfxCoin();
            } else {
              log.push(`${loserCard.icon} ${loserCard.name} flips fate's coin — tails. Nothing happens.`);
            }
            break;
          case 'NEGATE_STEAL':
            winnerGains = false;
            if(winner.crystals>0){ winner.crystals -= 1; loser.crystals += 1; }
            log.push(`${loserCard.icon} ${loserCard.name} silences the victory entirely, then steals 1 Blood Sigil besides.`);
            break;
          case 'RECLAIM':{
            const usedIds = loser.deck
              .filter(id => !loser.hand.includes(id) && id !== loserCard.id && !loser.destroyedCards.includes(id));
            if(usedIds.length>0){
              if(loserIdx === AI_IDX){
                const pickId = usedIds[Math.floor(Math.random()*usedIds.length)];
                loser.hand.push(pickId);
                log.push(`${loserCard.icon} ${loserCard.name} quietly calls "${getCard(pickId).name}" back from the grave.`);
              } else {
                reclaimInfo = {ownerIdx: loserIdx, options: usedIds};
                log.push(`${loserCard.icon} ${loserCard.name} reaches into the grave to reclaim a spent card…`);
              }
            } else {
              log.push(`${loserCard.icon} ${loserCard.name} finds nothing left to reclaim.`);
            }
            break;
          }
          case 'BONUS_NEXT_WIN':
            loser.bonusNextWin = true;
            log.push(`${loserCard.icon} ${loserCard.name}'s oath ensures ${loser.name}'s next victory is worth double.`);
            break;
          default:
            break;
        }
        log.push(`<span class="curse-voice">"${loserCard.curseVoice}"</span>`);
        sfxCurse();
        if(winnerGains){
          awardWin(winner, log, `${winnerCard.icon} ${winner.name}'s ${winnerCard.name} claims the ${field.name}`);
        } else {
          log.unshift(`<span class="win-line">${winnerCard.icon} ${winner.name}'s ${winnerCard.name} held the field, for all the good it did…</span>`);
        }
      }
    }
  }

  p1.hand = p1.hand.filter(id=>id!==c1.id);
  p2.hand = p2.hand.filter(id=>id!==c2.id);

  if(actualWinnerIdx !== null){
    [0,1].forEach(idx=>{
      if(hadScoutBefore[idx] && actualWinnerIdx !== idx){
        state.players[idx].canSeeOpponentHand = false;
        log.push(`🏹 The scouted sight fades — ${state.players[idx].name}'s streak is broken.`);
      }
    });
  }

  state.lastResolution = {
    c1, c2, field, fieldKey, log,
    before:crystalBefore,
    after:[p1.crystals, p2.crystals],
  };
  state.pendingReclaim = reclaimInfo;
  state.phase = 'revealed';
  render();
}

function doReclaim(cardId){
  const owner = state.players[state.pendingReclaim.ownerIdx];
  if(!owner.hand.includes(cardId)) owner.hand.push(cardId);
  state.pendingReclaim = null;
  render();
}
function skipReclaim(){
  state.pendingReclaim = null;
  render();
}

function nextRound(){
  state.round += 1;
  state.selections = [null,null];
  if(state.round > MAX_ROUNDS){
    state.phase = 'end';
    render();
    return;
  }
  if(state.forcedNext){
    state.fieldSeq[state.round-1] = state.forcedNext;
    state.forcedNext = null;
  }
  state.phase = 'selecting';
  render();
}

/* ============ AI ============ */
const LOSS_VALUE = {
  NONE:0, FORCE_FIELD:1, SCOUT:1.5, SUM_BONUS:0.5, STEAL1:2,
  BAN_NEXT:1, RECLAIM:1, NEGATE:1.5, GAIN1:1, GAIN2:2,
  BONUS_NEXT_WIN:1.5, LOSS_BECOMES_WIN:3, SPY:3,
  STEAL2:3, BAN_NEXT_2:1.8, GAIN_PER_ROUND:2, COIN_FLIP:1.5, NEGATE_STEAL:2.5,
};

function fieldStatScore(c, fieldKey){
  if(fieldKey==='plains') return c.power;
  if(fieldKey==='library') return c.wisdom;
  if(fieldKey==='labyrinth') return c.power + c.wisdom;
  if(fieldKey==='mirror') return 8 - c.power;
  if(fieldKey==='widowveil') return 8 - c.wisdom;
  if(fieldKey==='feasthall') return Math.max(c.power, c.wisdom);
  if(fieldKey==='gallows') return 8 - Math.abs(c.power - c.wisdom);
  return 4; // storm
}

function abilityFavorBonus(ability, aiChar){
  return (aiChar.favoredAbilities && aiChar.favoredAbilities.includes(ability)) ? 2.5 : 0;
}

function aiChooseCard(aiPlayer, fieldKey, aiChar){
  const candidates = aiPlayer.hand.filter(id => !aiPlayer.bannedCardIds.includes(id));
  const pool = candidates.length>0 ? candidates : aiPlayer.hand;
  const scored = pool.map(id=>{
    const c = getCard(id);
    const statScore = fieldStatScore(c, fieldKey);
    const lossScore = (LOSS_VALUE[c.ability] || 0) * aiChar.lossWeight;
    const favBonus = abilityFavorBonus(c.ability, aiChar);
    let score = statScore + lossScore + favBonus;
    score += Math.random()*aiChar.noise;
    return {id, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  const topN = scored.slice(0, Math.min(3, scored.length));
  const pick = topN[Math.floor(Math.random()*topN.length)];
  return pick.id;
}

/* ============ RENDERING ============ */
function render(){
  const app = document.getElementById('app');
  if(!state || state.phase==='title'){ app.innerHTML = renderTitle(); return; }
  if(state.phase==='select-ai'){ app.innerHTML = renderSelectAI(); return; }
  if(state.phase==='draft'){ app.innerHTML = renderDraft(); return; }
  if(state.phase==='janken'){ app.innerHTML = renderJanken(); return; }
  if(state.phase==='selecting'){ app.innerHTML = renderSelecting(); return; }
  if(state.phase==='ai-thinking'){ app.innerHTML = renderAiThinking(); return; }
  if(state.phase==='revealing'){ app.innerHTML = renderRevealing(); return; }
  if(state.phase==='revealed'){ app.innerHTML = renderRevealed(); return; }
  if(state.phase==='end'){ app.innerHTML = renderEnd(); return; }
}

        <div class="stats">${statsHtml(c)}</div>
        <div class="outcome">
          <div class="row"><span class="tag win">WIN</span><span class="txt">${winOutcomeText(c, null)}</span></div>
          <div class="row"><span class="tag lose">LOSE</span><span class="txt">${c.loseOutcome}</span></div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="eyebrow">Draft Your Deck</div>
    <h1 class="title-main" style="font-size:24px;"><span class="title-word">Choose ${DECK_SIZE} of ${CARD_DEFS.length}</span></h1>
    <p class="title-sub" style="margin-bottom:14px;">${pendingAiChar.name} has already drafted its own hand, in secret.</p>
    <div class="draft-counter">Selected: <b>${count} / ${DECK_SIZE}</b></div>
    <div class="hand-grid">${cards}</div>
    <button class="primary" ${count===DECK_SIZE?'':'disabled'} onclick="confirmDraft()">Confirm Deck</button>
  `;
}

function toggleDraftCard(id){
  sfxClick();
  const sel = state.draftSelection;
  const i = sel.indexOf(id);
  if(i>=0) sel.splice(i,1);
  else if(sel.length<DECK_SIZE) sel.push(id);
  render();
}

function confirmDraft(){
  sfxSelect();
  newGame(pendingPlayerName, pendingAiChar, state.draftSelection);
}

function renderHUD(){
  const p1=state.players[0], p2=state.players[1];
  return `
    <div class="hud">
      <div class="round-badge">ROUND ${state.round} / ${MAX_ROUNDS}</div>
      <div class="sigil-mini">
        <span>${p1.name} 🩸<span>${p1.crystals}</span></span>
        <span>${p2.name} 🩸<span>${p2.crystals}</span></span>
      </div>
      <button class="mute-btn" onclick="toggleMute()">${audioMuted?'🔇':'🔊'}</button>
    </div>
  `;
}

function renderFieldCard(){
  const f = currentField();
  return `
    <div class="field-card ${f.cls}">
      <span class="field-icon">${f.icon}</span>
      <p class="field-name">${f.name}</p>
      <p class="field-desc">${f.desc}</p>
    </div>
  `;
}

function renderJanken(){
  const p1 = state.players[HUMAN_IDX];
  const ai = state.aiChar;
  return `
    <div class="panel pass-screen">
      <div class="glyph">${ai.icon}</div>
      <h2>The Rite of First Strike</h2>
      <p>${p1.name} versus ${ai.name}. The winner claims First Strike, and the right to win every tie that follows.</p>
      <div class="janken-row">
        <button onclick="playJanken('rock')">✊<br>Rock</button>
        <button onclick="playJanken('paper')">✋<br>Paper</button>
        <button onclick="playJanken('scissors')">✌️<br>Scissors</button>
      </div>
      ${state.jankenMessage ? `<div class="log-box" style="margin-top:16px;">${state.jankenMessage}</div>` : ''}
      ${state.firstPlayer!==null ? `<button class="primary" style="margin-top:14px;" onclick="beginMatch()">Begin the Duel</button>` : ''}
    </div>
  `;
}

function playJanken(choice){
  sfxClick();
  const ai = state.aiChar;
  const aiChoice = ['rock','paper','scissors'][Math.floor(Math.random()*3)];
  const beats = {rock:'scissors', scissors:'paper', paper:'rock'};
  let msg = `You: ${HAND_ICONS[choice]} ${HAND_LABELS[choice]} &nbsp;vs&nbsp; ${ai.name}: ${HAND_ICONS[aiChoice]} ${HAND_LABELS[aiChoice]}<br>`;
  if(choice===aiChoice){
    msg += 'A tie. Cast again.';
    state.firstPlayer = null;
  } else if(beats[choice]===aiChoice){
    msg += `<span class="win-line">You win! First Strike is yours.</span>`;
    state.firstPlayer = HUMAN_IDX;
    sfxWin();
  } else {
    msg += `<span class="win-line">${ai.name} wins. First Strike belongs to ${ai.name}.</span>`;
    state.firstPlayer = AI_IDX;
  }
  state.jankenMessage = msg;
  render();
}


function beginMatch(){
  state.phase = 'selecting';
  render();
}

function renderEnemyPeek(){
  const human = state.players[HUMAN_IDX];
  if(!human.canSeeOpponentHand) return '';
  const ai = state.players[AI_IDX];
  const cardsHtml = ai.hand.map(id=>{
    const c = getCard(id);
    return `
      <div class="peek-card">
        <span class="icon">${c.icon}</span>
        <span class="pname2">${c.name}</span>
      </div>
    `;
  }).join('') || `<p style="color:var(--ink-dim); font-size:13px; margin:0;">Their hand is empty.</p>`;
  return `
    <div class="panel" style="border-color:var(--lore-soft);">
      <p class="hand-title">🏹 Scouted — ${ai.name}'s remaining hand</p>
      <div class="peek-row">${cardsHtml}</div>
    </div>
  `;
}

function renderSelecting(){
  const idx = HUMAN_IDX;
  const player = state.players[idx];
  const selectedId = state.selections[idx];
  const fk = currentFieldKey();
  const cards = player.deck.map(id=>getCard(id)).map(c=>{
    const inHand = player.hand.includes(c.id);
    const banned = inHand && player.bannedCardIds.includes(c.id);
    const used = !inHand;
    const disabled = used || banned;
    const sel = selectedId === c.id ? 'selected' : '';
    const outcomeBlock = banned
      ? `<div class="outcome"><div class="row"><span class="tag lose">SEALED</span><span class="txt">Struck down by a curse — unusable this round.</span></div></div>`
      : `<div class="outcome">
          <div class="row"><span class="tag win">WIN</span><span class="txt">${winOutcomeText(c, player)}</span></div>
          <div class="row"><span class="tag lose">LOSE</span><span class="txt">${c.loseOutcome}</span></div>
        </div>`;
    return `
      <div class="card ${cardClass(c)} ${sel} ${used?'used':''} ${banned?'banned':''}" onclick="${disabled?'':`selectCard(${idx}, '${c.id}')`}">
        <span class="icon">${c.icon}</span>
        <span class="cname">${c.name}</span>
        <div class="stats">${statsHtml(c, fk)}</div>
        ${outcomeBlock}
      </div>
    `;
  }).join('');

  return `
    ${renderHUD()}
    ${renderFieldCard()}
    ${renderEnemyPeek()}
    <div class="panel">
      <p class="hand-title">${player.name}'s Hand — choose one card, face down</p>
      <div class="hand-grid">${cards}</div>
      <button class="primary" ${selectedId?'':'disabled'} onclick="confirmSelection(${idx})">Commit This Card</button>
    </div>
  `;
}

function selectCard(idx, cardId){
  sfxClick();
  state.selections[idx] = cardId;
  render();
}

function confirmSelection(idx){
  sfxSelect();
  state.players[idx].bannedCardIds = [];
  state.phase = 'ai-thinking';
  render();
  setTimeout(()=>{
    const aiPlayer = state.players[AI_IDX];
    const aiCardId = aiChooseCard(aiPlayer, currentFieldKey(), state.aiChar);
    state.selections[AI_IDX] = aiCardId;
    state.phase = 'revealing';
    render();
  }, 700);
}

function renderAiThinking(){
  const ai = state.aiChar;
  return `
    ${renderHUD()}
    ${renderFieldCard()}
    <div class="panel pass-screen">
      <div class="glyph">${ai.icon}</div>
      <h2>${ai.name} deliberates…</h2>
      <p>A card is chosen in silence, and held face down.</p>
    </div>
  `;
}

function renderRevealing(){
  return `
    ${renderHUD()}
    ${renderFieldCard()}
    <div class="panel pass-screen">
      <div class="glyph">⚔️</div>
      <h2>Both cards are chosen</h2>
      <p>Two fates lie face down upon the ${currentField().name}.</p>
      <button class="primary" onclick="resolveRound()">Reveal</button>
    </div>
  `;
}

function renderRevealed(){
  const r = state.lastResolution;
  const p1=state.players[0], p2=state.players[1];
  const isLast = state.round >= MAX_ROUNDS;
  const BIG_ABILITIES = ['STEAL2','LOSS_BECOMES_WIN','SPY','NEGATE_STEAL','BAN_NEXT_2','COIN_FLIP'];
  const isBig = BIG_ABILITIES.includes(r.c1.ability) || BIG_ABILITIES.includes(r.c2.ability);
  return `
    ${renderHUD()}
    <div class="panel">
      <p class="hand-title">Battlefield: ${r.field.icon} ${r.field.name} — ${r.field.desc}</p>
      <div class="reveal-row">
        <div class="reveal-slot">
          <div class="pname">${p1.name}</div>
          <div class="reveal-card ${cardClass(r.c1)}">
            <span class="icon">${r.c1.icon}</span>
            <div class="cname">${r.c1.name}</div>
            <div class="stats">${statsHtml(r.c1, r.fieldKey)}</div>
          </div>
        </div>
        <div class="vs">VS</div>
        <div class="reveal-slot">
          <div class="pname">${p2.name}</div>
          <div class="reveal-card ${cardClass(r.c2)}">
            <span class="icon">${r.c2.icon}</span>
            <div class="cname">${r.c2.name}</div>
            <div class="stats">${statsHtml(r.c2, r.fieldKey)}</div>
          </div>
        </div>
      </div>
      <div class="log-box ${isBig?'big-effect':''}">${r.log.join('<br>')}</div>
      <div class="sigil-diff">
        <div><div class="c-name">${p1.name}</div><div class="c-val">🩸 ${r.before[0]} → ${r.after[0]}</div></div>
        <div><div class="c-name">${p2.name}</div><div class="c-val">🩸 ${r.before[1]} → ${r.after[1]}</div></div>
      </div>
      ${renderReclaimBlock()}
      <button class="primary" ${state.pendingReclaim?'disabled':''} onclick="nextRound()">${isLast?'See the Final Reckoning':'Next Round'}</button>
    </div>
  `;
}

function renderReclaimBlock(){
  if(!state.pendingReclaim) return '';
  const owner = state.players[state.pendingReclaim.ownerIdx];
  const options = state.pendingReclaim.options.map(id=>{
    const c = getCard(id);
    return `
      <div class="card ${cardClass(c)}" onclick="doReclaim('${c.id}')">
        <span class="icon">${c.icon}</span>
        <span class="cname">${c.name}</span>
        <div class="stats">${statsHtml(c, currentFieldKey())}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="panel" style="border-color:var(--blood-soft);">
      <p class="hand-title">⚗️ ${owner.name} — choose a spent card to reclaim</p>
      <div class="hand-grid">${options}</div>
      <button class="ghost" onclick="skipReclaim()">Let it rest</button>
    </div>
  `;
}

function renderEnd(){
  const p1=state.players[0], p2=state.players[1];
  const ai = state.aiChar;
  let winnerText, story;
  if(p1.crystals===p2.crystals){
    winnerText = 'A Draw';
    story = DRAW_STORY;
  } else if(p1.crystals>p2.crystals){
    winnerText = p1.name + ' is Victorious';
    story = ai.winStory;
  } else {
    winnerText = p2.name + ' is Victorious';
    story = ai.loseStory;
  }
  return `
    <div class="panel end-screen">
      <div class="eyebrow">The Final Reckoning</div>
      <h2 style="color:var(--bone-soft); margin:6px 0; font-weight:600;">All ${MAX_ROUNDS} Rounds Complete</h2>
      <div class="winner-name">🩸 ${winnerText}</div>
      <div class="final-scores">
        <div><div>${p1.name}</div><div class="val">🩸${p1.crystals}</div></div>
        <div><div>${p2.name}</div><div class="val">🩸${p2.crystals}</div></div>
      </div>
      <div class="story-panel">
        <span class="story-glyph">${ai.icon}</span>
        <p>${story}</p>
      </div>
      <button class="primary" onclick="goToTitle()">Return to Title</button>
    </div>
  `;
}

function goToTitle(){
  stopBGM();
  state = null;
  render();
}

render();

</script>

const HAND_LABELS = {guu:'グー', choki:'チョキ', paa:'パー'};
const HUMAN_IDX = 0, AI_IDX = 1;

/* ============ 状態 ============ */
let state = null;
let pendingPlayerName = '';
let pendingAiChar = null;

/* ============ 音声（外部ファイル無し・自前生成） ============ */
let audioCtx = null;
let masterGain = null;
let bgmNodes = null;
let bgmTimer = null;
let bgmThudTimer = null;
let echoNode = null, echoFeedback = null, echoWet = null;
let audioMuted = false;

function ensureAudio(){
  if(!audioCtx){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = audioMuted ? 0 : 0.6;
      masterGain.connect(audioCtx.destination);
    }catch(e){ audioCtx = null; return; }
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
}

function toggleMute(){
  audioMuted = !audioMuted;
  if(audioCtx && masterGain){
    masterGain.gain.setTargetAtTime(audioMuted?0:0.6, audioCtx.currentTime, 0.05);
  }
  render();
}

function blip(freq, dur, type, peak, delay){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak||0.3, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(t0); osc.stop(t0+dur+0.05);
}

function noiseBurst(dur, peak, delay, cutoff){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(peak||0.2, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  const filter = audioCtx.createBiquadFilter();
  filter.type='lowpass'; filter.frequency.value = cutoff||1800;
  src.connect(filter); filter.connect(gain); gain.connect(masterGain);
  src.start(t0);
}

function sfxClick(){ ensureAudio(); blip(220, 0.08, 'square', 0.14); }
function sfxSelect(){ ensureAudio(); blip(330, 0.1, 'triangle', 0.16); }
function sfxReveal(){ ensureAudio(); noiseBurst(0.35, 0.18); blip(140,0.3,'sawtooth',0.08,0.02); }
function sfxWin(){ ensureAudio(); blip(392,0.16,'triangle',0.2,0); blip(523,0.2,'triangle',0.2,0.1); blip(659,0.28,'triangle',0.22,0.2); }
function sfxCurse(){ ensureAudio(); blip(110,0.4,'sawtooth',0.16,0); blip(116,0.4,'sawtooth',0.12,0.03); noiseBurst(0.25,0.1,0.04); }
function sfxStorm(){ ensureAudio(); noiseBurst(0.7,0.16,0,900); blip(70,0.6,'sawtooth',0.09,0.05); }
function sfxCoin(){ ensureAudio(); blip(880,0.08,'square',0.13,0); blip(1108,0.1,'square',0.13,0.07); }

/* ---- BGM：低音ドローン＋呼吸するフィルター＋不穏な鐘（エコー付き）＋遠くの鼓動 ---- */
function ensureEcho(){
  if(echoNode || !audioCtx) return;
  echoNode = audioCtx.createDelay(2.5);
  echoNode.delayTime.value = 0.6;
  echoFeedback = audioCtx.createGain();
  echoFeedback.gain.value = 0.36;
  echoWet = audioCtx.createGain();
  echoWet.gain.value = 0.55;
  echoNode.connect(echoFeedback);
  echoFeedback.connect(echoNode);
  echoNode.connect(echoWet);
  echoWet.connect(masterGain);
}

function bellTone(freq, dur, peak, delay){
  if(!audioCtx) return;
  ensureEcho();
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0+0.06);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain);
  gain.connect(masterGain);
  if(echoNode) gain.connect(echoNode);
  osc.start(t0); osc.stop(t0+dur+0.15);
}

function startBGM(){
  ensureAudio();
  if(!audioCtx || bgmNodes) return;
  ensureEcho();

  const droneRoot  = audioCtx.createOscillator();
  const droneRoot2 = audioCtx.createOscillator();
  const droneFifth = audioCtx.createOscillator();
  const fifthGain  = audioCtx.createGain();
  const filter     = audioCtx.createBiquadFilter();
  const droneGain  = audioCtx.createGain();

  filter.type = 'lowpass';
  filter.frequency.value = 380;
  droneRoot.type='sine';  droneRoot.frequency.value=41.20;
  droneRoot2.type='sine'; droneRoot2.frequency.value=41.45;
  droneFifth.type='sine'; droneFifth.frequency.value=61.74;
  fifthGain.gain.value = 0.4;
  droneGain.gain.value = 0.07;

  droneRoot.connect(filter);
  droneRoot2.connect(filter);
  droneFifth.connect(fifthGain); fifthGain.connect(filter);
  filter.connect(droneGain); droneGain.connect(masterGain);

  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.type='sine'; lfo.frequency.value = 0.045;
  lfoGain.gain.value = 150;
  lfo.connect(lfoGain); lfoGain.connect(filter.frequency);

  droneRoot.start(); droneRoot2.start(); droneFifth.start(); lfo.start();
  bgmNodes = {droneRoot, droneRoot2, droneFifth, fifthGain, filter, droneGain, lfo, lfoGain};
  scheduleBell();
  scheduleThud();
}

function scheduleBell(){
  if(!bgmNodes) return;
  const scale = [164.81,174.61,196.00,220.00,246.94,261.63,293.66];
  const freq = scale[Math.floor(Math.random()*scale.length)] / 2;
  bellTone(freq, 3.2, 0.055);
  bgmTimer = setTimeout(scheduleBell, 3800+Math.random()*3800);
}

function scheduleThud(){
  if(!bgmNodes) return;
  blip(38, 1.1, 'sine', 0.08);
  noiseBurst(0.5, 0.05, 0.05, 300);
  bgmThudTimer = setTimeout(scheduleThud, 9000+Math.random()*9000);
}

function stopBGM(){
  if(bgmTimer) clearTimeout(bgmTimer);
  if(bgmThudTimer) clearTimeout(bgmThudTimer);
  bgmTimer = null; bgmThudTimer = null;
  if(bgmNodes){
    try{
      bgmNodes.droneRoot.stop(); bgmNodes.droneRoot2.stop();
      bgmNodes.droneFifth.stop(); bgmNodes.lfo.stop();
    }catch(e){}
    bgmNodes = null;
  }
}

function aiDraftDeck(aiChar){
  const scored = CARD_DEFS.map(c=>{
    const statScore = c.power + c.wisdom;
    const lossScore = (LOSS_VALUE[c.ability] || 0) * aiChar.lossWeight;
    const favBonus = abilityFavorBonus(c.ability, aiChar);
    const score = statScore*0.6 + lossScore + favBonus + Math.random()*4;
    return {id:c.id, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0, DECK_SIZE).map(s=>s.id);
}

function newGame(name1, aiChar, playerDeck){
  const aiDeck = aiDraftDeck(aiChar);
  const fieldSeq = [];
  for(let i=0;i<MAX_ROUNDS;i++){
    fieldSeq.push(FIELD_POOL[Math.floor(Math.random()*FIELD_POOL.length)]);
  }
  state = {
    phase:'janken',
    round:1,
    fieldSeq,
    forcedNext:null,
    firstPlayer:null,
    jankenMessage:null,
    aiChar,
    players:[
      {name:name1||'挑戦者', crystals:0, deck:playerDeck.slice(), hand:playerDeck.slice(), bannedCardIds:[], destroyedCards:[], bonusNextWin:false, canSeeOpponentHand:false},
      {name:aiChar.name, crystals:0, deck:aiDeck.slice(), hand:aiDeck.slice(), bannedCardIds:[], destroyedCards:[], bonusNextWin:false, canSeeOpponentHand:false},
    ],
    selections:[null,null],
    lastResolution:null,
    pendingReclaim:null,
  };
  render();
}

function currentField(){ return FIELDS[state.fieldSeq[state.round-1]]; }
function currentFieldKey(){ return state.fieldSeq[state.round-1]; }
function getCard(id){ return CARD_DEFS.find(c=>c.id===id); }

/* ============ 解決ロジック ============ */
function awardWin(winner, log, note){
  let amount = 1;
  if(winner.bonusNextWin){
    amount = 2;
    winner.bonusNextWin = false;
    log.push(`👑 不死の守護者の加護により、報酬が2倍になった。`);
  }
  winner.crystals += amount;
  log.unshift(`<span class="win-line">${note}（血印+${amount}）</span>`);
  if(winner === state.players[HUMAN_IDX]) sfxWin();
}

function resolveRound(){
  sfxReveal();
  const p1 = state.players[0], p2 = state.players[1];
  const c1 = getCard(state.selections[0]);
  const c2 = getCard(state.selections[1]);
  const fieldKey = currentFieldKey();
  const field = FIELDS[fieldKey];
  const log = [];
  let crystalBefore = [p1.crystals, p2.crystals];
  let reclaimInfo = null;
  const hadScoutBefore = [p1.canSeeOpponentHand, p2.canSeeOpponentHand];
  let actualWinnerIdx = null;

  if(fieldKey === 'storm'){
    p1.crystals += 1; p2.crystals += 1;
    log.push('灰燼の嵐が戦場を飲み込んだ。両者ともに血印+1。');
    sfxStorm();
  } else {
    const diff = field.compare(c1, c2);
    if(diff === 0){
      const fpIdx = state.firstPlayer;
      const fp = state.players[fpIdx];
      const fpCard = fpIdx===0? c1:c2;
      actualWinnerIdx = fpIdx;
      log.push(`両者譲らず、同点。しかし先制の儀を制した${fp.name}が主導権を発動する。`);
      awardWin(fp, log, `${fpCard.icon} ${fp.name}の${fpCard.name}が、先制の権利で対決を制した`);
    } else {
      let winnerIdx = diff>0 ? 0 : 1;
      let loserIdx = diff>0 ? 1 : 0;
      let winner = state.players[winnerIdx];
      let loser = state.players[loserIdx];
      let winnerCard = winnerIdx===0? c1:c2;
      let loserCard = loserIdx===0? c1:c2;

      if(loserCard.ability === 'LOSS_BECOMES_WIN'){
        actualWinnerIdx = loserIdx;
        log.push(`👻 ${loserCard.name}が結末を書き換えた。敗北は勝利に変わる。`);
        log.push(`<span class="curse-voice">「${loserCard.curseVoice}」</span>`);
        sfxCurse();
        awardWin(loser, log, `${loser.name}の${loserCard.name}が己の運命を上書きした`);
      } else {
        actualWinnerIdx = winnerIdx;
        let winnerGains = true;
        if(winnerCard.ability === 'SPY'){
          winnerGains = false;
          log.push(`🎭 ${winnerCard.name}は勝利しても素性を明かさない。血印は見送られた。`);
        }
        switch(loserCard.ability){
          case 'GAIN1':
            loser.crystals += 1;
            log.push(`${loserCard.icon} ${loserCard.name}の力で、${loser.name}は血印+1を得た。`);
            break;
          case 'GAIN2':
            loser.crystals += 2;
            log.push(`${loserCard.icon} ${loserCard.name}の力で、${loser.name}は血印+2を得た。勝つよりも得だった。`);
            break;
          case 'SPY':
            loser.crystals += 3;
            log.push(`🎭 ${loserCard.name}が正体を明かし、大きな見返り（血印+3）を得た。`);
            break;
          case 'STEAL1':
            if(winner.crystals>0){ winner.crystals-=1; loser.crystals+=1; }
            log.push(`${loserCard.icon} ${loserCard.name}が${winner.name}の血印を1奪った。`);
            break;
          case 'FORCE_FIELD':
            state.forcedNext = loserCard.forceField;
            log.push(`${loserCard.icon} ${loserCard.name}の力で、次の戦場は「${FIELDS[loserCard.forceField].name}」に定められた。`);
            break;
          case 'NEGATE':
            winnerGains = false;
            log.push(`${loserCard.icon} ${loserCard.name}の抵抗により、${winner.name}の勝利は打ち消された。`);
            break;
          case 'SCOUT':
            loser.canSeeOpponentHand = true;
            log.push(`${loserCard.icon} ${loserCard.name}が${winner.name}の手札すべてに狙いをつけた——${loser.name}が次に敗れるまで、見えたままになる。`);
            break;
          case 'SUM_BONUS':{
            const loserSum = loserCard.power + loserCard.wisdom;
            const winnerSum = winnerCard.power + winnerCard.wisdom;
            if(loserSum > winnerSum){
              loser.crystals += 1;
              log.push(`${loserCard.icon} ${loserCard.name}は合計値(${loserSum})で上回っていた。${loser.name}は血印+1。`);
            } else {
              log.push(`${loserCard.icon} ${loserCard.name}は合計値(${loserSum})でも及ばなかった(相手${winnerSum})。`);
            }
            break;
          }
          case 'BAN_NEXT':{
            const pool = winner.hand.filter(id=>id!==winnerCard.id);
            if(pool.length>1){
              const banId = pool[Math.floor(Math.random()*pool.length)];
              winner.bannedCardIds.push(banId);
              const banCard = getCard(banId);
              log.push(`${loserCard.icon} ${loserCard.name}の凶刃が、${winner.name}の「${banCard.name}」を次ラウンド封じた。`);
            } else {
              log.push(`${loserCard.icon} ${loserCard.name}が狙いを定めたが、これ以上封じれば相手の手が完全に止まってしまう――刃を収めた。`);
            }
            break;
          }
          case 'BAN_NEXT_2':{
            const pool = winner.hand.filter(id=>id!==winnerCard.id);
            if(pool.length>2){
              const shuffled = pool.slice().sort(()=>Math.random()-0.5);
              const banIds = shuffled.slice(0,2);
              banIds.forEach(id=>winner.bannedCardIds.push(id));
              const names = banIds.map(id=>getCard(id).name).join('」と「');
              log.push(`${loserCard.icon} ${loserCard.name}の疫病が広がり、${winner.name}の「${names}」を次ラウンド封じた。`);
            } else {
              log.push(`${loserCard.icon} ${loserCard.name}が広がろうとしたが、${winner.name}の手札が少なすぎて病が根付かなかった。`);
            }
            break;
          }
          case 'STEAL2':{
            const amt = Math.min(2, winner.crystals);
            winner.crystals -= amt; loser.crystals += amt;
            log.push(`${loserCard.icon} ${loserCard.name}が${winner.name}の血印を${amt}奪った。`);
            break;
          }
          case 'GAIN_PER_ROUND':
            loser.crystals += state.round;
            log.push(`${loserCard.icon} ${loserCard.name}の力で、${loser.name}はこれまでのラウンド数と同じ血印+${state.round}を得た。`);
            break;
          case 'COIN_FLIP':
            if(Math.random() < 0.5){
              loser.crystals += 3;
              log.push(`${loserCard.icon} ${loserCard.name}が運命のコインを投げた——表。${loser.name}は血印+3を得た。`);
              sfxCoin();
            } else {
              log.push(`${loserCard.icon} ${loserCard.name}が運命のコインを投げた——裏。何も起こらなかった。`);
            }
            break;
          case 'NEGATE_STEAL':
            winnerGains = false;
            if(winner.crystals>0){ winner.crystals -= 1; loser.crystals += 1; }
            log.push(`${loserCard.icon} ${loserCard.name}が勝利そのものを封じ、さらに血印を1奪った。`);
            break;
          case 'RECLAIM':{
            const usedIds = loser.deck
              .filter(id => !loser.hand.includes(id) && id !== loserCard.id && !loser.destroyedCards.includes(id));
            if(usedIds.length>0){
              if(loserIdx === AI_IDX){
                const pickId = usedIds[Math.floor(Math.random()*usedIds.length)];
                loser.hand.push(pickId);
                log.push(`${loserCard.icon} ${loserCard.name}が「${getCard(pickId).name}」を静かに墓場から呼び戻した。`);
              } else {
                reclaimInfo = {ownerIdx: loserIdx, options: usedIds};
                log.push(`${loserCard.icon} ${loserCard.name}が使用済みのカードを1枚、手札に呼び戻そうとしている…`);
              }
            } else {
              log.push(`${loserCard.icon} ${loserCard.name}が力を振るったが、呼び戻せるカードがなかった。`);
            }
            break;
          }
          case 'BONUS_NEXT_WIN':
            loser.bonusNextWin = true;
            log.push(`${loserCard.icon} ${loserCard.name}の誓いにより、${loser.name}は次の勝利で倍の恩恵を受ける。`);
            break;
          default:
            break;
        }
        log.push(`<span class="curse-voice">「${loserCard.curseVoice}」</span>`);
        sfxCurse();
        if(winnerGains){
          awardWin(winner, log, `${winnerCard.icon} ${winner.name}の${winnerCard.name}が「${field.name}」を制した`);
        } else {
          log.unshift(`<span class="win-line">${winnerCard.icon} ${winner.name}の${winnerCard.name}が優勢だったが…</span>`);
        }
      }
    }
  }

  p1.hand = p1.hand.filter(id=>id!==c1.id);
  p2.hand = p2.hand.filter(id=>id!==c2.id);

  if(actualWinnerIdx !== null){
    [0,1].forEach(idx=>{
      if(hadScoutBefore[idx] && actualWinnerIdx !== idx){
        state.players[idx].canSeeOpponentHand = false;
        log.push(`🏹 看破の眼が閉じた——${state.players[idx].name}の連勝はここで途切れた。`);
      }
    });
  }

  state.lastResolution = {
    c1, c2, field, fieldKey, log,
    before:crystalBefore,
    after:[p1.crystals, p2.crystals],
  };
  state.pendingReclaim = reclaimInfo;
  state.phase = 'revealed';
  render();
}

function doReclaim(cardId){
  const owner = state.players[state.pendingReclaim.ownerIdx];
  if(!owner.hand.includes(cardId)) owner.hand.push(cardId);
  state.pendingReclaim = null;
  render();
}
function skipReclaim(){
  state.pendingReclaim = null;
  render();
}

function nextRound(){
  state.round += 1;
  state.selections = [null,null];
  if(state.round > MAX_ROUNDS){
    state.phase = 'end';
    render();
    return;
  }
  if(state.forcedNext){
    state.fieldSeq[state.round-1] = state.forcedNext;
    state.forcedNext = null;
  }
  state.phase = 'selecting';
  render();
}

/* ============ AI ============ */
const LOSS_VALUE = {
  NONE:0, FORCE_FIELD:1, SCOUT:1.5, SUM_BONUS:0.5, STEAL1:2,
  BAN_NEXT:1, RECLAIM:1, NEGATE:1.5, GAIN1:1, GAIN2:2,
  BONUS_NEXT_WIN:1.5, LOSS_BECOMES_WIN:3, SPY:3,
  STEAL2:3, BAN_NEXT_2:1.8, GAIN_PER_ROUND:2, COIN_FLIP:1.5, NEGATE_STEAL:2.5,
};

function fieldStatScore(c, fieldKey){
  if(fieldKey==='plains') return c.power;
  if(fieldKey==='library') return c.wisdom;
  if(fieldKey==='labyrinth') return c.power + c.wisdom;
  if(fieldKey==='mirror') return 8 - c.power;
  if(fieldKey==='widowveil') return 8 - c.wisdom;
  if(fieldKey==='feasthall') return Math.max(c.power, c.wisdom);
  if(fieldKey==='gallows') return 8 - Math.abs(c.power - c.wisdom);
  return 4; // storm
}

function abilityFavorBonus(ability, aiChar){
  return (aiChar.favoredAbilities && aiChar.favoredAbilities.includes(ability)) ? 2.5 : 0;
}

function aiChooseCard(aiPlayer, fieldKey, aiChar){
  const candidates = aiPlayer.hand.filter(id => !aiPlayer.bannedCardIds.includes(id));
  const pool = candidates.length>0 ? candidates : aiPlayer.hand;
  const scored = pool.map(id=>{
    const c = getCard(id);
    const statScore = fieldStatScore(c, fieldKey);
    const lossScore = (LOSS_VALUE[c.ability] || 0) * aiChar.lossWeight;
    const favBonus = abilityFavorBonus(c.ability, aiChar);
    let score = statScore + lossScore + favBonus;
    score += Math.random()*aiChar.noise;
    return {id, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  const topN = scored.slice(0, Math.min(3, scored.length));
  const pick = topN[Math.floor(Math.random()*topN.length)];
  return pick.id;
}

/* ============ レンダリング ============ */
function render(){
  const app = document.getElementById('app');
  if(!state || state.phase==='title'){ app.innerHTML = renderTitle(); return; }
  if(state.phase==='select-ai'){ app.innerHTML = renderSelectAI(); return; }
  if(state.phase==='draft'){ app.innerHTML = renderDraft(); return; }
  if(state.phase==='janken'){ app.innerHTML = renderJanken(); return; }
  if(state.phase==='selecting'){ app.innerHTML = renderSelecting(); return; }
  if(state.phase==='ai-thinking'){ app.innerHTML = renderAiThinking(); return; }
  if(state.phase==='revealing'){ app.innerHTML = renderRevealing(); return; }
  if(state.phase==='revealed'){ app.innerHTML = renderRevealed(); return; }
  if(state.phase==='end'){ app.innerHTML = renderEnd(); return; }
}

function renderTitle(){
  return `
    <div class="eyebrow">Card Duel of Power &amp; Wisdom</div>
    <h1 class="title-main"><span class="title-jp">血印</span></h1>
    <p class="title-en">-BLOODSIGIL-</p>
    <p class="title-edition">五つの魂</p>
    <p class="title-sub">二人の決闘者。20枚の呪われたカード。すべての敗北には、支払うだけの価値がある。</p>

    <div class="panel" style="border-color:var(--lore-soft);">
      <p style="margin:0; font-style:italic; color:var(--ink); font-size:14.5px; line-height:2;">
        遥か昔、二十の魂がこのカードに縛られた――勝たせてくれる者にのみ従う呪いをかけられて。
        だが魂が従順でいられるのは、勝っている間だけ。あなたがそれを負けさせた瞬間、
        支配の手綱は緩み、魂は己の渇望のままに動き出す。
        <b style="color:var(--bone-soft); font-style:normal;">それこそが、「能力」と呼ばれるものの正体だ。</b>
        その中から十二の魂を選び、傍らに置くがいい。残りは眠らせたまま。
      </p>
    </div>

    <div class="panel">
      <h3 style="margin-top:0;color:var(--bone-soft);">遊び方</h3>
      <div class="rule-line"><span class="rule-mark">壱</span><span>決闘前に、${CARD_DEFS.length}枚のカードプールから${DECK_SIZE}枚を選び、自分だけのデッキを組む。相手も自分の好みで、秘密裏にデッキを組んでいる。</span></div>
      <div class="rule-line"><span class="rule-mark">弐</span><span>毎ラウンド、戦場カードが「どちらの数値で競うか」を決める（力・知・合計・逆転・引き分けの5種）。</span></div>
      <div class="rule-line"><span class="rule-mark">参</span><span>お互い手札から1枚を伏せて選び、同時に公開。戦場の理に従い勝敗が決まる。</span></div>
      <div class="rule-line"><span class="rule-mark">四</span><span><b style="color:var(--bone-soft)">勝てば血印を獲得する。</b>だが<b style="color:var(--blood-soft)">負ければ、そのカード固有の能力が目覚める</b>――時には勝利より価値がある。「わざと弱いカードで負けて能力を狙う」のも立派な戦略だ。</span></div>
      <div class="rule-line"><span class="rule-mark">伍</span><span>全${MAX_ROUNDS}ラウンド終了時、血印が多い方の勝利。</span></div>
      <div class="rule-line"><span class="rule-mark">陸</span><span>対戦前にじゃんけんで<b style="color:var(--bone-soft)">先制</b>を決める。先制は同点の対決を制する権利を得る。</span></div>
    </div>

    <div class="panel">
      <h3 style="margin-top:0;color:var(--bone-soft);">あなたの名前</h3>
      <div class="name-row">
        <input id="p1name" placeholder="挑戦者" maxlength="12">
      </div>
      <button class="primary" onclick="startFromTitle()">対戦相手を選ぶ</button>
    </div>
    <div class="footer-note">AIと1対1で対戦する一人用モードです。</div>
  `;
}

function startFromTitle(){
  ensureAudio(); startBGM(); sfxClick();
  pendingPlayerName = document.getElementById('p1name').value.trim();
  state = {phase:'select-ai'};
  render();
}

function renderSelectAI(){
  const cards = AI_CHARACTERS.map(ch=>`
    <div class="ai-card" onclick="chooseAI('${ch.id}')">
      <span class="icon">${ch.icon}</span>
      <div class="ai-name">${ch.name}</div>
      <p class="ai-blurb">${ch.blurb}</p>
    </div>
  `).join('');
  return `
    <div class="eyebrow">対戦相手を選ぶ</div>
    <h1 class="title-main" style="font-size:24px;"><span class="title-jp">誰と戦う？</span></h1>
    <div class="ai-grid">${cards}</div>
    <div class="footer-note">それぞれの魂が、呪いとの向き合い方を異にする。</div>
  `;
}

function chooseAI(id){
  sfxClick();
  pendingAiChar = AI_CHARACTERS.find(c=>c.id===id);
  state = {phase:'draft', draftSelection:[]};
  render();
}

function renderDraft(){
  const sel = state.draftSelection;
  const count = sel.length;
  const cards = CARD_DEFS.map(c=>{
    const isSel = sel.includes(c.id);
    const disabled = !isSel && count>=DECK_SIZE;
    return `
      <div class="card ${cardClass(c)} ${isSel?'selected':''} ${disabled?'used':''}" onclick="${disabled?'':`toggleDraftCard('${c.id}')`}">
        <span class="icon">${c.icon}</span>
        <span class="cname">${c.name}</span>
        <div class="stats">${statsHtml(c)}</div>
        <div class="outcome">
          <div class="row"><span class="tag win">勝利</span><span class="txt">${winOutcomeText(c, null)}</span></div>
          <div class="row"><span class="tag lose">敗北</span><span class="txt">${c.loseOutcome}</span></div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="eyebrow">デッキをドラフトする</div>
    <h1 class="title-main" style="font-size:22px;"><span class="title-jp">${CARD_DEFS.length}枚から${DECK_SIZE}枚を選べ</span></h1>
    <p class="title-sub" style="margin-bottom:14px;">${pendingAiChar.name}は、既に自分の手札を秘密裏にドラフトし終えている。</p>
    <div class="draft-counter">選択中：<b>${count} / ${DECK_SIZE}</b></div>
    <div class="hand-grid">${cards}</div>
    <button class="primary" ${count===DECK_SIZE?'':'disabled'} onclick="confirmDraft()">このデッキで決闘へ</button>
  `;
}

function toggleDraftCard(id){
  sfxClick();
  const sel = state.draftSelection;
  const i = sel.indexOf(id);
  if(i>=0) sel.splice(i,1);
  else if(sel.length<DECK_SIZE) sel.push(id);
  render();
}

function confirmDraft(){
  sfxSelect();
  newGame(pendingPlayerName, pendingAiChar, state.draftSelection);
}

function renderHUD(){
  const p1=state.players[0], p2=state.players[1];
  return `
    <div class="hud">
      <div class="round-badge">ROUND ${state.round} / ${MAX_ROUNDS}</div>
      <div class="sigil-mini">
        <span>${p1.name} 🩸<span>${p1.crystals}</span></span>
        <span>${p2.name} 🩸<span>${p2.crystals}</span></span>
      </div>
      <button class="mute-btn" onclick="toggleMute()">${audioMuted?'🔇':'🔊'}</button>
    </div>
  `;
}

function renderFieldCard(){
  const f = currentField();
  return `
    <div class="field-card ${f.cls}">
      <span class="field-icon">${f.icon}</span>
      <p class="field-name">${f.name}</p>
      <p class="field-desc">${f.desc}</p>
    </div>
  `;
}

function renderJanken(){
  const p1 = state.players[HUMAN_IDX];
  const ai = state.aiChar;
  return `
    <div class="panel pass-screen">
      <div class="glyph">${ai.icon}</div>
      <h2>先制の儀</h2>
      <p>${p1.name} 対 ${ai.name}。勝った方が「先制」となり、以後の同点の対決を制する権利を得る。</p>
      <div class="janken-row">
        <button onclick="playJanken('guu')">✊<br>グー</button>
        <button onclick="playJanken('choki')">✌️<br>チョキ</button>
        <button onclick="playJanken('paa')">✋<br>パー</button>
      </div>
      ${state.jankenMessage ? `<div class="log-box" style="margin-top:16px;">${state.jankenMessage}</div>` : ''}
      ${state.firstPlayer!==null ? `<button class="primary" style="margin-top:14px;" onclick="beginMatch()">決闘を始める</button>` : ''}
    </div>
  `;
}

function playJanken(choice){
  sfxClick();
  const ai = state.aiChar;
  const aiChoice = ['guu','choki','paa'][Math.floor(Math.random()*3)];
  const beats = {guu:'choki', choki:'paa', paa:'guu'};
  let msg = `あなた: ${HAND_ICONS[choice]}${HAND_LABELS[choice]} 　vs　 ${ai.name}: ${HAND_ICONS[aiChoice]}${HAND_LABELS[aiChoice]}<br>`;
  if(choice===aiChoice){
    msg += 'あいこ。もう一度。';
    state.firstPlayer = null;
  } else if(beats[choice]===aiChoice){
    msg += `<span class="win-line">あなたの勝ち！先制はあなたのもの。</span>`;
    state.firstPlayer = HUMAN_IDX;
    sfxWin();
  } else {
    msg += `<span class="win-line">${ai.name}の勝ち。先制は${ai.name}のもの。</span>`;
    state.firstPlayer = AI_IDX;
  }
  state.jankenMessage = msg;
  render();
}

function beginMatch(){
  state.phase = 'selecting';
  render();
}

function renderEnemyPeek(){
  const human = state.players[HUMAN_IDX];
  if(!human.canSeeOpponentHand) return '';
  const ai = state.players[AI_IDX];
  const cardsHtml = ai.hand.map(id=>{
    const c = getCard(id);
    return `
      <div class="peek-card">
        <span class="icon">${c.icon}</span>
        <span class="pname2">${c.name}</span>
      </div>
    `;
  }).join('') || `<p style="color:var(--ink-dim); font-size:13px; margin:0;">相手の手札は空だ。</p>`;
  return `
    <div class="panel" style="border-color:var(--lore-soft);">
      <p class="hand-title">🏹 看破済み — ${ai.name}の残り手札</p>
      <div class="peek-row">${cardsHtml}</div>
    </div>
  `;
}

function renderSelecting(){
  const idx = HUMAN_IDX;
  const player = state.players[idx];
  const selectedId = state.selections[idx];
  const fk = currentFieldKey();
  const cards = player.deck.map(id=>getCard(id)).map(c=>{
    const inHand = player.hand.includes(c.id);
    const banned = inHand && player.bannedCardIds.includes(c.id);
    const used = !inHand;
    const disabled = used || banned;
    const sel = selectedId === c.id ? 'selected' : '';
    const outcomeBlock = banned
      ? `<div class="outcome"><div class="row"><span class="tag lose">封印</span><span class="txt">呪いに狙われ、今回は使用できない。</span></div></div>`
      : `<div class="outcome">
          <div class="row"><span class="tag win">勝利</span><span class="txt">${winOutcomeText(c, player)}</span></div>
          <div class="row"><span class="tag lose">敗北</span><span class="txt">${c.loseOutcome}</span></div>
        </div>`;
    return `
      <div class="card ${cardClass(c)} ${sel} ${used?'used':''} ${banned?'banned':''}" onclick="${disabled?'':`selectCard(${idx}, '${c.id}')`}">
        <span class="icon">${c.icon}</span>
        <span class="cname">${c.name}</span>
        <div class="stats">${statsHtml(c, fk)}</div>
        ${outcomeBlock}
      </div>
    `;
  }).join('');

  return `
    ${renderHUD()}
    ${renderFieldCard()}
    ${renderEnemyPeek()}
    <div class="panel">
      <p class="hand-title">${player.name} の手札 — 1枚を選んで伏せてください</p>
      <div class="hand-grid">${cards}</div>
      <button class="primary" ${selectedId?'':'disabled'} onclick="confirmSelection(${idx})">このカードで戦う</button>
    </div>
  `;
}

function selectCard(idx, cardId){
  sfxClick();
  state.selections[idx] = cardId;
  render();
}

function confirmSelection(idx){
  sfxSelect();
  state.players[idx].bannedCardIds = [];
  state.phase = 'ai-thinking';
  render();
  setTimeout(()=>{
    const aiPlayer = state.players[AI_IDX];
    const aiCardId = aiChooseCard(aiPlayer, currentFieldKey(), state.aiChar);
    state.selections[AI_IDX] = aiCardId;
    state.phase = 'revealing';
    render();
  }, 700);
}

function renderAiThinking(){
  const ai = state.aiChar;
  return `
    ${renderHUD()}
    ${renderFieldCard()}
    <div class="panel pass-screen">
      <div class="glyph">${ai.icon}</div>
      <h2>${ai.name}が思案している…</h2>
      <p>カードを1枚、静かに選んでいる。</p>
    </div>
  `;
}

function renderRevealing(){
  return `
    ${renderHUD()}
    ${renderFieldCard()}
    <div class="panel pass-screen">
      <div class="glyph">⚔️</div>
      <h2>両者、選び終えた</h2>
      <p>伏せられた2枚の運命が、${currentField().name}に横たわる。</p>
      <button class="primary" onclick="resolveRound()">公開する</button>
    </div>
  `;
}

function renderRevealed(){
  const r = state.lastResolution;
  const p1=state.players[0], p2=state.players[1];
  const isLast = state.round >= MAX_ROUNDS;
  const BIG_ABILITIES = ['STEAL2','LOSS_BECOMES_WIN','SPY','NEGATE_STEAL','BAN_NEXT_2','COIN_FLIP'];
  const isBig = BIG_ABILITIES.includes(r.c1.ability) || BIG_ABILITIES.includes(r.c2.ability);
  return `
    ${renderHUD()}
    <div class="panel">
      <p class="hand-title">戦場：${r.field.icon} ${r.field.name} — ${r.field.desc}</p>
      <div class="reveal-row">
        <div class="reveal-slot">
          <div class="pname">${p1.name}</div>
          <div class="reveal-card ${cardClass(r.c1)}">
            <span class="icon">${r.c1.icon}</span>
            <div class="cname">${r.c1.name}</div>
            <div class="stats">${statsHtml(r.c1, r.fieldKey)}</div>
          </div>
        </div>
        <div class="vs">VS</div>
        <div class="reveal-slot">
          <div class="pname">${p2.name}</div>
          <div class="reveal-card ${cardClass(r.c2)}">
            <span class="icon">${r.c2.icon}</span>
            <div class="cname">${r.c2.name}</div>
            <div class="stats">${statsHtml(r.c2, r.fieldKey)}</div>
          </div>
        </div>
      </div>
      <div class="log-box ${isBig?'big-effect':''}">${r.log.join('<br>')}</div>
      <div class="sigil-diff">
        <div><div class="c-name">${p1.name}</div><div class="c-val">🩸 ${r.before[0]} → ${r.after[0]}</div></div>
        <div><div class="c-name">${p2.name}</div><div class="c-val">🩸 ${r.before[1]} → ${r.after[1]}</div></div>
      </div>
      ${renderReclaimBlock()}
      <button class="primary" ${state.pendingReclaim?'disabled':''} onclick="nextRound()">${isLast?'最終結果を見る':'次のラウンドへ'}</button>
    </div>
  `;
}

function renderReclaimBlock(){
  if(!state.pendingReclaim) return '';
  const owner = state.players[state.pendingReclaim.ownerIdx];
  const options = state.pendingReclaim.options.map(id=>{
    const c = getCard(id);
    return `
      <div class="card ${cardClass(c)}" onclick="doReclaim('${c.id}')">
        <span class="icon">${c.icon}</span>
        <span class="cname">${c.name}</span>
        <div class="stats">${statsHtml(c, currentFieldKey())}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="panel" style="border-color:var(--blood-soft);">
      <p class="hand-title">⚗️ ${owner.name} — 手札に戻すカードを1枚選んでください</p>
      <div class="hand-grid">${options}</div>
      <button class="ghost" onclick="skipReclaim()">回収しない</button>
    </div>
  `;
}

function renderEnd(){
  const p1=state.players[0], p2=state.players[1];
  const ai = state.aiChar;
  let winnerText, story;
  if(p1.crystals===p2.crystals){
    winnerText = '引き分け';
    story = DRAW_STORY;
  } else if(p1.crystals>p2.crystals){
    winnerText = p1.name + 'の勝利';
    story = ai.winStory;
  } else {
    winnerText = p2.name + 'の勝利';
    story = ai.loseStory;
  }
  return `
    <div class="panel end-screen">
      <div class="eyebrow">The Final Reckoning</div>
      <h2 style="color:var(--bone-soft); margin:6px 0; font-weight:700;">全${MAX_ROUNDS}ラウンド終了</h2>
      <div class="winner-name">🩸 ${winnerText}</div>
      <div class="final-scores">
        <div><div>${p1.name}</div><div class="val">🩸${p1.crystals}</div></div>
        <div><div>${p2.name}</div><div class="val">🩸${p2.crystals}</div></div>
      </div>
      <div class="story-panel">
        <span class="story-glyph">${ai.icon}</span>
        <p>${story}</p>
      </div>
      <button class="primary" onclick="goToTitle()">タイトルに戻る</button>
    </div>
  `;
}

function goToTitle(){
  stopBGM();
  state = null;
  render();
}

render();

</script>

<script>
function bootGame(lang){
  var boot = document.getElementById('boot');
  if(boot) boot.remove();

  var tpl = document.getElementById(lang === 'ja' ? 'tpl-style-ja' : 'tpl-style-en');
  document.head.appendChild(tpl.content.cloneNode(true));

  var src = document.getElementById(lang === 'ja' ? 'src-js-ja' : 'src-js-en').textContent;
  var s = document.createElement('script');
  s.textContent = src;
  document.body.appendChild(s);
}
</script>
